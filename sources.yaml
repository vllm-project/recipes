# Where recipe content comes from. Each channel is a named set of source
# repos; `scripts/assemble-content.mjs` merges a channel into
# `.content/<channel>/`, which the site and the JSON API read.
#
# Source fields:
#   repo   — GitHub `<owner>/<name>`; identity for edit links and fetching
#   ref    — branch or tag `sync-sources --update` resolves into sources.lock.json
#   path   — directory inside the repo holding models/ (and overlays/)
#   local  — read this local directory instead of fetching (path already applied)
#   role   — core | owner | overlay
#              core/owner: ship full recipes under models/<org>/<repo>.yaml;
#                          one hf_id may come from only one source
#              overlay:    ship overlays/<org>/<repo>.yaml fragments merged
#                          into another source's recipe (see overlay-merge.js)
#   scope  — what the source may contribute, granted here (not self-declared):
#              { tasks: [omni] }        owner: every recipe must carry the task
#              { exclude_tasks: [omni] } core/owner: no recipe may carry the task
#              { exclude_brands: [Huawei] } core/owner: no content for these
#                                       brands' hardware (it comes from their overlay)
#              { brands: [Huawei] }     overlay: only hardware keys of these brands
#   defers_to — another source in the channel, or a list of them: where both
#              ship a recipe, that source's copy wins and this one's is skipped
#              (for a migration: copies stay here until they are removed)
#
# Developers preview a local checkout via sources.local.yaml (gitignored):
#   overrides:
#     vllm: ~/vllm/recipes

schema_version: 1
default_channel: latest

channels:
  latest:
    vllm:
      repo: vllm-project/vllm
      ref: main
      path: recipes
      role: core
      scope: { exclude_tasks: [omni] }
    vllm-omni:
      repo: vllm-project/vllm-omni
      ref: main
      path: recipes
      role: owner
      scope: { tasks: [omni] }
    # Ascend content of the vLLM recipes, merged into them (add-only, Huawei
    # hardware keys only), plus recipes that run only on Ascend.
    vllm-ascend:
      repo: vllm-project/vllm-ascend
      ref: main
      path: recipes
      role: overlay
      scope: { brands: [Huawei] }
    metal:
      repo: vllm-project/vllm-metal
      ref: main
      path: recipes
      role: overlay
      scope: { brands: [Apple] }
    # models/ keeps copies of the vLLM and vLLM-Omni recipes until they are
    # synced upstream and removed: the upstream version renders; a recipe
    # merged here that upstream doesn't have yet renders from here.
    recipes:
      repo: vllm-project/recipes
      ref: main
      path: .
      local: .
      role: owner
      defers_to: [vllm, vllm-omni]
