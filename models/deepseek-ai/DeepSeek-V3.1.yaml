meta:
  title: "DeepSeek-V3.1"
  slug: "deepseek-v3.1"
  provider: "DeepSeek"
  description: "DeepSeek-V3.1 is a hybrid MoE model that supports dynamic switching between thinking and non-thinking modes, with tool calling and function execution."
  date_added: 2025-08-21
  date_updated: 2026-10-23
  difficulty: intermediate
  tasks:
    - text
  performance_headline: "Hybrid thinking / non-thinking MoE with native FP8 and tool calling"
  related_recipes:
    - "deepseek-ai/DeepSeek-V3"
    - "deepseek-ai/DeepSeek-V3.2-Exp"
  hardware:
    h200: verified
    mi300x: verified
    mi325x: verified
    mi355x: verified
    # Ascend NPU: declared per the official-runner CI wiring in companion PR
    # vllm-ascend/vllm-ascend-recipes#102 (head 856393f2); the recipe-verify run
    # currently skips cleanly until the quantized weights are baked into the
    # runner image (see that PR's models/_cache_paths.yaml). End-to-end
    # verification on real hardware is planned once the image ships the weights.
    ascend_910c: supported

model:
  model_id: "deepseek-ai/DeepSeek-V3.1"
  min_vllm_version: "0.12.0"
  default_frontend: rust
  architecture: moe
  parameter_count: "671B"
  active_parameters: "37B"
  context_length: 163840
  supports_dcp: true
  base_args:
    - "--trust-remote-code"
    - "--enable-expert-parallel"
  base_env: {}

features:
  tool_calling:
    description: "Enable DeepSeek-V3.1 tool calling with the deepseek_v31 tool-call parser."
    args:
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "deepseek_v31"
      - "--chat-template"
      - "examples/tool_chat_template_deepseekv31.jinja"
  reasoning:
    description: "Dynamic thinking mode via chat_template_kwargs={'thinking': true|false}. No separate parser flag is required; the chat template emits <think>...</think> content."
    args:
      - "--reasoning-parser"
      - "deepseek_v3"

  spec_decoding:
    description: "MTP speculative decoding — the W8A8 MTP QuaRot build ships an embedded MTP head; enabled by default on the Ascend variant below."
    modes:
      mtp:
        label: "MTP · W8A8 QuaRot (Ascend)"
        description: "3-token MTP from the W8A8 MTP QuaRot build on one Atlas 800 A3."
        args:
          - "--speculative-config"
          - '{"num_speculative_tokens": 3, "method": "mtp"}'
        variants: [ascend_w8a8]

opt_in_features: []

variants:
  default:
    precision: fp8
    vram_minimum_gb: 805
    description: "Native FP8 weights on 8xH200 (or H20) with 141GB per GPU"
  nvfp4:
    model_id: "nvidia/DeepSeek-V3.1-NVFP4"
    precision: nvfp4
    vram_minimum_gb: 403
    description: "NVIDIA NVFP4 quantized weights for Blackwell GPUs"
    extra_args:
      - "--kv-cache-dtype"
      - "fp8"

  ascend_w8a8:
    model_id: "Eco-Tech/DeepSeek-V3.1-w8a8-mtp-QuaRot"
    precision: int8
    label: "W8A8 MTP QuaRot (Ascend)"
    vram_minimum_gb: 822
    supported_hardware: [ascend_910c]
    tp: 4
    # DP4 is spelled out in extra_args because single_node_tp only emits
    # --tensor-parallel-size (same approach as #1161).
    default_modes:
      spec_decoding: mtp
    extra_args:
      - "--data-parallel-size"
      - "4"
      - "--quantization"
      - "ascend"
      - "--no-enable-prefix-caching"
      - "--max-num-seqs"
      - "16"
      - "--max-model-len"
      - "16384"
      - "--max-num-batched-tokens"
      - "4096"
      - "--gpu-memory-utilization"
      - "0.92"
      - "--served-model-name"
      - "deepseek_v3"
      - "--seed"
      - "1024"
    extra_env:
      HCCL_OP_EXPANSION_MODE: "AIV"
      VLLM_ASCEND_BALANCE_SCHEDULING: "1"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
    hardware_overrides:
      ascend_910c:
        docker_image: "quay.io/ascend/vllm-ascend:v0.30.0rc1-a3"
        docker_serve_command: "vllm serve"
        install:
          pip: false
          docker: true
    description: "ModelSlim W8A8 MTP QuaRot (weights on ModelScope: Eco-Tech/DeepSeek-V3.1-w8a8-mtp-QuaRot) — 1 Atlas 800 A3 (16 die), TP4×DP4 + MTP."

compatible_strategies:
  - single_node_tp
  - single_node_tep
  - single_node_dep
  - multi_node_tp
  - multi_node_tp_pp
  - multi_node_dep
  - multi_node_tep
  - pd_cluster

hardware_overrides:
  amd:
    extra_args: []
    extra_env:
      VLLM_ROCM_USE_AITER: "1"
      VLLM_ROCM_USE_AITER_MOE: "1"
      SAFETENSORS_FAST_GPU: "1"

strategy_overrides: {}

guide: |
  ## Overview

  DeepSeek-V3.1 is a hybrid MoE model that supports both thinking and non-thinking modes.
  You can dynamically switch between the two modes from the client by passing
  `extra_body={"chat_template_kwargs": {"thinking": True|False}}`.

  ## Prerequisites

  - **Hardware**: 8x H200/H20 (CUDA) or 8x MI300X / MI325X / MI355X (ROCm)
  - **vLLM**: Current stable release

  ### CUDA
  ```bash
  uv venv
  source .venv/bin/activate
  uv pip install -U vllm --torch-backend auto
  ```

  ### ROCm (MI300X, MI325X, MI355X)
  Requires Python 3.12, ROCm 7.2.1, and glibc >= 2.35.
  ```bash
  uv venv --python 3.12
  source .venv/bin/activate
  uv pip install vllm --extra-index-url https://wheels.vllm.ai/rocm/
  ```

  ## Launching DeepSeek-V3.1

  ### 8xH200 / 8xH20 (CUDA)

  ```bash
  vllm serve deepseek-ai/DeepSeek-V3.1 \
    --enable-expert-parallel \
    --tensor-parallel-size 8 \
    --served-model-name ds31
  ```

  ### 8xMI300X / MI325X / MI355X (ROCm)

  ```bash
  export SAFETENSORS_FAST_GPU=1
  export VLLM_ROCM_USE_AITER=1
  export VLLM_ROCM_USE_AITER_MOE=1

  vllm serve deepseek-ai/DeepSeek-V3.1 \
    --tensor-parallel-size 8 \
    --enable-expert-parallel
  ```

  ### Function calling

  vLLM supports user-defined tool calling for DeepSeek-V3.1. Add these flags when launching
  the server. The example chat template ships in the official container and can also be
  downloaded from the vLLM repo:
  [`tool_chat_template_deepseekv31.jinja`](https://github.com/vllm-project/vllm/blob/main/examples/tool_chat_template_deepseekv31.jinja).

  ```bash
  vllm serve ... \
    --enable-auto-tool-choice \
    --tool-call-parser deepseek_v31 \
    --chat-template examples/tool_chat_template_deepseekv31.jinja
  ```

  ## Client Usage

  ### OpenAI Python SDK

  Control thinking mode via `extra_body={"chat_template_kwargs": {"thinking": False}}`
  (or `True` to enable thinking).

  ```python
  from openai import OpenAI

  client = OpenAI(api_key="EMPTY", base_url="http://localhost:8000/v1")
  model = client.models.list().data[0].id

  messages = [
      {"role": "system", "content": "You are a helpful assistant"},
      {"role": "user", "content": "Who are you?"},
      {"role": "assistant", "content": "<think>Hmm</think>I am DeepSeek"},
      {"role": "user", "content": "9.11 and 9.8, which is greater?"},
  ]
  response = client.chat.completions.create(
      model=model,
      messages=messages,
      extra_body={"chat_template_kwargs": {"thinking": False}},
  )
  print(response.choices[0].message.content)
  ```

  When `thinking=True`, output includes a `</think>` segment delimiting chain-of-thought;
  when `thinking=False`, the model produces a direct answer without the thinking segment.

  ### curl

  ```bash
  curl http://localhost:8000/v1/chat/completions \
      -H "Content-Type: application/json" \
      -d '{
          "model": "ds31",
          "messages": [
              {"role": "user", "content": "9.11 and 9.8, which is greater?"}
          ],
          "chat_template_kwargs": {"thinking": true}
      }'
  ```

  ## References

  - [DeepSeek-V3.1 on Hugging Face](https://huggingface.co/deepseek-ai/DeepSeek-V3.1)
  - [vLLM tool chat template for DeepSeek-V3.1](https://github.com/vllm-project/vllm/blob/main/examples/tool_chat_template_deepseekv31.jinja)
