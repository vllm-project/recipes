meta:
  title: "DeepSeek-R1-Distill-Llama-70B"
  slug: "deepseek-r1-distill-llama-70b"
  provider: "DeepSeek"
  description: "DeepSeek R1 distilled into a 70B Llama model, with a CPU-validated Red Hat AI W8A8 variant."
  date_added: 2026-08-19
  date_updated: 2026-08-19
  difficulty: advanced
  tasks:
    - text
  performance_headline: "W8A8 variant validated for Intel Xeon 6 CPU execution"
  hardware:
    xeon6: verified

model:
  model_id: "deepseek-ai/DeepSeek-R1-Distill-Llama-70B"
  min_vllm_version: "0.7.1"
  architecture: dense
  parameter_count: "70B"
  active_parameters: "70B"
  context_length: 131072
  base_args: []
  base_env: {}

features:
  reasoning:
    description: "Extract DeepSeek-R1 reasoning content"
    args:
      - "--reasoning-parser"
      - "deepseek_r1"

opt_in_features:
  - reasoning

variants:
  default:
    precision: bf16
    vram_minimum_gb: 168
    description: "Full precision BF16 parent checkpoint"
  w8a8_int8:
    model_id: "RedHatAI/DeepSeek-R1-Distill-Llama-70B-quantized.w8a8"
    precision: int8
    vram_minimum_gb: 84
    description: "Red Hat AI INT8 W8A8 compressed-tensors checkpoint"

compatible_strategies:
  - single_node_tp
  - multi_node_tp

hardware_overrides: {}

strategy_overrides: {}

guide: |
  ## Overview

  This recipe groups the canonical DeepSeek-R1-Distill-Llama-70B checkpoint
  with the Red Hat AI W8A8 checkpoint validated on Intel Xeon 6.

  ## Prerequisites

  - Hardware: 8x Xeon6/Xeon5 NUMA node
  - vLLM >= 0.7.1

  ### Docker (Intel Xeon 6 CPUs)

  ```bash
  docker pull vllm/vllm-openai-cpu:latest-x86_64
  ```

  ## Intel Xeon 6

  ```bash
  vllm serve RedHatAI/DeepSeek-R1-Distill-Llama-70B-quantized.w8a8
  ```

  ## Runtime and Platform Tuning

  The following settings are intentionally not prescribed as portable CPU model
  defaults because they depend on the workload, hardware, or runtime environment:

  - `--max-num-batched-tokens`: scheduler/throughput tuning.
  - `--max-num-seqs`: concurrency and scheduler-capacity tuning.
  - `--gpu-memory-utilization`: platform memory-budget tuning.
  - `--no-enable-prefix-caching`: workload/benchmark cache-policy tuning.
  - `VLLM_ENGINE_ITERATION_TIMEOUT_S`: operational runtime timeout.

  These settings may still appear in validated hardware-specific overrides. Tune
  them at deployment time based on platform resources, workload shape, and
  latency/throughput goals.

  ## References

  - [Parent model](https://huggingface.co/deepseek-ai/DeepSeek-R1-Distill-Llama-70B)
  - [W8A8 variant](https://huggingface.co/RedHatAI/DeepSeek-R1-Distill-Llama-70B-quantized.w8a8)
  - [vLLM CPU installation](https://docs.vllm.ai/en/latest/getting_started/installation/cpu/)
