meta:
  title: "DeepSeek-OCR-2"
  slug: "deepseek-ocr-2"
  provider: "DeepSeek"
  description: "DeepSeek-OCR-2 — a multimodal OCR model for document text extraction, figure parsing, and document understanding; single-card serving on Ascend 910B with vLLM Ascend"
  date_added: 2026-10-14
  date_updated: 2026-10-14
  tasks:
    - multimodal
  performance_headline: "Single-card multimodal OCR serving on Ascend 910B (Atlas 800 A2) with vLLM Ascend"
  hardware:
    ascend_910b: verified

model:
  model_id: "deepseek-ai/DeepSeek-OCR-2"
  architecture: dense
  parameter_count: "3B"
  active_parameters: "3B"
  context_length: 8192
  base_args:
    - "--trust-remote-code"
  base_env: {}
  docker_image:
    ascend_910b: "quay.io/ascend/vllm-ascend:v0.30.0rc2"

variants:
  default:
    precision: bf16
    vram_minimum_gb: 8
    supported_hardware: [ascend_910b]
    hardware_overrides:
      ascend_910b:
        docker_image: "quay.io/ascend/vllm-ascend:v0.30.0rc2"
        install:
          pip: false
        extra_args:
          - "--gpu-memory-utilization"
          - "0.8"
    description: "BF16 checkpoint on a single 64 GB Ascend 910B NPU (TP1, gpu-memory-utilization 0.8), verified end-to-end with vLLM Ascend"

compatible_strategies:
  - single_node_tp

hardware_overrides: {}
strategy_overrides: {}

dependencies: []

guide: |
  ## Overview

  DeepSeek-OCR-2 is a multimodal OCR model from DeepSeek for document text extraction, figure
  parsing, and multimodal document understanding. It can be deployed on a single Atlas 800 A2
  with vLLM Ascend. Single-node deployment is recommended; Prefill-Decode disaggregation is not
  required.

  ## Prerequisites

  - **Hardware:** 1x Ascend 910B NPU (64 GB HBM), Atlas 800 A2 series
  - **Runtime:** official vLLM Ascend Docker image (Ascend installs are docker-only —
    there is no official pip wheel):

    ```bash
    docker pull quay.io/ascend/vllm-ascend:v0.30.0rc2
    ```

  - **Checkpoint:** download the BF16 weights and record the local path

    ```bash
    pip install modelscope
    modelscope download --model deepseek-ai/DeepSeek-OCR-2
    ```

  ## Launching the Server

  ### Single Ascend 910B (TP1)

  Start the container with the NPU devices mounted, then serve the model:

  ```bash
  export IMAGE=quay.io/ascend/vllm-ascend:v0.30.0rc2

  docker run --rm \
      --name vllm-ascend \
      --shm-size=1g \
      --net=host \
      --device /dev/davinci0 \
      --device /dev/davinci_manager \
      --device /dev/devmm_svm \
      --device /dev/hisi_hdc \
      -v /usr/local/dcmi:/usr/local/dcmi \
      -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool \
      -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
      -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
      -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
      -v /etc/ascend_install.info:/etc/ascend_install.info \
      -v /root/.cache:/root/.cache \
      -it $IMAGE bash
  ```

  ```bash
  export PYTORCH_NPU_ALLOC_CONF="expandable_segments:True"

  vllm serve /root/.cache/models/DeepSeek-OCR-2 \
      --served-model-name deepseekocr2 \
      --trust-remote-code \
      --tensor-parallel-size 1  \
      --port 1055 \
      --max_model_len 8192 \
      --no-enable-prefix-caching \
      --gpu-memory-utilization 0.8 \
      --allowed-local-media-path / \
      --additional-config '{
        "weight_nz_mode": 0,
        "enable_cpu_binding": true,
        "multistream_overlap_shared_expert": true,
        "ascend_compilation_config": {"fuse_qknorm_rope": false}
      }' \
      --mm-processor-cache-gb 0
  ```

  ## Verifying the Deployment

  Once your server is started, you can query the model with a prompt:

  ```bash
  curl http://localhost:1055/v1/completions \
      -H "Content-Type: application/json" \
      -d '{
          "model": "deepseekocr2",
          "prompt": "The future of AI is",
          "max_completion_tokens": 50,
          "temperature": 0
      }'
  ```

  Expected result: HTTP 200 with a coherent continuation. Startup logs contain
  `Application startup complete`.

  ## Accuracy Evaluation

  AISBench results from the official tutorial (1 Atlas 800 A2):

  | dataset | version | metric | mode | vllm-api-general-chat | note |
  | ------- | ------- | ------ | ---- | --------------------- | ---- |
  | textvqa | - | accuracy | gen | 50.28 | 1 Atlas 800 A2 |
  | omnidocbench | - | accuracy | gen | 66.86 | 1 Atlas 800 A2 |

  For setup details, see [Using AISBench](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/evaluation/using_ais_bench.html).

  ## Performance Evaluation

  Official tutorial performance result:

  - **Hardware**: A2-313T, 1 node
  - **Input/Output**: 1080P/256
  - **Performance**: TTFT = 2s, TPOT = 200ms, average performance of each card is 864 TPS (tokens per second).

