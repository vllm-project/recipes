meta:
  title: "Kimi-K3-NVFP4"
  slug: "kimi-k3-nvfp4"
  provider: "Red Hat AI"
  description: "RedHatAI compressed-tensors NVFP4 quantization of Kimi-K3, a 2.8T-parameter native multimodal MoE, with MoE layers quantized to NVFP4 for accelerated Blackwell inference"
  date_added: 2026-08-04
  date_updated: 2026-08-04
  difficulty: hard
  tasks:
    - multimodal
    - text
  performance_headline: "NVFP4 MoE quantization, GPQA 91.0 vs 93.5 baseline"
  related_recipes:
    - "moonshotai/Kimi-K3"
  default_hardware: b300
  hardware:
    b200: verified
    b300: verified
    gb200: verified
    gb300: verified

model:
  model_id: "RedHatAI/Kimi-K3-NVFP4"
  min_vllm_version: "0.27.0"
  docker_image:
    nvidia:
      cu130: "vllm/vllm-openai:kimi-k3"
  nightly_required: true
  install:
    docker:
      note: "Use a K3-enabled nightly image. CUDA 13 (cu130) build only — no -cu129 tag; host needs an r580+ NVIDIA driver."
    pip:
      note: "Use a K3-enabled vLLM nightly after the integration lands."
  architecture: moe
  parameter_count: "1.6T"
  active_parameters: "16 experts/token + shared (of 896 routed)"
  context_length: 1048576
  base_args:
    - "--trust-remote-code"
    - "--load-format"
    - "instanttensor"
    - "--moe-backend"
    - "auto"
    - "--gpu-memory-utilization"
    - "0.95"
  base_env: {}

features:
  tool_calling:
    description: "Enable automatic tool choice with the Kimi K3 tool-call parser."
    args:
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "kimi_k3"
  reasoning:
    description: "Parse Kimi K3 reasoning output separately from the final answer."
    args:
      - "--reasoning-parser"
      - "kimi_k3"
  spec_decoding:
    description: "Use Inferact trained DSpark speculative decoding."
    strategies:
      - single_node_tp
      - multi_node_tp
      - multi_node_tep
      - multi_node_dep
      - multi_node_tp_dp
      - pd_cluster
    args:
      - "--speculative-config"
      - '{"model":"Inferact/Kimi-K3-DSpark", "num_speculative_tokens":7, "method": "dspark", "attention_backend": "FLASHINFER_MLA", "draft_sample_method": "probabilistic", "rejection_sample_method": "block"}'
  text_only:
    description: "Skip the vision encoder for text-only workloads."
    args:
      - "--language-model-only"

opt_in_features:
  - spec_decoding
  - text_only

variants:
  default:
    precision: nvfp4
    vram_minimum_gb: 1650
    description: "MoE layers quantized to NVFP4; attention and embeddings remain at higher precision."

compatible_strategies:
  - single_node_tp
  - multi_node_tp
  - multi_node_tep
  - multi_node_tp_pp
  - multi_node_dep
  - multi_node_tp_dp
  - pd_cluster

strategy_hardware:
  multi_node_tp_dp:
    h100: unsupported
    b200: unsupported
    b300: unsupported
    mi300x: unsupported
    mi325x: unsupported
    mi355x: unsupported
  multi_node_dep:
    h100: unsupported
    h200: unsupported

default_strategy: single_node_tp

strategy_min_gpus:
  single_node_tp: 8
  multi_node_tp: 8
  multi_node_tp_dp: 16
  multi_node_tep: 8
  multi_node_tp_pp: 16
  multi_node_dep: 16
  h100: 32

hardware_overrides:
  blackwell:
    extra_args:
      - "--no-enable-flashinfer-autotune"
      - "--max-model-len"
      - "1048576"
      - "--kv-cache-dtype"
      - "fp8"
      - "--attention-config"
      - '{"use_prefill_query_quantization":true,"mla_prefill_backend":"TRTLLM_RAGGED"}'
      - "--enable-prefix-caching"
    extra_env:
      VLLM_ENABLE_K3_LATENT_MOE_TAIL_FUSION: "1"
      VLLM_ALLREDUCE_USE_FLASHINFER: "1"
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_USE_RUST_FRONTEND: "1"

strategy_overrides:
  multi_node_dep:
    extra_args:
      - "--moe-backend"
      - "deep_gemm_mega_moe"

  multi_node_tp_pp:
    extra_args:
      - "--gpu-memory-utilization"
      - "0.90"
      - "--max-num-batched-tokens"
      - "8192"
    extra_env:
      NCCL_CUMEM_ENABLE: "1"
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"

  pd_cluster:
    router:
      intra_node_data_parallel_size: 1
    env:
      NCCL_CUMEM_ENABLE: "1"
      NCCL_MNNVL_ENABLE: "1"
      NCCL_NVLS_ENABLE: "0"
      VLLM_SSM_CONV_STATE_LAYOUT: "DS"
    hardware_overrides:
      blackwell:
        extra_env:
          VLLM_ENABLE_K3_LATENT_MOE_TAIL_FUSION: "1"
          UCX_TLS: "rc,cuda_copy"
    prefill:
      parallelism: tep
      tp: 8
      vllm_args:
        - "--enforce-eager"
        - "--max-num-batched-tokens"
        - "16384"
        - "--no-disable-hybrid-kv-cache-manager"
        - "--no-enable-flashinfer-autotune"
      env: {}
    decode:
      parallelism: dep
      tp: 1
      env: {}
      vllm_args:
        - "--data-parallel-hybrid-lb"
        - "--moe-backend"
        - "deep_gemm_mega_moe"
        - "--no-enable-prefix-caching"
        - "--max-num-seqs"
        - "32"
        - "--max-num-batched-tokens"
        - "32"
        - "--no-disable-hybrid-kv-cache-manager"

guide: |
  ## Overview

  RedHatAI Kimi-K3-NVFP4 is a compressed-tensors NVFP4 quantization of Moonshot AI's Kimi-K3, a 2.8-trillion-parameter Mixture-of-Experts model (16 of 896 experts active per token). The MoE layers are quantized to NVFP4 while attention, KV cache, and embeddings remain at higher precision, enabling efficient Blackwell deployment with minimal accuracy degradation (GPQA: 91.0 vs 93.5 baseline).

  ## Prerequisites

  - **CUDA:** Host needs an r580+ NVIDIA driver.
  - **Hardware:** At least 8× B300 or 2 nodes of B200/GB200/GB300 GPUs.

  ## Client Usage

  Once the vLLM server is running, consume it via the OpenAI-compatible API:

  ```python
  import time
  from openai import OpenAI

  client = OpenAI(
      api_key="EMPTY",
      base_url="http://localhost:8000/v1",
      timeout=3600
  )

  messages = [
      {
          "role": "user",
          "content": [
              {
                  "type": "image_url",
                  "image_url": {
                      "url": "https://ofasys-multimodal-wlcb-3-toshanghai.oss-accelerate.aliyuncs.com/wpf272043/keepme/image/receipt.png"
                  }
              },
              {
                  "type": "text",
                  "text": "Read all the text in the image."
              }
          ]
      }
  ]

  start = time.time()
  response = client.chat.completions.create(
      model="RedHatAI/Kimi-K3-NVFP4",
      messages=messages,
      max_tokens=2048
  )
  print(f"Response costs: {time.time() - start:.2f}s")
  print(f"Generated text: {response.choices[0].message.content}")
  ```

  ## Notes

  - **Load format:** `--load-format instanttensor` is included by default for faster weight loading with this compressed-tensors checkpoint.
  - **Cross-node communication:** Use `--all2all-backend deepep_v2` for RDMA and `--all2all-backend flashinfer_nvlink_one_sided` for NVLink.
  - **MoE backend:** Use `deep_gemm_mega_moe` for any DEP environment.
  - **FP8 KV cache:** On Blackwell, `--kv-cache-dtype fp8` is paired with `--attention-config '{"use_prefill_query_quantization":true,"mla_prefill_backend":"TRTLLM_RAGGED"}'`.
  - **MNNVL environments** (GB200/GB300 NVL): add `NCCL_MNNVL_ENABLE=1`, `NCCL_CUMEM_ENABLE=1`, and `NCCL_NVLS_ENABLE=1`.
  - **RDMA:** Set `UCX_TLS="rc,cuda_copy"` to ensure KV cache transfer goes through RDMA.
  - **max-model-len:** Adjust for different benchmark scenarios to balance performance and memory.

  ## References

  - [Model card](https://huggingface.co/RedHatAI/Kimi-K3-NVFP4)
  - [Base model (Kimi-K3)](https://huggingface.co/moonshotai/Kimi-K3)
  - [vLLM compressed-tensors support PR](https://github.com/vllm-project/vllm/pull/50500)
