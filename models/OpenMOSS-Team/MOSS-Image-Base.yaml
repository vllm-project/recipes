  - [MOSS-Image project and user guide](https://github.com/OpenMOSS/MOSS-Image)
  - [vLLM-Omni implementation PR #8926](https://github.com/vllm-project/vllm-omni/pull/8926)
  - [vLLM-Omni Docker images](https://hub.docker.com/r/vllm/vllm-omni/tags?name=mosimage)
