# yaml-language-server: $schema=https://recipes.vllm.ai/recipe.schema.json
meta:
  title: "FastH3 Omni 8-Step V1"
  slug: "fasth3-omni-8-step-v1"
  provider: "FastVideo"
  description: "Experimental reference-conditioned video and audio generation with an eight-forward PDD student of MiniMax-H3, served through vLLM-Omni."
  date_added: 2026-10-20
  date_updated: 2026-10-20
  tasks: [omni]
  default_hardware: rtx_pro_5000_8x
  related_recipes: ["MiniMaxAI/MiniMax-H3"]
  hardware:
    rtx_pro_5000_8x: supported
    rtx_pro_6000_8x: supported

model:
  model_id: "FastVideo/FastVideo-FastH3-Omni-8-Step-V1"
  # This is the core dependency of the pinned integration, not a claim that
  # installing the vLLM wheel alone provides FastH3 Omni support.
  min_vllm_version: "0.32.0"
  install:
    pip:
      note: "Source preview: requires vLLM-Omni PR #9167 at the pinned commit, Linux x86_64, Python 3.12, a CUDA 13-compatible driver, and a compatible Blackwell sparse kernel. Complete the provider checks in the guide before serving."
      command: |
        uv venv --python 3.12
        source .venv/bin/activate
        uv pip install --torch-backend=cu130 \
          "vllm @ https://wheels.vllm.ai/5df63a7203cdb9328d824a27b682e77c7b9928be/vllm-0.32.0-cp38-abi3-manylinux_2_28_x86_64.whl"
        git clone https://github.com/vllm-project/vllm-omni.git
        cd vllm-omni
        git fetch origin 4f0c51478015c306e73f19f6a87920e22410f2cf
        git checkout --detach 4f0c51478015c306e73f19f6a87920e22410f2cf
        uv pip install -e .
        uv pip check
    docker: false
  architecture: dense
  # Pending direct verification of the released checkpoint metadata. Do not
  # reuse the base H3 parameter count for this student's multi-head export.
  parameter_count: "Unverified"
  context_length: 0
  base_args:
    - "--revision"
    - "88d512c5e7cc38dda499fbb65688ce58611f9c80"
    - "--host"
    - "127.0.0.1"
    - "--trust-remote-code"
    - "--task-type"
    - "ref2va"
    - "--served-model-name"
    - "FastVideo/FastVideo-FastH3-Omni-8-Step-V1"
    - "--num-gpus"
    - "8"
    - "--tensor-parallel-size"
    - "1"
    - "--usp"
    - "8"
    - "--ring"
    - "1"
    - "--enforce-eager"
    - "--use-hsdp"
    - "--hsdp-shard-size"
    - "8"
    - "--hsdp-replicate-size"
    - "1"
    - "--text-encoder-tp-size"
    - "8"
    - "--vae-patch-parallel-size"
    - "8"
    - "--vae-parallel-mode"
    - "tile"
    - "--vae-use-tiling"
    - "--diffusion-attention-config.default.backend"
    - "FASTVIDEO_VSA"
  base_env:
    CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
    VLLM_WORKER_MULTIPROC_METHOD: "spawn"
    VLLM_OMNI_VIDEO_SYNC_TIMEOUT: "14400"

omni:
  port: 8096
  task_label: "Reference input"
  task_hint: "Ref2VA only: supply at least one image or video. This source-preview recipe has not been qualified end-to-end over HTTP."
  tasks:
    - id: i2v
      key: ref2va
      label: "Ref2VA - Image"
      endpoint: "/v1/videos/sync"
      description: "A reference image and text prompt to video with generated stereo audio."
      curl: |
        export REF_IMAGE=/path/to/reference.png
        curl --fail-with-body -sS http://127.0.0.1:8096/v1/videos/sync \
          -F 'model=FastVideo/FastVideo-FastH3-Omni-8-Step-V1' \
          -F 'prompt=The subject performs a saxophone solo on a softly lit stage. The camera slowly moves closer; generate matching saxophone music and room ambience.' \
          -F "input_reference=@${REF_IMAGE};type=image/png" \
          -F 'width=1344' -F 'height=768' -F 'aspect_ratio=16:9' -F 'fps=24' \
          -F 'num_inference_steps=8' -F 'guidance_scale=1' -F 'flow_shift=12' \
          -F 'seed=43' \
          -F 'extra_params={"task":"ref2va","duration":5.2,"audio_flow_shift":3.0}' \
          -o fasth3_omni.mp4
      benchmark: |
        # Run the Ref2VA cURL example once to warm up, then repeat the identical
        # request three times with: --write-out '\nclient_total_s=%{time_total}\n'
        # Keep concurrency at 1 and report the median client time.
        # This includes HTTP and output transfer; it is not the offline timing
        # reported in the guide. Validate every output with ffprobe and ffmpeg.

variants:
  default:
    precision: bf16
    # Conservative provisioned capacity of the documented 8 x 72 GB setup.
    # This is not a measured minimum, a parameter-derived estimate, or a
    # conversion of the allocator peak into a deployment requirement.
    vram_minimum_gb: 576
    description: "BF16 student and native components; capacity hint uses the documented 8×72 GB setup. Minimum capacity and current-source HTTP performance remain unqualified."
    supported_hardware: [rtx_pro_5000_8x, rtx_pro_6000_8x, b200, b300]

compatible_strategies: []

guide: |
  ## Overview and status

  [FastH3 Omni 8-Step V1](https://huggingface.co/FastVideo/FastVideo-FastH3-Omni-8-Step-V1)
  generates video and audio from a text prompt and visual references. This is the
  **Ref2VA** student, distinct from the four-step FastH3 LoRA and the eight-step
  FastH3 V2 text-to-video checkpoint described in the
  [FastH3 family overview](https://github.com/vllm-project/vllm-omni/blob/4f0c51478015c306e73f19f6a87920e22410f2cf/recipes/FastVideo/README.md).
  Do not substitute their weights or sampling settings.

  This recipe targets the experimental implementation in
  [vLLM-Omni PR #9167](https://github.com/vllm-project/vllm-omni/pull/9167),
  pinned to `4f0c51478015c306e73f19f6a87920e22410f2cf`. The PR was open when this
  recipe was prepared. A generic released wheel or a nightly image is not a
  substitute for that source revision.

  The commands are checked against the integration's source and documentation.
  They have not been run end-to-end by this recipe's contributor. The Hugging Face
  model card, checkpoint access and total parameter count still need direct
  verification; the model and native-component revisions below are those recorded
  in the integration. No hardware profile is marked verified.

  ## Prerequisites and model access

  - Linux x86_64, Python 3.12, and a CUDA 13-compatible NVIDIA driver.
  - Eight GPUs for the command builder's TP1/Ulysses8/HSDP8 configuration.
    The historical deployment used eight RTX PRO 5000 Blackwell 72 GB cards.
    B200/B300 and RTX PRO 6000 8x are compatible-provider deployment candidates,
    not additional measured configurations.
  - `ffmpeg` and `ffprobe` on `PATH`, plus `uv` and Git.
  - Access to both the student checkpoint and its pinned native MiniMax-H3
    components. If access is gated, obtain access and run `hf auth login`.

  The student revision is `88d512c5e7cc38dda499fbb65688ce58611f9c80`.
  Its loader reads `transformer_ref/` and resolves the native text encoder,
  tokenizer, processor and VAEs from MiniMax-H3 revision
  `9bfb6693f2cf6de171db46d1aa586f67d773a1da`, as pinned by the release contract.
  It does not need either base-model DiT. Do not replace the pinned components
  with the latest base-model snapshot.

  The displayed 576 GB capacity hint describes the provisioned eight-card
  baseline, not the minimum memory needed. Parameter-based sizing is pending
  checkpoint metadata verification. Host memory, weight storage and temporary
  buffers must also fit; GPU allocator peaks alone do not establish that.

  ## Installation and sparse provider

  Run the complete Install command above in a new environment. It uses the
  exact vLLM 0.32.0 wheel from the integration's
  [CUDA source installation instructions](https://github.com/vllm-project/vllm-omni/blob/4f0c51478015c306e73f19f6a87920e22410f2cf/docs/getting_started/installation/gpu/cuda.inc.md).
  Keep the installed CUDA/PyTorch stack compatible when adding kernels.

  For **RTX PRO Blackwell (SM120)**, check the FlashInfer provider before
  downloading weights:

  ```bash
  python -c 'from flashinfer.cute_dsl.sparse.bsa_attn_sm120 import bsa_attn_sm120_blk64_fwd'
  ```

  The integration reports kernel regressions with FlashInfer `0.7.0.post1`,
  PyTorch `2.13.0+cu130`, Triton `3.7.1`, CUTLASS DSL `4.8.0` and vLLM `0.32.0`.
  If the import fails, install a compatible FlashInfer build exposing this API
  before launching. The provider splits logical 128-token tiles into 64-token
  compute blocks while preserving the selected keys and softmax reduction.

  For **B200/B300 (SM100/SM103)**, from the pinned vLLM-Omni checkout:

  ```bash
  uv pip install -e '.[vsa]'
  python -c 'from fastvideo_kernel import block_sparse_attn_sm100a'
  uv pip check
  ```

  The extension must contain native code for the actual device and support
  BF16, head dimension 128 and 128-token blocks. Import success only checks
  API availability; a tile64-only build is insufficient. Install a compatible
  native FastVideo kernel build if the supplied wheel lacks those capabilities.

  Leave sparse provider selection at `auto` and precision at `bf16`. Explicit
  tile64-provider overrides and Sage precision are rejected for this checkpoint.
  Missing kernels or incompatible hardware fail explicitly; dense attention is
  not a fallback. Other GPU families need an additional compatible tile128
  implementation.

  ## Launch and generate

  Select the actual eight-GPU profile, run its generated Serve command, and
  wait for startup. It uses BF16, TP1, Ulysses8, HSDP8, encoder TP8, tiled VAE
  parallelism 8, and eager execution. HSDP shards weights without quantization.

  ```bash
  curl --fail http://127.0.0.1:8096/health
  curl --fail http://127.0.0.1:8096/v1/models
  ```

  Confirm that the model list contains
  `FastVideo/FastVideo-FastH3-Omni-8-Step-V1`. Set `REF_IMAGE` to a local PNG,
  then use the Ref2VA cURL example. The response body is the MP4, including
  generated stereo audio. A successful health response alone is not an
  inference test.

  The API requires at least one image or video. Audio-only and text-only
  requests are not supported by this student. For mixed references, the
  integration preserves ordering within each modality and packs images,
  videos with their soundtracks, then separate audio. Match that order when
  comparing against FastVideo.

  ## Fixed sampling contract

  | Setting | Required value |
  | --- | --- |
  | Task | `ref2va` |
  | Transformer forwards / `num_inference_steps` | `8` |
  | Video / audio shift | `12` / `3` |
  | Guidance | `1` |
  | PDD Grid32 indices | `[0,4,8,12,16,20,24,28,32]` |
  | Initial noise endpoint | `0.999` |
  | VSA layout / sparsity | logical 128-token `(4,4,8)` tiles / 90% |
  | Reference-video policy | `p2_multi_region`, separate 10% tile budget per video |

  Text, images and audio retain dense attention. Reference rows stay fixed
  during denoising. Do not override top-k, timesteps, sigmas or the PDD grid,
  add LoRA adapters, or request partial-schedule latent refinement. The
  integration rejects these combinations.

  ## Output checks and measurement

  ```bash
  ffprobe -v error -count_frames \
    -show_entries stream=codec_name,width,height,nb_read_frames,r_frame_rate,sample_rate,channels \
    -of json fasth3_omni.mp4
  ffmpeg -v error -i fasth3_omni.mp4 -map 0:v:0 -map 0:a:0 -f null -
  ```

  Check both streams, 1344×768 video at 24 FPS and 32 kHz stereo audio.
  The duration is snapped to a legal frame count; a 5.2-second request in the
  historical workload produced 124 frames, about 5.167 seconds.

  For a new HTTP measurement, discard one warmup and make three identical
  requests sequentially. Add `--write-out '\nclient_total_s=%{time_total}\n'`
  to the cURL example and report the median. Record the source SHA, model
  revision, complete software versions, GPU model/count, prompt, references,
  seed and output checks. This timing includes HTTP and output transfer.

  The upstream [Omni recipe](https://github.com/vllm-project/vllm-omni/blob/4f0c51478015c306e73f19f6a87920e22410f2cf/recipes/FastVideo/FastH3-Omni.md#benchmark-8-nvidia-rtx-pro-5000)
  reports the following **historical offline development baseline** on
  8× RTX PRO 5000 72 GB, BF16, batch size and concurrency 1:

  | Frames | Duration at 24 FPS | Sampling | Generation latency | Allocator peak |
  | --- | --- | --- | --- | --- |
  | 124 | 5.167 s | Three requests after one warmup | 41.04 s median | 35.15 GiB |
  | 345 | 14.375 s | One request, no shape-specific warmup | 95.93 s | 38.94 GiB |

  Timing covers `Omni.generate` through encoded MP4 bytes, excluding startup,
  downloads and file writes. Memory is the framework's CUDA allocator
  high-water mark, not whole-device usage or a minimum capacity requirement.
  The baseline used vLLM 0.30.0 and an earlier FlashInfer revision; it does
  not qualify the pinned vLLM 0.32.0 source or its HTTP serving path.

  The three measured short outputs were byte-identical, but warmup audio
  differed for an undiagnosed reason. Cross-provider full-model equivalence
  and quality against native SM100/SM103 execution remain unverified.

  ## Troubleshooting

  - **Unknown model or missing checkpoint contract:** check the pinned Omni
    source, model revision, access grants and `fastvideo_inference.json`.
  - **Provider import or kernel failure:** use the provider for the actual
    compute capability; do not replace tile128 routing with a tile64 override.
  - **Request rejected:** keep the fixed eight-step, guidance and shift values,
    use `ref2va`, and supply at least one image or video.
  - **Out of memory:** reproduce the eight-GPU topology and profile the exact
    reference count and output shape. The historical allocator peak is not
    a guarantee that a smaller GPU configuration will work.
  - **MP4 missing audio or failing decode:** inspect server logs and run both
    media checks; an HTTP success code is not sufficient validation.

  ## References

  - [Student checkpoint](https://huggingface.co/FastVideo/FastVideo-FastH3-Omni-8-Step-V1)
  - [Native MiniMax-H3 components](https://huggingface.co/MiniMaxAI/MiniMax-H3)
  - [Model integration PR #9167](https://github.com/vllm-project/vllm-omni/pull/9167)
  - [Pinned upstream Omni recipe and measurement methodology](https://github.com/vllm-project/vllm-omni/blob/4f0c51478015c306e73f19f6a87920e22410f2cf/recipes/FastVideo/FastH3-Omni.md)
  - [Pinned checkpoint contract implementation](https://github.com/vllm-project/vllm-omni/blob/4f0c51478015c306e73f19f6a87920e22410f2cf/vllm_omni/diffusion/models/minimax_h3/fasth3_checkpoint.py)
  - [vLLM-Omni Video API](https://docs.vllm.ai/projects/vllm-omni/en/latest/serving/videos_api/)
