meta:
  title: "K2-Horizon-36B"
  slug: "k2-horizon-36b"
  provider: "IFM"
  description: "Sparse MoVA and MoE long-context model for research and production-style serving experiments"
  date_added: 2026-08-31
  date_updated: 2026-08-31
  difficulty: advanced
  tasks: [text]
  performance_headline: "37.44B stored parameters including embeddings / 5.95B active parameters per token"
  related_recipes: ["IFM/K2-Horizon-32B", "IFM/K2-Horizon-375B"]
  hardware:
    h200: verified
model:
  model_id: "IFM/K2-Horizon-36B"
  min_vllm_version: "0.27"
  nightly_required: true
  install:
    docker: false
    pip:
      note: "Native support requires the reviewed vLLM PR #53806 source revision"
      command: "uv pip install 'vllm @ git+https://github.com/vllm-project/vllm.git@d9fd5f11423a1a5628fe29e7296ceb9de91aac3c'"
  architecture: moe
  parameter_count: "37.44B"
  active_parameters: "5.95B"
  context_length: 524288
  base_args: ["--model-impl", "vllm", "--trust-remote-code", "--dtype", "bfloat16", "--max-model-len", "131072"]
  base_env: {}
features:
  reasoning:
    description: "Extract K2-Horizon reasoning into reasoning_content"
    args: ["--reasoning-parser", "k2_horizon"]
  tool_calling:
    description: "Enable automatic tool choice with the K2-Horizon parser"
    args: ["--enable-auto-tool-choice", "--tool-call-parser", "k2_horizon"]
variants:
  default:
    precision: bf16
    vram_minimum_gb: 90
    description: "BF16 evaluation runtime with native vLLM execution"
compatible_strategies: [single_node_tp, multi_node_tp, multi_node_tp_pp]
hardware_overrides: {}
strategy_overrides:
  single_node_tp:
    tp: 2
guide: |
  ## Overview

  K2-Horizon-36B is a mixture-of-expert (MoE) model in the IFM K2-Horizon
  family. It combines MoVA attention and MoE layers, with 37.44B stored parameters
  including embeddings, 5.95B active parameters per token, and support for up
  to 524,288 tokens of context.

  K2-Horizon is an open-weight IFM model family built for transparent
  foundation-model research, staged checkpoint analysis, and practical
  deployment. The series spans compact dense models for local experimentation,
  dense mid-size and large models for high-quality research workloads, and
  mixture-of-expert (MoE) models such as K2-Horizon-36B for higher-capacity
  serving.

  ## Launch Commands

  ```bash
  vllm serve IFM/K2-Horizon-36B \
    --model-impl vllm \
    --tensor-parallel-size 2 \
    --trust-remote-code \
    --dtype bfloat16 \
    --max-model-len 131072 \
    --reasoning-parser k2_horizon \
    --enable-auto-tool-choice \
    --tool-call-parser k2_horizon
  ```

  ## Client usage

  ```python
  from openai import OpenAI

  client = OpenAI(
      api_key="EMPTY", base_url="http://localhost:8000/v1", timeout=3600
  )

  resp = client.chat.completions.create(
      model="IFM/K2-Horizon-36B",
      messages=[{"role": "user", "content": "Give me three primes above 100."}],
      temperature=1.0, top_p=0.95, max_tokens=2048,
  )
  print(resp.choices[0].message.content)
  ```

  ### Thinking modes

  The model supports selectable thinking through `chat_template_kwargs`, per
  request or server-wide via `--default-chat-template-kwargs`:

  - `{"reasoning_effort": "high"}` — full thinking (default).
  - `{"reasoning_effort": "medium"}` — faster thinking.
  - `{"reasoning_effort": "low"}` — fastest thinking.

  ## References

  - [IFM/K2-Horizon-36B on Hugging Face](https://huggingface.co/IFM/K2-Horizon-36B)
  - [K2 Horizon Collection](https://huggingface.co/collections/IFM/k2-horizon)
