meta:
  title: "K2-Horizon-7B"
  slug: "k2-horizon-7b"
  provider: "IFM"
  description: "Dense base model for long-context research, fine-tuning, and cost-conscious deployment"
  date_added: 2026-08-31
  date_updated: 2026-08-31
  difficulty: advanced
  tasks: [text]
  performance_headline: "9B stored parameters with up to 512K context"
  related_recipes: ["IFM/K2-Horizon-3.7B", "IFM/K2-Horizon-32B"]
model:
  model_id: "IFM/K2-Horizon-7B"
  min_vllm_version: "0.27"
  nightly_required: true
  install:
    docker: false
    pip:
      note: "Requires the reviewed vLLM PR #53806 source revision"
      command: "uv pip install 'vllm @ git+https://github.com/vllm-project/vllm.git@d9fd5f11423a1a5628fe29e7296ceb9de91aac3c'"
  architecture: dense
  parameter_count: "9B"
  active_parameters: "9B"
  context_length: 524288
  base_args: ["--model-impl", "vllm", "--trust-remote-code", "--dtype", "bfloat16", "--max-model-len", "131072"]
  base_env: {}
features:
  reasoning:
    description: "Extract K2-Horizon reasoning into reasoning_content"
    args: ["--reasoning-parser", "k2_horizon"]
  tool_calling:
    description: "Enable automatic tool choice with the K2-Horizon parser"
    args: ["--enable-auto-tool-choice", "--tool-call-parser", "k2_horizon"]
variants:
  default:
    precision: bf16
    vram_minimum_gb: 22
    description: "BF16 evaluation runtime with a 131K serving context baseline"
compatible_strategies: [single_node_tp, multi_node_tp, multi_node_tp_pp]
hardware_overrides: {}
guide: |
  ## Overview

  K2-Horizon-7B is a dense base checkpoint with 9B stored parameters and up to
  524,288 tokens of context. Its larger hidden dimension provides additional
  capacity over the smaller family members while remaining suitable for
  cost-conscious single-node deployment. The model targets research,
  fine-tuning, evaluation, and long-context experimentation rather than
  assistant use out of the box. Applications should add their own prompting,
  safety controls, and validation, and should measure KV-cache use before
  extending the recipe beyond its 131,072-token serving baseline.

  ## Launch

  ```bash
  vllm serve IFM/K2-Horizon-7B \
    --model-impl vllm \
    --trust-remote-code \
    --dtype bfloat16 \
    --max-model-len 131072 \
    --reasoning-parser k2_horizon \
    --enable-auto-tool-choice \
    --tool-call-parser k2_horizon
  ```

  Increase context and concurrency only after checking KV-cache capacity.

  ## References

  - [IFM/K2-Horizon-7B on Hugging Face](https://huggingface.co/IFM/K2-Horizon-7B)
  - [K2 Horizon Collection](https://huggingface.co/collections/IFM/k2-horizon)
