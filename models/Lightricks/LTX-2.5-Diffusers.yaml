meta:
  title: "LTX-2.5"
  slug: "ltx-2.5"
  provider: "Lightricks"
  description: "19B diffusion transformer for joint video and synchronized audio generation, served via vLLM-Omni"
  date_added: 2026-08-11
  date_updated: 2026-08-13
  difficulty: advanced
  tasks:
    - omni
  related_recipes:
    - Wan-AI/Wan2.2-T2V-A14B-Diffusers
  hardware:
    b300: verified

model:
  model_id: "Lightricks/LTX-2.5-Diffusers"
  min_vllm_version: "0.27.0"
  install:
    pip:
      command: |
        uv venv --python 3.12
        source .venv/bin/activate
        export VLLM_VERSION=0.27.0
        uv pip install "vllm==$VLLM_VERSION" --torch-backend=auto
        uv pip install git+https://github.com/vllm-project/vllm-omni.git
      note: "LTX-2.5 requires the native pipeline in current vLLM-Omni main."
    docker: false
  architecture: dense
  parameter_count: "19B"
  active_parameters: "19B"
  context_length: 0
  base_args:
    - "--host"
    - "0.0.0.0"
    - "--port"
    - "8000"
    - "--enforce-eager"
    - "--diffusion-attention-backend"
    - "CUDNN_ATTN"
  base_env: {}

features: {}

opt_in_features: []

variants:
  default:
    precision: bf16
    vram_minimum_gb: 80
    description: "BF16 checkpoint with Full/SFT and distilled one-stage/two-stage generation paths"

compatible_strategies: []

hardware_overrides: {}

strategy_overrides: {}

omni:
  port: 8000
  task_label: "Generation Mode"
  task_hint: "Choose Full/SFT or distilled weights, then one-stage or two-stage T2V/I2V execution."
  tasks:
    - id: t2v
      key: full_one_stage_t2v
      label: "Full one-stage T2V · 960×544"
      vram_minimum_gb: 80
      endpoint: "/v1/videos/sync"
      description: "Full/SFT text-to-video generation with 30 denoising steps and synchronized audio."
      extra_args:
        - "--model-class-name"
        - "LTX2Pipeline"
      curl: |
        curl -sS --fail-with-body \
          -X POST http://localhost:8000/v1/videos/sync \
          -F 'prompt=A cinematic shot of a red fox walking through a snowy forest at dawn, the camera tracking alongside, snow crunching underfoot.' \
          -F 'width=960' \
          -F 'height=544' \
          -F 'num_frames=121' \
          -F 'fps=24' \
          -F 'num_inference_steps=30' \
          -F 'seed=42' \
          -o ltx25-one-stage-t2v.mp4

    - id: i2v
      key: full_one_stage_i2v
      label: "Full one-stage I2V · 960×544"
      vram_minimum_gb: 80
      endpoint: "/v1/videos/sync"
      description: "Full/SFT first-frame image-to-video generation with 30 denoising steps and synchronized audio."
      extra_args:
        - "--model-class-name"
        - "LTX2Pipeline"
      curl: |
        export FIRST_FRAME=/absolute/path/to/first-frame.png

        curl -sS --fail-with-body \
          -X POST http://localhost:8000/v1/videos/sync \
          -F "input_reference=@${FIRST_FRAME};type=image/png" \
          -F 'prompt=The red fox walks forward while the camera tracks alongside.' \
          -F 'width=960' \
          -F 'height=544' \
          -F 'num_frames=121' \
          -F 'fps=24' \
          -F 'num_inference_steps=30' \
          -F 'seed=42' \
          -o ltx25-one-stage-i2v.mp4

    - id: t2v
      key: distilled_one_stage_t2v
      label: "Distilled one-stage T2V · 960×544"
      vram_minimum_gb: 79
      endpoint: "/v1/videos/sync"
      description: "Positive-only text-to-video generation with the fixed eight-step distilled schedule."
      extra_args:
        - "--model-class-name"
        - "LTX2DistilledOneStagePipeline"
      curl: |
        curl -sS --fail-with-body \
          -X POST http://localhost:8000/v1/videos/sync \
          -F 'prompt=A cinematic shot of a red fox walking through a snowy forest at dawn, the camera tracking alongside, snow crunching underfoot.' \
          -F 'width=960' \
          -F 'height=544' \
          -F 'num_frames=121' \
          -F 'fps=24' \
          -F 'num_inference_steps=8' \
          -F 'seed=42' \
          -o ltx25-distilled-one-stage-t2v.mp4

    - id: i2v
      key: distilled_one_stage_i2v
      label: "Distilled one-stage I2V · 960×544"
      vram_minimum_gb: 79
      endpoint: "/v1/videos/sync"
      description: "Positive-only first-frame I2V with CRF-18 conditioning and the fixed eight-step schedule."
      extra_args:
        - "--model-class-name"
        - "LTX2DistilledOneStagePipeline"
      curl: |
        export FIRST_FRAME=/absolute/path/to/first-frame.png

        curl -sS --fail-with-body \
          -X POST http://localhost:8000/v1/videos/sync \
          -F "input_reference=@${FIRST_FRAME};type=image/png" \
          -F 'prompt=The red fox walks forward while the camera tracks alongside.' \
          -F 'width=960' \
          -F 'height=544' \
          -F 'num_frames=121' \
          -F 'fps=24' \
          -F 'num_inference_steps=8' \
          -F 'seed=42' \
          -o ltx25-distilled-one-stage-i2v.mp4

    - id: t2v
      key: distilled_two_stage_t2v
      label: "Distilled two-stage T2V · 1920×1088"
      vram_minimum_gb: 114
      endpoint: "/v1/videos/sync"
      description: "Eight-step low-resolution generation, x2 latent upsampling, and three-step full-resolution refinement."
      extra_args:
        - "--model-class-name"
        - "LTX2DistilledTwoStagePipeline"
      curl: |
        curl -sS --fail-with-body \
          -X POST http://localhost:8000/v1/videos/sync \
          -F 'prompt=A cinematic shot of a red fox walking through a snowy forest at dawn, the camera tracking alongside, snow crunching underfoot.' \
          -F 'width=1920' \
          -F 'height=1088' \
          -F 'num_frames=121' \
          -F 'fps=24' \
          -F 'num_inference_steps=8' \
          -F 'seed=42' \
          -o ltx25-distilled-two-stage-t2v.mp4

    - id: i2v
      key: distilled_two_stage_i2v
      label: "Distilled two-stage I2V · 1920×1088"
      vram_minimum_gb: 114
      endpoint: "/v1/videos/sync"
      description: "First-frame I2V with an eight-step first stage and three-step full-resolution refinement."
      extra_args:
        - "--model-class-name"
        - "LTX2DistilledTwoStagePipeline"
      curl: |
        export FIRST_FRAME=/absolute/path/to/first-frame.png

        curl -sS --fail-with-body \
          -X POST http://localhost:8000/v1/videos/sync \
          -F "input_reference=@${FIRST_FRAME};type=image/png" \
          -F 'prompt=The red fox walks forward while the camera tracks alongside.' \
          -F 'width=1920' \
          -F 'height=1088' \
          -F 'num_frames=121' \
          -F 'fps=24' \
          -F 'num_inference_steps=8' \
          -F 'seed=42' \
          -o ltx25-distilled-two-stage-i2v.mp4

    - id: t2v
      key: full_two_stage_t2v
      label: "Full two-stage T2V · 1920×1088"
      vram_minimum_gb: 114
      endpoint: "/v1/videos/sync"
      description: "Full/SFT Stage 1, x2 latent upsampling, and LoRA-450 three-step refinement."
      extra_args:
        - "--model-class-name"
        - "LTX2TwoStagePipeline"
      curl: |
        curl -sS --fail-with-body \
          -X POST http://localhost:8000/v1/videos/sync \
          -F 'prompt=A cinematic shot of a red fox walking through a snowy forest at dawn, the camera tracking alongside, snow crunching underfoot.' \
          -F 'width=1920' \
          -F 'height=1088' \
          -F 'num_frames=121' \
          -F 'fps=24' \
          -F 'num_inference_steps=30' \
          -F 'seed=42' \
          -o ltx25-full-two-stage-t2v.mp4

    - id: i2v
      key: full_two_stage_i2v
      label: "Full two-stage I2V · 1920×1088"
      vram_minimum_gb: 114
      endpoint: "/v1/videos/sync"
      description: "Full/SFT first-frame I2V followed by x2 latent upsampling and LoRA-450 refinement."
      extra_args:
        - "--model-class-name"
        - "LTX2TwoStagePipeline"
      curl: |
        export FIRST_FRAME=/absolute/path/to/first-frame.png

        curl -sS --fail-with-body \
          -X POST http://localhost:8000/v1/videos/sync \
          -F "input_reference=@${FIRST_FRAME};type=image/png" \
          -F 'prompt=The red fox walks forward while the camera tracks alongside.' \
          -F 'width=1920' \
          -F 'height=1088' \
          -F 'num_frames=121' \
          -F 'fps=24' \
          -F 'num_inference_steps=30' \
          -F 'seed=42' \
          -o ltx25-full-two-stage-i2v.mp4

guide: |
  ## Overview

  [LTX-2.5-Diffusers](https://huggingface.co/Lightricks/LTX-2.5-Diffusers)
  is a dense 19B diffusion transformer that jointly generates video and
  synchronized audio. This recipe supports the Diffusers-format checkpoint
  through four native vLLM-Omni pipeline classes:

  | Pipeline | Checkpoint path | Modes | Schedule |
  |----------|-----------------|-------|----------|
  | `LTX2Pipeline` | `transformer_full/` | Full/SFT one-stage T2V and first-frame I2V | 30 steps |
  | `LTX2DistilledOneStagePipeline` | `transformer/` | Distilled one-stage T2V and first-frame I2V | Fixed 8-step schedule |
  | `LTX2DistilledTwoStagePipeline` | `transformer/` | Distilled two-stage T2V and first-frame I2V | 8-step first stage + 3-step refinement |
  | `LTX2TwoStagePipeline` | `transformer_full/` | Full/SFT two-stage T2V and first-frame I2V | 30-step first stage + LoRA-450 3-step refinement |

  The supported model ID is `Lightricks/LTX-2.5-Diffusers`.

  ## Prerequisites

  - Accept the model license on Hugging Face and run `hf auth login` before
    first use.
  - Python 3.12, vLLM 0.27.0, and current vLLM-Omni main.
  - I2V requires PyAV backed by an FFmpeg build with the `libx264` encoder.
    First-frame conditioning uses the model's CRF-18 preprocessing by default.
  - A B300 has been validated for the BF16 configurations in this recipe.
    The two-stage 1920x1088 path has the higher memory requirement.

  ## Installation

  ```bash
  uv venv --python 3.12
  source .venv/bin/activate
  export VLLM_VERSION=0.27.0
  uv pip install "vllm==$VLLM_VERSION" --torch-backend=auto
  uv pip install git+https://github.com/vllm-project/vllm-omni.git
  ```

  ## Attention backend

  `TORCH_SDPA` is the portable correctness backend used by the CPU-safe CI
  suite. `CUDNN_ATTN` has also been validated end-to-end on B300 and is the
  default in this B300-oriented recipe. Other attention backends are not
  qualified here.

  ## Offline inference

  Run these commands from a vLLM-Omni checkout. The generic video examples
  cover all four supported modes; no model-specific runner is required.

  ```bash
  # Full/SFT one-stage T2V
  python examples/offline_inference/text_to_video/text_to_video.py \
    --model Lightricks/LTX-2.5-Diffusers \
    --model-class-name LTX2Pipeline \
    --prompt "A cinematic shot of a red fox walking through a snowy forest at dawn, the camera tracking alongside, snow crunching underfoot." \
    --height 544 --width 960 --num-frames 121 \
    --num-inference-steps 30 --frame-rate 24 --fps 24 --seed 42 \
    --enforce-eager --output ltx25-one-stage-t2v.mp4

  # Full/SFT one-stage first-frame I2V
  python examples/offline_inference/image_to_video/image_to_video.py \
    --model Lightricks/LTX-2.5-Diffusers \
    --model-class-name LTX2Pipeline \
    --image /absolute/path/to/first-frame.png \
    --prompt "The red fox walks forward while the camera tracks alongside." \
    --height 544 --width 960 --num-frames 121 \
    --num-inference-steps 30 --frame-rate 24 --fps 24 --seed 42 \
    --enforce-eager --output ltx25-one-stage-i2v.mp4

  # Distilled one-stage T2V
  python examples/offline_inference/text_to_video/text_to_video.py \
    --model Lightricks/LTX-2.5-Diffusers \
    --model-class-name LTX2DistilledOneStagePipeline \
    --prompt "A cinematic shot of a red fox walking through a snowy forest at dawn, the camera tracking alongside, snow crunching underfoot." \
    --height 544 --width 960 --num-frames 121 \
    --num-inference-steps 8 --frame-rate 24 --fps 24 --seed 42 \
    --enforce-eager --output ltx25-distilled-one-stage-t2v.mp4

  # Distilled one-stage first-frame I2V
  python examples/offline_inference/image_to_video/image_to_video.py \
    --model Lightricks/LTX-2.5-Diffusers \
    --model-class-name LTX2DistilledOneStagePipeline \
    --image /absolute/path/to/first-frame.png \
    --prompt "The red fox walks forward while the camera tracks alongside." \
    --height 544 --width 960 --num-frames 121 \
    --num-inference-steps 8 --frame-rate 24 --fps 24 --seed 42 \
    --enforce-eager --output ltx25-distilled-one-stage-i2v.mp4

  # Distilled two-stage T2V
  python examples/offline_inference/text_to_video/text_to_video.py \
    --model Lightricks/LTX-2.5-Diffusers \
    --model-class-name LTX2DistilledTwoStagePipeline \
    --prompt "A cinematic shot of a red fox walking through a snowy forest at dawn, the camera tracking alongside, snow crunching underfoot." \
    --height 1088 --width 1920 --num-frames 121 \
    --num-inference-steps 8 --frame-rate 24 --fps 24 --seed 42 \
    --enforce-eager --output ltx25-two-stage-t2v.mp4

  # Distilled two-stage first-frame I2V
  python examples/offline_inference/image_to_video/image_to_video.py \
    --model Lightricks/LTX-2.5-Diffusers \
    --model-class-name LTX2DistilledTwoStagePipeline \
    --image /absolute/path/to/first-frame.png \
    --prompt "The red fox walks forward while the camera tracks alongside." \
    --height 1088 --width 1920 --num-frames 121 \
    --num-inference-steps 8 --frame-rate 24 --fps 24 --seed 42 \
    --enforce-eager --output ltx25-two-stage-i2v.mp4

  # Full/SFT two-stage T2V
  python examples/offline_inference/text_to_video/text_to_video.py \
    --model Lightricks/LTX-2.5-Diffusers \
    --model-class-name LTX2TwoStagePipeline \
    --prompt "A cinematic shot of a red fox walking through a snowy forest at dawn, the camera tracking alongside, snow crunching underfoot." \
    --height 1088 --width 1920 --num-frames 121 \
    --num-inference-steps 30 --frame-rate 24 --fps 24 --seed 42 \
    --enforce-eager --output ltx25-full-two-stage-t2v.mp4

  # Full/SFT two-stage first-frame I2V
  python examples/offline_inference/image_to_video/image_to_video.py \
    --model Lightricks/LTX-2.5-Diffusers \
    --model-class-name LTX2TwoStagePipeline \
    --image /absolute/path/to/first-frame.png \
    --prompt "The red fox walks forward while the camera tracks alongside." \
    --height 1088 --width 1920 --num-frames 121 \
    --num-inference-steps 30 --frame-rate 24 --fps 24 --seed 42 \
    --enforce-eager --output ltx25-full-two-stage-i2v.mp4
  ```

  ## Online serving

  Launch one server for the desired pipeline class.

  Full/SFT one-stage T2V and I2V:

  ```bash
  vllm serve Lightricks/LTX-2.5-Diffusers \
    --omni \
    --model-class-name LTX2Pipeline \
    --host 0.0.0.0 \
    --port 8000 \
    --enforce-eager \
    --diffusion-attention-backend CUDNN_ATTN
  ```

  Distilled one-stage T2V and I2V:

  ```bash
  vllm serve Lightricks/LTX-2.5-Diffusers \
    --omni \
    --model-class-name LTX2DistilledOneStagePipeline \
    --host 0.0.0.0 \
    --port 8000 \
    --enforce-eager \
    --diffusion-attention-backend CUDNN_ATTN
  ```

  Distilled two-stage T2V and I2V:

  ```bash
  vllm serve Lightricks/LTX-2.5-Diffusers \
    --omni \
    --model-class-name LTX2DistilledTwoStagePipeline \
    --host 0.0.0.0 \
    --port 8000 \
    --enforce-eager \
    --diffusion-attention-backend CUDNN_ATTN
  ```

  Full/SFT two-stage T2V and I2V:

  ```bash
  vllm serve Lightricks/LTX-2.5-Diffusers \
    --omni \
    --model-class-name LTX2TwoStagePipeline \
    --host 0.0.0.0 \
    --port 8000 \
    --enforce-eager \
    --diffusion-attention-backend CUDNN_ATTN
  ```

  All four servers expose `/v1/videos/sync`. Send a multipart `prompt` for T2V;
  add one RGB image as `input_reference` for first-frame I2V. The task presets
  above provide complete requests.

  ## Key parameters

  | Pipeline | Final size | Stage 1 steps | Guidance | Notes |
  |----------|------------|---------------|----------|-------|
  | `LTX2Pipeline` | 960x544 | 30 | Full/SFT guided | One-stage |
  | `LTX2DistilledOneStagePipeline` | 960x544 | 8 | Distilled positive-only | Fixed sigma schedule |
  | `LTX2DistilledTwoStagePipeline` | 1920x1088 | 8 | Distilled positive-only | Adds fixed three-step refinement |
  | `LTX2TwoStagePipeline` | 1920x1088 | 30 | Full/SFT guided | Adds LoRA-450 three-step refinement |

  All modes use 121 frames at 24 FPS in the examples. Add `input_reference`
  with one RGB image for I2V. Do not send a negative prompt to either
  distilled pipeline.

  ## Scope

  This recipe documents the four pipeline classes above. It does not claim
  support for alternate loaders or unqualified acceleration backends.

  ## References

  - [LTX-2.5 Diffusers model card](https://huggingface.co/Lightricks/LTX-2.5-Diffusers)
  - [LTX-2 project](https://github.com/Lightricks/LTX-2)
