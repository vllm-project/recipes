  ## Ascend deployment guide

  The Ascend configurations below are migrated from the
  [validated vLLM-Ascend GLM-5.2 tutorial](https://github.com/vllm-project/vllm-ascend/blob/932818a5b16dd57bea61a5c2a15c7dc9bda8dea3/docs/source/tutorials/models/GLM5.2.md).
  Their parallelism, cache settings, graph settings and role-specific optimizations
  are retained together for each scenario. The command builder exposes the
  **BF16, W8A8 and W4A8** on Atlas 800 A3. W8A8 and W4A8 use the
  single-node TP8/DP2/EP configuration; BF16 requires at least two nodes with
  Multi-Node Tensor Parallel and EP. Set `LOCAL_IP` and `IFACE_NAME` on each node
  to its local communication IP and network interface before multi-node serving.
  Use the complete commands below for A2, multi-node, PD and long-context deployment;
  the generic GPU PD/NIXL builder is not the Ascend Mooncake deployment.

  The builder resolves these checkpoints through ModelScope (W4A8 uses W4A8C8) and enables the
  tutorial's three-token MTP mode. Select **Python** in the existing Frontend row
  to match this Ascend configuration, or open the
  [A3 W4A8C8 configuration](https://recipes.vllm.ai/zai-org/GLM-5.2?hardware=ascend_910c&variant=ascend_w4a8&frontend=python).
  The recipe's existing NVIDIA/AMD frontend defaults are unchanged.

  ### Ascend images and checkpoint paths

  Use the current Ascend nightly images for the corresponding hardware:

  | Hardware | Image |
  | --- | --- |
  | Atlas 800 A3 | `quay.io/ascend/vllm-ascend:nightly-main-a3` |
  | Atlas 800 A2 | `quay.io/ascend/vllm-ascend:nightly-main` |
  | Ascend 950PR / 950DT (A5) | `quay.io/ascend/vllm-ascend:nightly-main-a5` |

  The tags are moving nightly aliases. For an immutable deployment, record the
  pulled image digest. The source tutorial validates the configurations; the
  nightly image aliases select the current runtime, rather than the historical
  environment that produced the source's evaluation scores.

  Download the W4A8C8 checkpoint from its actual ModelScope repository. Run this
  inside a container with `/root/.cache` mounted, or on a host with ModelScope installed:

  ```bash
  python -m pip install modelscope
  modelscope download --model Eco-Tech/GLM-5.2-w4a8c8 \
    --local_dir /root/.cache/modelscope/hub/models/Eco-Tech/GLM-5.2-w4a8c8
  export MODEL_PATH=/root/.cache/modelscope/hub/models/Eco-Tech/GLM-5.2-w4a8c8
  ```

  For PD, download the **W8A8C8** checkpoint from the Modelers link in the weight
  table and export `MODEL_PATH` to that directory on every P/D node. Use the same
  checkpoint files and container-visible path across nodes. W8A8 and BF16 sources
  are also listed in that table. The 950-series W4A4C8 path uses the linked
  msmodelslim quantization recipe; its mixed precision and FP8 C8 settings are
  described in the FAQ below.

  In the commands below, replace NIC/IP placeholders for each node and export
  `MODEL_PATH` in each container. The serving alias is normalized to `glm-52`
  throughout the guide, including client requests; this does not change weights
  or inference settings. Save the Python launcher and the role-specific shell
  templates under the filenames shown before launching the associated scenario.

  ### Ascend Introduction

  > **Note**
  >
  >
  > The "PD Separation Deployment" mentioned in this document is provided only as an example/reference design to demonstrate the basic process of deploying Prefill and Decode in separated mode. It is not recommended for use in the production environment.
  >
  > **For the production environment on the customer side, [MindIE Motor](https://www.hiascend.com/document/detail/en/mindie/latest/quickstart/docs/en/user_guide/quick_start.md) + vLLM-Ascend is recommended.**
  >
  [GLM-5.2](https://huggingface.co/zai-org/GLM-5.2) uses a Mixture-of-Experts (MoE) architecture and targets complex systems engineering and long-horizon agentic tasks.

  This document will show the main verification steps of the model, including supported features, feature configuration, environment preparation, single-node and multi-node deployment, accuracy and performance evaluation.

  ### Ascend Supported Features

  Refer to [Supported Features List](https://github.com/vllm-project/vllm-ascend/blob/932818a5b16dd57bea61a5c2a15c7dc9bda8dea3/docs/source/user_guide/support_matrix/supported_models.md) to get the model's supported feature matrix.

  Refer to [Feature Guide](https://github.com/vllm-project/vllm-ascend/blob/932818a5b16dd57bea61a5c2a15c7dc9bda8dea3/docs/source/user_guide/feature_guide/index.md) to get the feature's configuration.

  ### Ascend Prerequisites

  #### Model Weight

  |  Weight Version          | Hardware Requirements                                             | Download Links |
  |--------------------------|-------------------------------------------------------------------|----------------|
  |  `GLM-5.2`(BF16 version) | 2 Atlas 800 A3 (128GB × 8) node or 4 Atlas 800 A2 (64GB × 8) node | [ModelScope](https://www.modelscope.cn/models/ZhipuAI/GLM-5.2) |
  |  `GLM-5.2-w8a8`          | 1 Atlas 800 A3 (128GB × 8) node or 2 Atlas 800 A2 (64GB × 8) node | [ModelScope](https://www.modelscope.cn/models/Eco-Tech/GLM-5.2-w8a8) |
  |  `GLM-5.2-w8a8c8`(Quantized version)        | 2 Atlas 800 A3 (64GB × 16) node or 4 Atlas 800 A2 (64GB × 8) node | [Modelers](https://modelers.cn/models/Eco-Tech/GLM-5.2-w8a8c8) |
  |  `GLM-5.2-w4a8c8`        | 1 Atlas 800 A3 (128GB × 8) node or 2 Atlas 800 A2 (64GB × 8) node | [ModelScope](https://www.modelscope.cn/models/Eco-Tech/GLM-5.2-w4a8c8) |
  |  `GLM-5.2-w4a4c8`        | 950PR&950DT Products | Quantize locally with [msmodelslim](https://gitcode.com/Ascend/msmodelslim/blob/master/lab_practice/glm_5_2/glm_5_2_w4a4c8_mxfp4.yaml) |

  - `GLM-5.2-w8a8c8`(Quantized version): The weights have been verified and are recommended for use.
  - You can use [msmodelslim](https://gitcode.com/Ascend/msmodelslim) to quantize the model directly.
  - `GLM-5.2-w4a4c8`(W4A4 MXFP4 mixed-precision quantization): For how the ultra-low-bit quantization preserves accuracy, see the [W4A4C8 FAQ](#q-how-do-the-w4a4c8-ultra-low-bit-quantized-weights-preserve-accuracy).

  It is recommended to download the model weight to the shared directory of multiple nodes, such as `/root/.cache/`.

  >**Path description**: Download the model weights to a directory of your choice and record it. Ensure the model path in the subsequent deployment command matches this directory.

