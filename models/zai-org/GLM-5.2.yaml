meta:
  title: "GLM-5.2"
  slug: "glm-5.2"
  provider: "GLM (Z-AI)"
  description: "GLM-5.2 — frontier-scale MoE language model (~743B total parameters, 39B active) with up to 5-token MTP speculative decoding and thinking mode"
  date_added: 2026-06-16
  date_updated: 2026-10-20
  difficulty: advanced
  tasks:
    - text
  performance_headline: "Latest GLM-5 series MoE with extended MTP (5 draft tokens), improved reasoning and agentic performance"
  related_recipes:
    - "zai-org/GLM-5"
    - "zai-org/GLM-5.1"
  hardware:
    ascend_910c: verified
    b300: verified
    b200: verified
    mi300x: verified
    mi325x: verified
    mi350x: verified
    mi355x: verified

model:
  model_id: "zai-org/GLM-5.2"
  min_vllm_version: "0.24.0"
  default_frontend: rust
  docker_image:
    nvidia: "vllm/vllm-openai:v0.28.0"
    amd: "vllm/vllm-openai-rocm:nightly"
  architecture: moe
  parameter_count: "743B"
  active_parameters: "39B"
  context_length: 1048576
  base_args:
    - "--kv-cache-dtype"
    - "fp8_e4m3"
  base_env: {}

features:
  tool_calling:
    description: "GLM-4.7 tool call parser with automatic tool choice"
    args:
      - "--tool-call-parser"
      - "glm47"
      - "--enable-auto-tool-choice"
  reasoning:
    description: "GLM-4.7 reasoning parser — thinking mode enabled by default on requests"
    args:
      - "--reasoning-parser"
      - "glm47"
    hardware_overrides:
      npu:
        args: ["--reasoning-parser", "glm45"]
  spec_decoding:
    description: "Multi-Token Prediction speculative decoding (up to 7 draft tokens)"
    default_mode: mtp
    modes:
      mtp:
        label: "MTP"
        description: "Built-in Multi-Token Prediction, 5 draft tokens."
        variants:
          - default
          - nvfp4
          - redhat_nvfp4
          - bf16
          - mxfp4
          - redhat_fp8
          - redhat_nvfp4_plain
        args:
          - "--speculative-config"
          - '{"method":"mtp","num_speculative_tokens":5}'
      dspark:
        label: "DSpark"
        description: "DSpark drafting with an externally trained 7-token draft model; the served GLM checkpoint is unchanged."
        variants:
          - default
        args:
          - "--speculative-config"
          - '{"model": "RedHatAI/GLM-5.2-speculator.dspark","num_speculative_tokens": 7,"method": "dspark"}'
      ascend_mtp:
        label: "MTP (Ascend)"
        description: "The tutorial's in-checkpoint MTP configuration: three draft tokens, with the draft model running eager."
        variants: [ascend_bf16, ascend_w8a8, ascend_w4a8]
        hardware: { npu: supported, default: unsupported }
        args:
          - "--speculative-config"
          - '{"num_speculative_tokens":3,"method":"deepseek_mtp","enforce_eager":true}'

opt_in_features:
  - spec_decoding

variants:
  default:
    model_id: "zai-org/GLM-5.2-FP8"
    precision: fp8
    vram_minimum_gb: 893
    description: "Native FP8 checkpoint — 8xH200/H20 (141GB × 8) single-node serving"
  mxfp4:
    model_id: "amd/GLM-5.2-MXFP4"
    precision: mxfp4
    vram_minimum_gb: 446
    supported_hardware:
      - mi355x
    description: "AMD Quark MXFP4 checkpoint — MoE weights quantized for MI355X (gfx950)"
    hardware_overrides:
      mi355x:
        extra_args:
          - "--trust-remote-code"
        extra_env:
          VLLM_USE_V2_MODEL_RUNNER: "1"
          VLLM_ROCM_USE_AITER_FP8BMM: "0"
          VLLM_ROCM_USE_AITER_FP4BMM: "0"
  nvfp4:
    model_id: "nvidia/GLM-5.2-NVFP4"
    precision: nvfp4
    vram_minimum_gb: 558
    description: "NVIDIA modelopt NVFP4 checkpoint — only MoE expert linears are quantized to NVFP4; shared experts, attention, embeddings, and the early dense layers stay FP8/BF16, with FP8 KV cache. Blackwell GPUs (B200/B300) only."
  redhat_nvfp4:
    model_id: "RedHatAI/GLM-5.2-NVFP4-FP8"
    precision: nvfp4
    label: "NVFP4+FP8 (RedHat)"
    vram_minimum_gb: 558
    description: "RedHatAI NVFP4+FP8 mixed-precision checkpoint (MoE expert linears NVFP4, attention/embeddings FP8) for Blackwell GPUs"
  bf16:
    precision: bf16
    vram_minimum_gb: 1786
    description: "Full precision BF16 — requires multi-node deployment"

  redhat_fp8:
    model_id: "RedHatAI/GLM-5.2-FP8"
    precision: fp8
    label: "FP8 (RedHat)"
    vram_minimum_gb: 892
    description: "RedHatAI FP8 quantization"

  redhat_nvfp4_plain:
    model_id: "RedHatAI/GLM-5.2-NVFP4"
    precision: nvfp4
    label: "NVFP4 (RedHat)"
    vram_minimum_gb: 477
    description: "RedHatAI NVFP4 quantization"

  ascend_bf16:
    model_id: "ZhipuAI/GLM-5.2"
    precision: bf16
    label: "BF16 (Ascend)"
    # Weight-only estimate: 743B x 2 bytes x 1.2. Actual allocation also
    # includes higher-precision modules, scales, activations and KV cache.
    vram_minimum_gb: 1786
    description: "BF16 on at least two Atlas 800 A3 nodes (16 x 64 GB each): multi-node TP with EP. Select Multi-Node Tensor Parallel."
    supported_hardware: [ascend_910c]
    tp: 16
    default_modes:
      spec_decoding: ascend_mtp
    extra_args:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--api-server-count"
      - "1"
      - "--enable-expert-parallel"
      - "--seed"
      - "1024"
      - "--max-num-seqs"
      - "12"
      - "--max-model-len"
      - "135000"
      - "--max-num-batched-tokens"
      - "8192"
      - "--trust-remote-code"
      - "--gpu-memory-utilization"
      - "0.92"
      - "--dtype"
      - "bfloat16"
      # Restore vLLM's default instead of inheriting the GPU FP8 KV flag.
      - "--kv-cache-dtype"
      - "auto"
      - "--compilation-config"
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - "--additional-config"
      - '{"enable_balance_scheduling":true,"multistream_overlap_shared_expert":true,"enable_flashcomm1":true,"enable_fused_mc2":0}'
    extra_env:
      VLLM_USE_MODELSCOPE: "True"
      HCCL_BUFFSIZE: "200"
      HCCL_OP_EXPANSION_MODE: "AIV"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
    hardware_overrides:
      ascend_910c:
        docker_image: "quay.io/ascend/vllm-ascend:nightly-main-a3"
        docker_serve_command: "vllm serve"
        install:
          pip: false

  ascend_w8a8:
    model_id: "Eco-Tech/GLM-5.2-w8a8"
    precision: int8
    label: "W8A8 (Ascend)"
    # Weight-only estimate: 743B x 1 byte x 1.2. Actual allocation also
    # includes higher-precision modules, scales, activations and KV cache.
    vram_minimum_gb: 893
    description: "ModelSlim W8A8 on one Atlas 800 A3 (16 x 64 GB): TP8, DP2 and EP, 135000-token serving limit. See the Ascend guide for other topologies."
    supported_hardware: [ascend_910c]
    tp: 8
    default_modes:
      spec_decoding: ascend_mtp
    extra_args:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--api-server-count"
      - "1"
      - "--enable-expert-parallel"
      - "--seed"
      - "1024"
      - "--max-num-seqs"
      - "12"
      - "--max-model-len"
      - "135000"
      - "--max-num-batched-tokens"
      - "8192"
      - "--trust-remote-code"
      - "--gpu-memory-utilization"
      - "0.92"
      - "--quantization"
      - "ascend"
      # Restore vLLM's default instead of inheriting the GPU FP8 KV flag.
      - "--kv-cache-dtype"
      - "auto"
      - "--compilation-config"
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - "--additional-config"
      - '{"enable_balance_scheduling":true,"multistream_overlap_shared_expert":true,"enable_flashcomm1":true,"enable_fused_mc2":0}'
    extra_env:
      VLLM_USE_MODELSCOPE: "True"
      HCCL_BUFFSIZE: "200"
      HCCL_OP_EXPANSION_MODE: "AIV"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
    hardware_overrides:
      ascend_910c:
        docker_image: "quay.io/ascend/vllm-ascend:nightly-main-a3"
        docker_serve_command: "vllm serve"
        install:
          pip: false

  ascend_w4a8:
    model_id: "Eco-Tech/GLM-5.2-w4a8c8"
    precision: int4
    label: "W4A8 (Ascend)"
    # Weight-only estimate: 743B x 0.5 bytes x 1.2. Actual allocation also
    # includes higher-precision modules, scales, activations and KV cache.
    vram_minimum_gb: 446
    description: "ModelSlim W4A8C8 on one Atlas 800 A3 (16 x 64 GB): TP8, DP2 and EP, 135000-token serving limit. See the Ascend guide for other topologies."
    supported_hardware: [ascend_910c]
    tp: 8
    default_modes:
      spec_decoding: ascend_mtp
    extra_args:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--api-server-count"
      - "1"
      - "--enable-expert-parallel"
      - "--seed"
      - "1024"
      - "--max-num-seqs"
      - "12"
      - "--max-model-len"
      - "135000"
      - "--max-num-batched-tokens"
      - "8192"
      - "--trust-remote-code"
      - "--gpu-memory-utilization"
      - "0.92"
      - "--quantization"
      - "ascend"
      # Restore vLLM's default instead of inheriting the GPU FP8 KV flag.
      - "--kv-cache-dtype"
      - "auto"
      - "--compilation-config"
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - "--attention_config.indexer_kv_dtype"
      - "int8"
      - "--additional-config"
      - '{"enable_dsa_cp":true,"enable_balance_scheduling":true,"multistream_overlap_shared_expert":true,"enable_flashcomm1":true,"enable_fused_mc2":0}'
    extra_env:
      VLLM_USE_MODELSCOPE: "True"
      HCCL_BUFFSIZE: "200"
      HCCL_OP_EXPANSION_MODE: "AIV"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
    hardware_overrides:
      ascend_910c:
        docker_image: "quay.io/ascend/vllm-ascend:nightly-main-a3"
        docker_serve_command: "vllm serve"
        install:
          pip: false

compatible_strategies:
  - single_node_tp
  - single_node_tep
  - multi_node_tp
  - multi_node_tp_pp
  - multi_node_tep
  - multi_node_dep
  - pd_cluster

strategy_hardware:
  single_node_dep: { npu: supported }
  multi_node_tp_dp: { npu: supported }

kv_offload_support:
  offloading_cpu: verified
  offloading_fs: verified

hardware_overrides:
  hopper:
    # H100/H200 use plain fp8 KV cache; Blackwell keeps base_args' fp8_e4m3,H20 do not use kvcache fp8
    # The synthesizer's last-wins dedupe lets this shadow --kv-cache-dtype.
    extra_args:
      - "--kv-cache-dtype"
      - "fp8"
  amd:
    extra_args:
      - "--linear-backend"
      - "aiter"
      - "--moe-backend"
      - "aiter"
    extra_env:
      VLLM_ROCM_USE_AITER: "1"
      VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: "1"

strategy_overrides:
  single_node_tp:
    hardware_overrides:
      ascend_910c:
        extra_args: ["--data-parallel-size", "2"]
  multi_node_tp:
    hardware_overrides:
      ascend_910c:
        extra_env:
          HCCL_BUFFSIZE: "400"
          HCCL_IF_IP: "$LOCAL_IP"
          HCCL_SOCKET_IFNAME: "$IFACE_NAME"

hardware_notes:
  ascend_910c:
    title: "Atlas 800 A3 — tutorial baseline"
    body: "Select Python in the Frontend row to match the tutorial. W8A8 and W4A8 use TP8 + DP2 + expert parallel across all 16 NPUs. BF16 requires at least two A3 nodes using Multi-Node Tensor Parallel with expert parallel. All three use MTP; W4A8 selects the W4A8C8 checkpoint. Set LOCAL_IP and IFACE_NAME on each node for multi-node serving. The generated client uses the checkpoint ID; the guide uses a local weight path and served name glm-52. A2, multi-node, PD, 1M and 950-series instructions are in the Ascend guide."
    link:
      href: "#ascend-deployment-guide"
      label: "Ascend deployment guide"

guide: |
  ## Overview

  GLM-5.2 is the newest model in the GLM-5 series — a ~743B-parameter MoE (39B active) from
  Z-AI. The
  headline change over GLM-5 / 5.1 is that **Multi-Token Prediction (MTP) is extended from 3 to
  5 draft tokens**, lifting end-to-end throughput on reasoning, coding, and agentic workloads.
  It ships as BF16, native-FP8, and AMD Quark MXFP4 checkpoints, and keeps the GLM
  thinking-mode behavior.

  This recipe targets the **FP8** checkpoint, the practical default: it fits on a single
  8xH200 / 8xH20 node and — with FP8 KV cache — reaches the full 1M-token context on 8xB200.
  On AMD MI355X hardware, use the **MXFP4** variant when HBM footprint is the priority.

  ## Prerequisites

  - **vLLM >= 0.24.0** for the `glm47` reasoning parser. If you need tool calling and MTP at the same time, use the latest
    `main` branch.
  - **GPU:** 8xH200 or 8xH20 (141 GB each) for single-node FP8; 8xB200 (180 GB each) for the
    full 1M context.
  - **MXFP4:** use the AMD Quark checkpoint on MI355X with ROCm and AITER enabled.
    TP=8 is recommended for the full MXFP4 model on an 8x MI355X node; TP=4 is
    also supported when memory headroom allows.

  ## Installation

  ### Docker

  ```bash
  docker run --gpus all \
    -p 8000:8000 \
    --ipc=host \
    -v ~/.cache/huggingface:/root/.cache/huggingface \
    vllm/vllm-openai:v0.28.0 zai-org/GLM-5.2-FP8 \
      --tensor-parallel-size 8 \
      --tool-call-parser glm47 \
      --reasoning-parser glm47 \
      --enable-auto-tool-choice \
      --served-model-name glm-5.2-fp8 \
      --max-model-len 131072
  ```

  On CUDA 12.x, swap the image for `vllm/vllm-openai:v0.28.0-cu129`.

  ### From source

  ```bash
  uv venv
  source .venv/bin/activate
  uv pip install "vllm==0.28.0" --torch-backend=auto
  uv pip install "transformers>=5.9.0"
  ```

  ## Launching the server

  ### FP8 on 8xH200 (standard)

  ```bash
  vllm serve zai-org/GLM-5.2-FP8 \
    --kv-cache-dtype fp8 \
    --tensor-parallel-size 8 \
    --speculative-config.method mtp \
    --speculative-config.num_speculative_tokens 5 \
    --tool-call-parser glm47 \
    --reasoning-parser glm47 \
    --enable-auto-tool-choice \
    --served-model-name glm-5.2-fp8
  ```
  ### FP8 on 8xH20 (dspark with best practices)
  ```bash
  vllm serve zai-org/GLM-5.2-FP8 \
     --tensor-parallel-size 8 \
     --tool-call-parser glm47 \
     --reasoning-parser glm47 \
     --enable-auto-tool-choice \
     --max-model-len 200000 \
     --max-num-seqs 16 \
     --max-num-batched-tokens 32768 \
     --speculative-config '{"model": "RedHatAI/GLM-5.2-speculator.dspark","num_speculative_tokens": 7,"method": "dspark"}' \
     --served-model-name glm-5.2-fp8
  ```
  tps up to 70+ for single request

  ### FP8 on AMD MI300X/MI325X/MI350X/MI355X (full 1M context)

  GLM-5.2 has a native 1M-token window. Whether the full window fits on ROCm is a
  KV-cache VRAM question, so the levers are `--max-model-len` and `--max-num-seqs`.
  Start with the values below, then scale them with your node's HBM and workload:
  raise the context window when startup reports KV-cache headroom, or lower the
  sequence cap if long prompts OOM under concurrency.

  ```bash
  VLLM_ROCM_USE_AITER=1 \
  VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS=1 \
  vllm serve zai-org/GLM-5.2-FP8 \
    --kv-cache-dtype fp8_e4m3 \
    --tensor-parallel-size 8 \
    --speculative-config.method mtp \
    --speculative-config.num_speculative_tokens 5 \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice \
    --reasoning-parser glm47 \
    --gpu-memory-utilization 0.80 \
    --max-model-len 524288 \
    --max-num-seqs 32 \
    --linear-backend aiter \
    --moe-backend aiter
  ```

  - **`--max-model-len`** — caps the served context window; raise it toward the native
    1M window when your HBM budget and workload leave KV-cache headroom.
  - **`--max-num-seqs 32`** — the main knob for fitting long context under concurrency;
    start at 32 and tune it to your HBM (up on headroom, down on OOM).
  - **`--gpu-memory-utilization 0.80`** — leaves ROCm runtime headroom for MTP graph capture
    and inference; raise it only after a representative concurrent smoke test.
  - **`--speculative-config.num_speculative_tokens 5`** — enables GLM-5.2's 5-token MTP
    path; reduce it if your workload shows low acceptance or higher latency.
  - **`VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS=1`** — enables the shared-expert fused
    MoE path. `VLLM_ROCM_USE_AITER_LINEAR` and `VLLM_ROCM_USE_AITER_MOE` default to enabled
    when `VLLM_ROCM_USE_AITER=1`.

  On 8x MI325X this command serves the full `--max-model-len 524288` at
  `--gpu-memory-utilization 0.80`, reporting a 1,564,016-token KV cache and 2.98x maximum
  concurrency. MTP is healthy there: a mean acceptance length of 4.00 out of 5 drafted
  tokens on a short greedy generation.

  On 8x MI350X it reports a 2,205,424-token KV cache and 4.21x maximum concurrency at the
  same settings, and MTP's mean acceptance length is 3.62 out of 5 drafted tokens on a
  512-token greedy generation.

  ### MXFP4 on AMD MI355X

  The AMD Quark MXFP4 checkpoint quantizes the MoE weights while leaving non-MoE modules in
  higher precision. The recipe UI only enables this variant for supported AMD MI355X
  hardware. Use ROCm AITER kernels:

  ```bash
  export HIP_VISIBLE_DEVICES=0,1,2,3,4,5,6,7
  export VLLM_ROCM_USE_AITER=1
  export VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS=1
  export VLLM_USE_V2_MODEL_RUNNER=1
  export VLLM_ROCM_USE_AITER_FP8BMM=0
  export VLLM_ROCM_USE_AITER_FP4BMM=0

  vllm serve amd/GLM-5.2-MXFP4 \
    --trust-remote-code \
    --kv-cache-dtype fp8_e4m3 \
    --tensor-parallel-size 8 \
    --gpu-memory-utilization 0.90 \
    --max-model-len 32768 \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice \
    --reasoning-parser glm47 \
    --no-enable-prefix-caching \
    --served-model-name glm-5.2-mxfp4
  ```

  For TP=4 validation runs, use `HIP_VISIBLE_DEVICES=0,1,2,3` and
  `--tensor-parallel-size 4`.

  ### FP8 on 8xB200 (full 1M context)

  GLM-5.2 has a native 1M-token window. Whether the full window fits is a KV-cache VRAM
  question, so the lever is `--max-num-seqs` — it bounds how many sequences share the KV budget
  at once, leaving room for each to hold a long context. **Start at 32** and scale with your
  node's VRAM: raise it on larger trays (e.g. 8xB300) or short-prompt traffic, lower it if you
  OOM at full context. FP8 KV cache (`--kv-cache-dtype fp8_e4m3`, already in the base flags)
  roughly halves that budget, which is what makes 1M reachable at all.

  ```bash
  VLLM_DEEP_GEMM_WARMUP=skip vllm serve zai-org/GLM-5.2-FP8 \
    --kv-cache-dtype fp8_e4m3 \
    --tensor-parallel-size 8 \
    --speculative-config.method mtp \
    --speculative-config.num_speculative_tokens 5 \
    --max-num-seqs 32 \
    --tool-call-parser glm47 \
    --reasoning-parser glm47 \
    --enable-auto-tool-choice \
    --served-model-name glm-5.2-fp8
  ```

  - **`--max-num-seqs 32`** — the single knob for fitting 1M context; start at 32 and tune it to
    your VRAM (up on headroom, down on OOM).
  - **`VLLM_DEEP_GEMM_WARMUP=skip`** — skips DeepGEMM JIT warmup for a faster startup; the first
    few requests compile kernels on demand instead.
  - **BF16** needs multi-node plus an extra loader flag — see [Troubleshooting](#troubleshooting).

  ### NVFP4 on Blackwell (B200/B300)

  The `nvidia/GLM-5.2-NVFP4` variant is NVIDIA's modelopt re-quantization: only the MoE
  expert linears drop to NVFP4 while shared experts, attention, embeddings, and the early
  dense layers stay FP8/BF16, with FP8 KV cache. The ~465 GB checkpoint fits comfortably on
  Blackwell — vLLM auto-detects the quantization from the checkpoint, so no `--quantization`
  flag is needed. Select the **NVFP4** variant above (Blackwell-only) or run NVIDIA's command:

  ```bash
  vllm serve nvidia/GLM-5.2-NVFP4 \
    --tensor-parallel-size 8 \
    --enable-expert-parallel \
    --reasoning-parser glm47 \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice \
    --kv-cache-dtype fp8_e4m3 \
    --served-model-name glm-5.2-nvfp4
  ```

  ## Reasoning modes

  Thinking is **on by default**. GLM-5.2 reuses the DeepSeek-V4 `reasoning_effort` mechanism,
  with two effort levels driven by the `reasoning_effort` field:

  | Mode | How to request | Behavior |
  |------|----------------|----------|
  | **Think Max** (default) | omit `reasoning_effort`, or set `"max"` | Deepest reasoning — hard math, multi-step planning, agentic tasks. Highest token cost. |
  | **Think High** | `"reasoning_effort": "high"` | Balanced depth and latency. |
  | **Non-think** | `chat_template_kwargs.enable_thinking: false` | Fast, no chain-of-thought. |

  The chat template resolves effort to **`max` unless `reasoning_effort` is explicitly `"high"`**,
  so Max is the default and High is opt-in. Pass it through `chat_template_kwargs` (the
  DeepSeek-V4 path) or the top-level OpenAI `reasoning_effort` field; it has no effect when
  thinking is disabled.

  ## Client usage

  ```python
  from openai import OpenAI

  client = OpenAI(api_key="EMPTY", base_url="http://localhost:8000/v1")
  msgs = [{"role": "user", "content": "Summarize GLM-5.2 in one sentence."}]

  # Think Max (default) — just omit reasoning_effort
  client.chat.completions.create(model="glm-5.2-fp8", messages=msgs, max_tokens=4096)

  # Think High — explicitly request reasoning_effort: "high"
  client.chat.completions.create(
      model="glm-5.2-fp8",
      messages=msgs,
      max_tokens=4096,
      extra_body={"chat_template_kwargs": {"reasoning_effort": "high"}},
  )

  # Non-think
  client.chat.completions.create(
      model="glm-5.2-fp8",
      messages=msgs,
      max_tokens=4096,
      extra_body={"chat_template_kwargs": {"enable_thinking": False}},
  )
  ```

