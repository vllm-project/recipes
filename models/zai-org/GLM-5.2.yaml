  ### Ascend Deployment

  #### Context Below 1M

  ##### Single-node Deployment

  Set `MODEL_PATH` to the local **W4A8C8** checkpoint in every container before running this scenario.

  - Quantized model `GLM-5.2-w4a8c8` can be deployed on 1 Atlas 800 A3 (64GB × 16) .

  Run the following script to execute online inference.

  ```bash
  export HCCL_BUFFSIZE=200
  export HCCL_OP_EXPANSION_MODE="AIV"
  export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
  # Ensure the model path matches the directory recorded during download
  vllm serve "$MODEL_PATH" \
  --host 0.0.0.0 \
  --port 8000 \
  --api-server-count 1 \
  --data-parallel-size 2 \
  --enable-expert-parallel \
  --tensor-parallel-size 8 \
  --seed 1024 \
  --served-model-name glm-52 \
  --tool-call-parser glm47 \
  --reasoning-parser glm45 \
  --enable-auto-tool-choice \
  --max-num-seqs 12 \
  --max-model-len 135000 \
  --max-num-batched-tokens 8192 \
  --trust-remote-code \
  --gpu-memory-utilization 0.92 \
  --quantization ascend \
  --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}' \
  --attention_config.indexer_kv_dtype int8 \
  --additional-config '{"enable_dsa_cp": true, "enable_balance_scheduling": true,"multistream_overlap_shared_expert":true, "enable_flashcomm1": true, "enable_fused_mc2": 0}' \
  --speculative-config '{"num_speculative_tokens": 3, "method": "deepseek_mtp","enforce_eager":true}'

  ```

