meta:
  title: "GLM-5.1"
  slug: "glm-5.1"
  provider: "GLM (Z-AI)"
  description: "GLM-5.1 refreshed version of GLM-5 — frontier-scale MoE language model (~744B total parameters) with MTP speculative decoding and thinking mode"
  date_added: 2026-03-28
  date_updated: 2026-05-21
  difficulty: advanced
  tasks:
    - text
  performance_headline: "Refreshed GLM-5 series MoE with improved reasoning, coding, and agentic performance"
  related_recipes: []
  hardware:
    h200: verified

model:
  model_id: "zai-org/GLM-5.1"
  min_vllm_version: "0.19.1"
  architecture: moe
  parameter_count: "744B"
  active_parameters: "40B"
  context_length: 202752
  base_args:
    - "--trust-remote-code"
    - "--chat-template-content-format=string"
  base_env: {}

features:
  tool_calling:
    description: "GLM-4.7 tool call parser with automatic tool choice"
    args:
      - "--tool-call-parser"
      - "glm47"
      - "--enable-auto-tool-choice"
  reasoning:
    description: "GLM-4.5 reasoning parser — thinking mode enabled by default on requests"
    args:
      - "--reasoning-parser"
      - "glm45"
  spec_decoding:
    description: "Multi-Token Prediction speculative decoding (3 draft tokens)"
    args:
      - "--speculative-config.method"
      - "mtp"
      - "--speculative-config.num_speculative_tokens"
      - "3"

opt_in_features:
  - spec_decoding

variants:
  default:
    precision: bf16
    vram_minimum_gb: 1786
    description: "Full precision BF16 — requires multi-node deployment"
  fp8:
    model_id: "zai-org/GLM-5.1-FP8"
    precision: fp8
    vram_minimum_gb: 893
    description: "Native FP8 checkpoint — 8xH200/H20 (141GB × 8) single-node serving"
  nvfp4:
    model_id: "nvidia/GLM-5.1-NVFP4"
    precision: nvfp4
    vram_minimum_gb: 446
    description: "NVIDIA NVFP4 quantized weights for Blackwell GPUs"
    extra_args:
      - "--kv-cache-dtype"
      - "fp8"
    extra_env:
      VLLM_USE_FLASHINFER_MOE_FP4: "1"

compatible_strategies:
  - single_node_tp
  - single_node_tep
  - multi_node_tp
  - multi_node_tp_pp
  - multi_node_tep
  - multi_node_dep
  - pd_cluster

hardware_overrides: {}

strategy_overrides: {}

guide: |
  ## Overview

  GLM-5.1 is a refreshed version of GLM-5, the 744B parameter frontier MoE model from Z-AI.
  It keeps the asynchronous RL training recipe and delivers best-in-class open-source
  performance on reasoning, coding, and agentic benchmarks. Both BF16 and native FP8
  checkpoints are published.

  Thinking mode is enabled by default; disable it by passing
  `"chat_template_kwargs": {"enable_thinking": false}` in request extras.

  ## Prerequisites

  - **vLLM version:** 0.19.0 (stable — preferred over nightly for model performance).
    Use the latest main branch if you need tool calling + MTP simultaneously.
  - **Hardware (FP8):** 8xH200 or 8xH20 (141GB × 8)
  - **DeepGEMM (FP8):** install via `install_deepgemm.sh` from vLLM repo
  - **TileRT PD disaggregation:** `vllm/vllm-openai:nightly` image +
    `tilert >= 0.1.5.post1` (`pip install tilert`) — verified on 8xB300, see the
    dedicated section below


  ### Using Docker

  ```bash
  docker run --gpus all \
    -p 8000:8000 \
    --ipc=host \
    -v ~/.cache/huggingface:/root/.cache/huggingface \
    vllm/vllm-openai:latest zai-org/GLM-5.1-FP8 \
      --tensor-parallel-size 8 \
      --tool-call-parser glm47 \
      --reasoning-parser glm45 \
      --enable-auto-tool-choice \
      --chat-template-content-format=string \
      --served-model-name glm-5.1-fp8
  ```

  Use `vllm/vllm-openai:latest-cu129` for CUDA 12.x.

  ### Install vLLM from Source

  ```bash
  uv venv
  source .venv/bin/activate
  uv pip install "vllm==0.19.0" --torch-backend=auto
  uv pip install "transformers>=5.4.0"
  ```

  ## Launching the Server

  ### FP8 on 8xH200 with MTP

  ```bash
  vllm serve zai-org/GLM-5.1-FP8 \
       --tensor-parallel-size 8 \
       --speculative-config.method mtp \
       --speculative-config.num_speculative_tokens 3 \
       --tool-call-parser glm47 \
       --reasoning-parser glm45 \
       --enable-auto-tool-choice \
       --chat-template-content-format=string \
       --served-model-name glm-5.1-fp8
  ```

  ### PD Disaggregation with TileRT (vLLM Prefill + TileRT Decode)

  [TileRT](https://github.com/tile-ai/TileRT) (>= v0.1.5) provides a
  [PD-disaggregated deployment](https://www.tilert.ai/blog/tilert-vllm-disaggregation.html)
  for GLM5.1: vLLM serves the prefill phase, the TileRT engine serves the
  decode phase, and a lightweight router exposes a single OpenAI-compatible
  endpoint. This trades a small amount of prefill capacity for much higher
  single-request decode speed.

  **Verified end-to-end on a single 8xB300 node** (prefill and decode
  co-located on the same node), 64K input /1K output reaching **~428 tokens/s decode TPS** on
  GLM-5.1-FP8 with MTP enabled.

  The recipe below assumes prefill and decode run in three containers on the
  same host. For a two-node deployment, replace `<DECODE_IP>` / `<PREFILL_IP>` / `<ROUTER_IP>`
  accordingly and share the weights via a common path or download them on both
  nodes.

  #### 1. Prepare the decode container and convert the weights

  ```bash
  docker run -itd \
    --name tilert-decode \
    --privileged \
    --gpus all \
    --net host \
    --ipc host \
    -v /data/cache:/models \
    --entrypoint /bin/bash \
    vllm/vllm-openai:nightly \
    -c "sleep infinity"

  docker exec -it tilert-decode bash
  pip install tilert
  ```
  Convert the FP8 checkpoint to the TileRT weight layout 

  ```bash
  python3 -m tilert.models.preprocess.weight_converter \
    --model_type glm-5 \
    --model_dir /models/GLM-5.1-FP8 \
    --save_dir /models/tilert-glm5.1

  # TileRT loads the tokenizer/template from the converted directory
  cd /models/GLM-5.1-FP8
  cp tokenizer.json tokenizer_config.json chat_template.jinja /models/tilert-glm5.1/
  ```

  #### 2. Launch the TileRT decode server

  ```bash
  python3 -m tilert.pd_vllm.decode_server \
    --engine tilert --model glm5 \
    --model-weights-dir /models/tilert-glm5.1 \
    --with-mtp --max-seq-len 202752 \
    --kv-cache-dtype fp8 \
    --ctrl-port 5556 --http-port 5557
  ```

  #### 3. Launch the vLLM prefill server

  In a second container from the same `vllm/vllm-openai:nightly` image
  (install the connector only — `pip install tilert --no-deps`):

  ```bash
  vllm serve /models/GLM-5.1-FP8 \
    --served-model-name glm5.1 \
    --port 8000 \
    --tensor-parallel-size 8 \
    --enforce-eager \
    --trust-remote-code \
    --return-tokens-as-token-ids \
    --gpu-memory-utilization 0.5 \
    --kv-cache-dtype fp8_ds_mla \
    --speculative-config '{"method": "mtp", "num_speculative_tokens": 1}' \
    --kv-transfer-config '{
      "kv_connector": "TileRTConnector",
      "kv_connector_module_path": "tilert.pd_vllm.prefill_connector",
      "kv_role": "kv_producer",
      "kv_connector_extra_config": {
        "tilert_host": "<DECODE_IP>",
        "tilert_ctrl_port": 5556,
        "tilert_model": "glm5",
        "tilert_max_seq_len": 202752
      }
    }'
  ```
  #### 4. Launch the PD router

  ```bash
  python3 -m tilert.pd_vllm.pd_router \
    --vllm-url http://<PREFILL_IP>:8000 \
    --decode <DECODE_IP>:5556:5557 \
    --model-path /models/GLM-5.1-FP8 \
    --port 23333
  ```
  #### 5. Test through the router

  The script below sends one request through the router and reports both
  end-to-end TPS and decode-only TPS (from the `pd_timing_ms` field in the
  response):

  ```bash
  curl http://<ROUTER_IP>:23333/v1/chat/completions \
  -H "Content-Type: application/json" \
  -d '{
    "model": "glm-5.1-fp8",
    "stream": false,
    "messages": [{"role": "user", "content": "nihao"}]
  }'
  ```
  * TPS UP TO 600 + FOR SINGLE REQUEST(single B300 deploy)

  #### 6. benchmark
  
  ```bash
  pip install  'evalscope[perf]'
  evalscope perf \
  --url http://<ROUTER_IP>:23333/v1/completions \
  --api openai \
  --model glm5.1 \
  --dataset random \
  --tokenizer-path /models/GLM-5.1-FP8 \
  --min-prompt-length 64000 --max-prompt-length 64000 \
  --max-tokens 1000 \
  --number 10 --parallel 1 \
  --no-stream
  ```

  * The TileRT router does not support streaming requests currently, so you need to use stream:false to test this solution.

  ## Client Usage

  ```python
  from openai import OpenAI

  client = OpenAI(api_key="EMPTY", base_url="http://localhost:8000/v1")

  # Thinking ON (default)
  resp_on = client.chat.completions.create(
      model="glm-5.1-fp8",
      messages=[{"role": "user", "content": "Summarize GLM-5.1 in one sentence."}],
      temperature=1,
      max_tokens=4096,
  )
  print(resp_on.choices[0].message.reasoning)

  # Thinking OFF
  resp_off = client.chat.completions.create(
      model="glm-5.1-fp8",
      messages=[{"role": "user", "content": "Summarize GLM-5.1 in one sentence."}],
      temperature=1,
      max_tokens=4096,
      extra_body={"chat_template_kwargs": {"enable_thinking": False}},
  )
  ```

  ### cURL (Thinking ON)

  ```bash
  curl http://localhost:8000/v1/chat/completions \
    -H "Content-Type: application/json" \
    -d '{
      "model": "glm-5.1-fp8",
      "messages": [
        {"role": "user", "content": "Summarize GLM-5.1 in one sentence."}
      ],
      "temperature": 1,
      "max_tokens": 4096
    }'
  ```

  ## Benchmarking

  ```bash
  vllm bench serve \
    --model zai-org/GLM-5.1-FP8 \
    --dataset-name random \
    --random-input 8000 \
    --random-output 1024 \
    --request-rate 10 \
    --num-prompts 32 \
    --ignore-eos
  ```

  ## Troubleshooting

  - **Accuracy drift:** Prefer the 0.19.0 stable release for best accuracy.
  - **Tool calling + MTP:** If both are needed, use the latest vLLM main branch.
  - **FP8 installation:** DeepGEMM required for FP8 performance.

  ## References

  - [Model card](https://huggingface.co/zai-org/GLM-5.1)
  - [FP8 checkpoint](https://huggingface.co/zai-org/GLM-5.1-FP8)
  - [DeepGEMM install script](https://github.com/vllm-project/vllm/blob/v0.16.0rc0/tools/install_deepgemm.sh)
