meta:
  title: "GLM-5.1"
  slug: "glm-5.1"
  provider: "GLM (Z-AI)"
  description: "GLM-5.1 refreshed version of GLM-5 — frontier-scale MoE language model (~744B total parameters) with MTP speculative decoding and thinking mode"
  date_added: 2026-03-28
  date_updated: 2026-09-28
  difficulty: advanced
  tasks:
    - text
  performance_headline: "Refreshed GLM-5 series MoE with improved reasoning, coding, and agentic performance"
  related_recipes: []
  hardware:
    h200: verified
    mi355x: verified
    # Opt into the restricted profile without claiming a fresh tutorial run.
    ascend_950dt: null

model:
  model_id: "zai-org/GLM-5.1"
  min_vllm_version: "0.23.0"
  default_frontend: rust
  architecture: moe
  parameter_count: "744B"
  active_parameters: "40B"
  context_length: 202752
  base_args:
    - "--trust-remote-code"
    - "--chat-template-content-format"
    - "string"
  base_env: {}

features:
  tool_calling:
    description: "GLM-4.7 tool call parser with automatic tool choice"
    args:
      - "--tool-call-parser"
      - "glm47"
      - "--enable-auto-tool-choice"
  reasoning:
    description: "GLM-4.7 reasoning parser — thinking mode enabled by default on requests"
    args:
      - "--reasoning-parser"
      - "glm47"
    hardware_overrides:
      ascend_950dt:
        args: ["--reasoning-parser", "glm45"]
  spec_decoding:
    description: "Multi-Token Prediction speculative decoding (3 draft tokens) — not yet supported on the AMD MXFP4 checkpoint"
    default_mode: mtp
    modes:
      mtp:
        label: "MTP"
        description: "Built-in Multi-Token Prediction, 3 draft tokens."
        hardware:
          mi355x: unsupported
        args:
          - "--speculative-config.method"
          - "mtp"
          - "--speculative-config.num_speculative_tokens"
          - "3"
        hardware_overrides:
          ascend_950dt:
            args:
              - "--speculative-config"
              - '{"num_speculative_tokens":3,"method":"deepseek_mtp","enforce_eager":true}'

opt_in_features:
  - spec_decoding

variants:
  default:
    min_vllm_version: "0.24.0"
    precision: bf16
    vram_minimum_gb: 1786
    description: "Full precision BF16 — requires multi-node deployment"
  fp8:
    min_vllm_version: "0.24.0"
    model_id: "zai-org/GLM-5.1-FP8"
    precision: fp8
    vram_minimum_gb: 893
    description: "Native FP8 checkpoint — 8xH200/H20 (141GB × 8) single-node serving"
  nvfp4:
    min_vllm_version: "0.24.0"
    model_id: "nvidia/GLM-5.1-NVFP4"
    precision: nvfp4
    vram_minimum_gb: 446
    description: "NVIDIA NVFP4 quantized weights for Blackwell GPUs"
    extra_args:
      - "--kv-cache-dtype"
      - "fp8"
  mxfp4:
    model_id: "amd/GLM-5.1-MXFP4"
    precision: mxfp4
    vram_minimum_gb: 447
    min_vllm_version: "0.24.0"
    supported_hardware:
      - mi355x
    description: "AMD Quark MXFP4 checkpoint — MoE weights quantized for MI355X (gfx950)"
    extra_args:
      - "--kv-cache-dtype"
      - "fp8_e4m3"
      - "-cc.pass_config.fuse_allreduce_rms=False"
      - "--block-size=1"
      - "--enable-prefix-caching"
      - "--max-num-seqs"
      - "64"
    hardware_overrides:
      mi355x:
        extra_env:
          VLLM_USE_V2_MODEL_RUNNER: "1"
          VLLM_ROCM_USE_AITER_FP8BMM: "0"
          VLLM_ROCM_USE_AITER_FP4BMM: "0"
          VLLM_ROCM_USE_AITER_RMSNORM: "0"
          VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: "INT4"

  ascend_w4a4_mxfp4:
    model_id: "Eco-Tech/GLM-5.1-w4a4c8-mxfp4"
    label: "W4A4C8 (Ascend MXFP4)"
    precision: mxfp4
    # Conservative budget matching the tutorial's full 8x96 GB node.
    vram_minimum_gb: 768
    description: "Ascend 950DT single-node W4A4C8/MXFP4; 8x96 GB, TP8 + EP, DP1."
    supported_hardware: [ascend_950dt]
    tp: 8
    extra_args:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--data-parallel-size"
      - "1"
      - "--seed"
      - "1024"
      - "--enable-expert-parallel"
      - "--max-num-seqs"
      - "128"
      - "--max-model-len"
      - "202752"
      - "--max-num-batched-tokens"
      - "8192"
      - "--enable-prefix-caching"
      - "--gpu-memory-utilization"
      - "0.95"
      - "--quantization"
      - "ascend"
      - "--kv-cache-dtype"
      - "int8"
      - "--attention_config.indexer_kv_dtype"
      - "int8"
      - "--chat-template-content-format"
      - "auto"
      - "--compilation-config"
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - "--hf-overrides"
      - '{"use_index_cache":true,"index_topk_freq":4}'
      - "--additional-config"
      - '{"enable_cpu_binding":"True","multistream_overlap_shared_expert":"True","enable_dsa_cp":true,"eplb_config":{"dynamic_eplb":true,"expert_heat_collection_interval":50,"algorithm_execution_interval":5,"eplb_policy_type":2,"num_redundant_experts":0},"enable_flashcomm1":true}'
    extra_env:
      VLLM_USE_MODELSCOPE: "True"
      HCCL_BUFFSIZE: "400"
      HCCL_IF_IP: "${HCCL_IF_IP:?Set_HCCL_IF_IP}"
      HCCL_INTRA_ROCE_ENABLE: "0"
      HCCL_OP_EXPANSION_MODE: "AIV"
      HCCL_SOCKET_IFNAME: "${HCCL_SOCKET_IFNAME:?Set_HCCL_SOCKET_IFNAME}"
      ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      DYNAMIC_EPLB: "true"
      GLOO_SOCKET_IFNAME: "${HCCL_SOCKET_IFNAME:?Set_HCCL_SOCKET_IFNAME}"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      PROMETHEUS_MULTIPROC_DIR: "/dev/shm/vllm_metrics"
      HCCL_DFS_CONFIG: "task_exception:off,inconsistent_check:off"
      VLLM_ASCEND_ENABLE_PREFETCH_MLP: "1"
    hardware_overrides:
      ascend_950dt:
        docker_image: "quay.io/ascend/vllm-ascend:v0.23.0-a5"
        install:
          pip: false

compatible_strategies:
  - single_node_tp
  - single_node_tep
  - multi_node_tp
  - multi_node_tp_pp
  - multi_node_tep
  - multi_node_dep
  - pd_cluster

strategy_hardware:
  # This recipe exposes only the tutorial's single-node TP8 + EP on A5.
  single_node_tp:
    ascend_950dt: unsupported
  multi_node_tp:
    ascend_950dt: unsupported
  multi_node_tp_pp:
    ascend_950dt: unsupported
  multi_node_tep:
    ascend_950dt: unsupported
  multi_node_dep:
    ascend_950dt: unsupported
  pd_cluster:
    ascend_950dt: unsupported

# Mooncake untested on MI355X so far — opt out until verified (the schema
# only recognizes the literal "unsupported" value here). LMCache is left
# fail-open (no hardware-scoped gate exists for it); see the MXFP4 guide
# note below instead.
kv_cache_strategy_hardware:
  kv_store_distributed_mooncake:
    mi355x: unsupported
  kv_store_centralized_mooncake:
    mi355x: unsupported

hardware_overrides:
  ascend_950dt:
    frontend: python
  amd:
    extra_args:
      - "--linear-backend"
      - "aiter"
      - "--moe-backend"
      - "aiter"
    extra_env:
      VLLM_ROCM_USE_AITER: "1"
      VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: "1"

strategy_overrides: {}

guide: |
  ## Ascend 950DT (A5), single node

  Based on the [vLLM Ascend tutorial](https://github.com/vllm-project/vllm-ascend/blob/597ab74d86af0e5d9a467618d70bd0aafed0cbea/docs/source/tutorials/models/GLM5.md):
  one 8x96 GB node, TP8 + EP, DP1. Select the Ascend variant, **Single-node**,
  **Tensor + Expert Parallel**, **Python** and enable **Spec Decoding** for MTP3.
  Other parallel layouts are outside this recipe's A5 configuration.

  Uses [Eco-Tech/GLM-5.1-w4a4c8-mxfp4](https://modelscope.cn/models/Eco-Tech/GLM-5.1-w4a4c8-mxfp4),
  not the AMD MXFP4 checkpoint or GLM-5.

  ### Prepare the container

  Run on the host after checking the device/driver paths. Use this setup and
  in-container launch instead of the site's generic Docker wrapper.

  ```bash
  docker pull quay.io/ascend/vllm-ascend:v0.23.0-a5
  docker run --rm -it --net=host --shm-size=1g \
    --device /dev/davinci0 --device /dev/davinci1 \
    --device /dev/davinci2 --device /dev/davinci3 \
    --device /dev/davinci4 --device /dev/davinci5 \
    --device /dev/davinci6 --device /dev/davinci7 \
    --device /dev/davinci_manager --device /dev/hisi_hdc \
    --device /dev/ummu --device /dev/uburma \
    -v /usr/local/Ascend/driver:/usr/local/Ascend/driver \
    -v /etc/ascend_install.info:/etc/ascend_install.info \
    -v /etc/hccl_rootinfo.json:/etc/hccl_rootinfo.json \
    -v /etc/hixlep/:/etc/hixlep/ \
    -v ~/.cache:/root/.cache \
    -v /usr/local/sbin:/usr/local/sbin \
    -v /usr/local/dcmi:/usr/local/dcmi \
    -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
    -v /usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi \
    -v /usr/bin/urma_admin:/usr/bin/urma_admin \
    -v /lib/route.conf:/lib/route.conf \
    -v /usr/lib64:/usr/lib64 \
    --entrypoint /bin/bash quay.io/ascend/vllm-ascend:v0.23.0-a5
  ```

  ### Serve inside the container

  Replace the communication IP/interface below. Keep the working directory
  set by the container command. The Python frontend is used on A5.

  ```bash
  export HCCL_IF_IP="<node_ip>"
  export HCCL_SOCKET_IFNAME="<network_interface>"
  mkdir -p /dev/shm/vllm_metrics
  export VLLM_USE_MODELSCOPE=True
  export HCCL_BUFFSIZE=400
  export HCCL_IF_IP=${HCCL_IF_IP:?Set_HCCL_IF_IP}
  export HCCL_INTRA_ROCE_ENABLE=0
  export HCCL_OP_EXPANSION_MODE=AIV
  export HCCL_SOCKET_IFNAME=${HCCL_SOCKET_IFNAME:?Set_HCCL_SOCKET_IFNAME}
  export ASCEND_RT_VISIBLE_DEVICES=0,1,2,3,4,5,6,7
  export DYNAMIC_EPLB=true
  export GLOO_SOCKET_IFNAME=${HCCL_SOCKET_IFNAME:?Set_HCCL_SOCKET_IFNAME}
  export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
  export PROMETHEUS_MULTIPROC_DIR=/dev/shm/vllm_metrics
  export HCCL_DFS_CONFIG=task_exception:off,inconsistent_check:off
  export VLLM_ASCEND_ENABLE_PREFETCH_MLP=1
  vllm serve Eco-Tech/GLM-5.1-w4a4c8-mxfp4 \
    --trust-remote-code \
    --host 0.0.0.0 \
    --port 8000 \
    --data-parallel-size 1 \
    --seed 1024 \
    --max-num-seqs 128 \
    --max-model-len 202752 \
    --max-num-batched-tokens 8192 \
    --enable-prefix-caching \
    --gpu-memory-utilization 0.95 \
    --quantization ascend \
    --kv-cache-dtype int8 \
    --attention_config.indexer_kv_dtype int8 \
    --chat-template-content-format auto \
    --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}' \
    --hf-overrides '{"use_index_cache":true,"index_topk_freq":4}' \
    --additional-config '{"enable_cpu_binding":"True","multistream_overlap_shared_expert":"True","enable_dsa_cp":true,"eplb_config":{"dynamic_eplb":true,"expert_heat_collection_interval":50,"algorithm_execution_interval":5,"eplb_policy_type":2,"num_redundant_experts":0},"enable_flashcomm1":true}' \
    --enable-expert-parallel \
    --tensor-parallel-size 8 \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice \
    --reasoning-parser glm45 \
    --speculative-config '{"num_speculative_tokens":3,"method":"deepseek_mtp","enforce_eager":true}'
  ```

  No fresh NPU run is claimed. The 202752-token window and concurrency 128
  follow the tutorial, not a measured capacity guarantee.

  ## Overview

  GLM-5.1 is a refreshed version of GLM-5, the 744B parameter frontier MoE model from Z-AI.
  It keeps the asynchronous RL training recipe and delivers best-in-class open-source
  performance on reasoning, coding, and agentic benchmarks. Both BF16 and native FP8
  checkpoints are published.

  Thinking mode is enabled by default; disable it by passing
  `"chat_template_kwargs": {"enable_thinking": false}` in request extras.

  ## Prerequisites

  - **vLLM version:** >= 0.24.0 for the `glm47` reasoning parser.
    Use the latest main branch if you need tool calling + MTP simultaneously.
  - **Hardware (FP8):** 8xH200 or 8xH20 (141GB × 8)
  - **DeepGEMM (FP8):** install via `install_deepgemm.sh` from vLLM repo
  - **Hardware (MXFP4):** 8x MI355X (gfx950), vLLM >= 0.24.0, `vllm/vllm-openai-rocm:latest`

  ### Using Docker

  ```bash
  docker run --gpus all \
    -p 8000:8000 \
    --ipc=host \
    -v ~/.cache/huggingface:/root/.cache/huggingface \
    vllm/vllm-openai:latest zai-org/GLM-5.1-FP8 \
      --tensor-parallel-size 8 \
      --tool-call-parser glm47 \
      --reasoning-parser glm47 \
      --enable-auto-tool-choice \
      --chat-template-content-format=string \
      --served-model-name glm-5.1-fp8
  ```

  Use `vllm/vllm-openai:latest-cu129` for CUDA 12.x.

  ### Install vLLM from Source

  ```bash
  uv venv
  source .venv/bin/activate
  uv pip install "vllm==0.24.0" --torch-backend=auto
  uv pip install "transformers>=5.4.0"
  ```

  ## Launching the Server

  ### FP8 on 8xH200 with MTP

  ```bash
  vllm serve zai-org/GLM-5.1-FP8 \
       --tensor-parallel-size 8 \
       --speculative-config.method mtp \
       --speculative-config.num_speculative_tokens 3 \
       --tool-call-parser glm47 \
       --reasoning-parser glm47 \
       --enable-auto-tool-choice \
       --chat-template-content-format=string \
       --served-model-name glm-5.1-fp8
  ```

  ## Client Usage

  ```python
  from openai import OpenAI

  client = OpenAI(api_key="EMPTY", base_url="http://localhost:8000/v1")

  # Thinking ON (default)
  resp_on = client.chat.completions.create(
      model="glm-5.1-fp8",
      messages=[{"role": "user", "content": "Summarize GLM-5.1 in one sentence."}],
      temperature=1,
      max_tokens=4096,
  )
  print(resp_on.choices[0].message.reasoning)

  # Thinking OFF
  resp_off = client.chat.completions.create(
      model="glm-5.1-fp8",
      messages=[{"role": "user", "content": "Summarize GLM-5.1 in one sentence."}],
      temperature=1,
      max_tokens=4096,
      extra_body={"chat_template_kwargs": {"enable_thinking": False}},
  )
  ```

  ### cURL (Thinking ON)

  ```bash
  curl http://localhost:8000/v1/chat/completions \
    -H "Content-Type: application/json" \
    -d '{
      "model": "glm-5.1-fp8",
      "messages": [
        {"role": "user", "content": "Summarize GLM-5.1 in one sentence."}
      ],
      "temperature": 1,
      "max_tokens": 4096
    }'
  ```

  ## Benchmarking

  ```bash
  vllm bench serve \
    --model zai-org/GLM-5.1-FP8 \
    --dataset-name random \
    --random-input 8000 \
    --random-output 1024 \
    --request-rate 10 \
    --num-prompts 32 \
    --ignore-eos
  ```

  ## Troubleshooting

  - **Accuracy drift:** Prefer the 0.19.0 stable release for best accuracy.
  - **Tool calling + MTP:** If both are needed, use the latest vLLM main branch.
  - **FP8 installation:** DeepGEMM required for FP8 performance.
  - **MXFP4 (MI355X):** MTP speculative decoding isn't yet supported on this checkpoint/kernel path. Mooncake and LMCache KV-store offload are still untested on MI355X — worth a check before leaning on them in production.

  ## References

  - [Model card](https://huggingface.co/zai-org/GLM-5.1)
  - [FP8 checkpoint](https://huggingface.co/zai-org/GLM-5.1-FP8)
  - [MXFP4 checkpoint](https://huggingface.co/amd/GLM-5.1-MXFP4)
  - [DeepGEMM install script](https://github.com/vllm-project/vllm/blob/v0.16.0rc0/tools/install_deepgemm.sh)
