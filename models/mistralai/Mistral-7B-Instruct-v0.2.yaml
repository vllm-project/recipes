guide: |
  ## Overview

  This recipe groups Mistral-7B-Instruct-v0.2 with the TheBloke AWQ INT4
  checkpoint. Both checkpoints have PASS rows in the Intel Xeon 6 serving BKM.

  ## Prerequisites

  - Hardware: 4x Xeon6/Xeon5 NUMA node
  - vLLM >= 0.2.1

  ### Docker (Intel Xeon 6 CPUs)

  ```bash
  docker pull vllm/vllm-openai-cpu:latest-x86_64
  ```

  ## Intel Xeon 6

  ```bash
  vllm serve mistralai/Mistral-7B-Instruct-v0.2 \
    --max-num-batched-tokens 16384 \
    --gpu-memory-utilization 0.8
  ```

  AWQ:

  ```bash
  vllm serve TheBloke/Mistral-7B-Instruct-v0.2-AWQ \
    --quantization awq \
    --max-num-batched-tokens 16384 \
    --gpu-memory-utilization 0.8
  ```

  TP/DP values, `--max-num-seqs=256`, prefix-cache controls, and host-specific
  CPU placement remain benchmark/deployment choices and are not hard-coded.

  ## References

  - [Parent model](https://huggingface.co/mistralai/Mistral-7B-Instruct-v0.2)
  - [AWQ variant](https://huggingface.co/TheBloke/Mistral-7B-Instruct-v0.2-AWQ)
  - [vLLM CPU installation](https://docs.vllm.ai/en/latest/getting_started/installation/cpu/)
