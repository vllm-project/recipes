  provider: "NVIDIA"
  description: "NVIDIA Minitron-8B-Base — a compact 8B dense Nemotron model pruned and distilled from Nemotron-4 15B, for general-purpose text generation and reasoning; fits a single 64 GB NPU"
  date_added: 2026-10-14
  date_updated: 2026-10-14
  tasks:
    - text
  performance_headline: "Single-card BF16 serving on Ascend 910B (Atlas 800I A2) with vLLM Ascend"
  hardware:
