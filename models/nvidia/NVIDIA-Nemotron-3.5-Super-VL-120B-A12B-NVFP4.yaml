# yaml-language-server: $schema=https://recipes.vllm.ai/recipe.schema.json
meta:
  title: "NVIDIA Nemotron 3.5 Super VL"
  slug: "nemotron-3-5-super-vl"
  provider: "NVIDIA"
  description: "120B total / 12B active vision-language model with image, video, reasoning, tool calling, and MTP"
  date_added: 2026-10-15
  date_updated: 2026-10-15
  difficulty: advanced
  tasks:
    - multimodal
  related_recipes:
    - "nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16"
  hardware:
    h200: verified

model:
  model_id: "nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4"
  min_vllm_version: "0.31.0"
  docker_image: "vllm/vllm-openai:v0.31.0"
  architecture: moe
  parameter_count: "120B"
  active_parameters: "12B"
  context_length: 1048576
  base_args:
    - "--trust-remote-code"
    - "--max-model-len"
    - "114688"
    - "--max-num-seqs"
    - "128"
    - "--gpu-memory-utilization"
    - "0.89"
    - "--max-num-batched-tokens"
    - "16384"
    - "--block-size"
    - "64"
    - "--prefix-match-unit"
    - "64"
    - "--compilation_config.max_cudagraph_capture_size"
    - "256"
    - "--mamba-backend"
    - "flashinfer"
    - "--mamba-ssm-cache-dtype"
    - "float16"
    - "--enable-mamba-cache-stochastic-rounding"
    - "--mamba-cache-philox-rounds"
    - "5"
    - "--enable-mamba-shared-prefix-checkpoint"
    - "--mamba-cache-mode"
    - "align"
    - "--video-pruning-rate"
    - "0.5"
    - "--media-io-kwargs"
    - '{"video":{"fps":2,"num_frames":256}}'
  base_env: {}

features:
  spec_decoding:
    description: "Use the checkpoint's MTP head to draft three tokens"
    args:
      - "--speculative-config.method"
      - "mtp"
      - "--speculative-config.num_speculative_tokens"
      - "3"
  tool_calling:
    description: "Parse tool calls with qwen3_coder and automatic tool choice"
    args:
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "qwen3_coder"
  reasoning:
    description: "Separate Nemotron v3 reasoning from the final answer"
    args:
      - "--reasoning-parser"
      - "nemotron_v3"

opt_in_features: []

variants:
  default:
    precision: nvfp4
    precision_hardware:
      brand: NVIDIA
    vram_minimum_gb: 91
    description: "NVFP4 W4A16 checkpoint; H200 profile from the NVIDIA cookbook"

compatible_strategies:
  - single_node_tp

hardware_overrides: {}

strategy_overrides:
  single_node_tp:
    tp: 1

guide: |
  ## Overview

  Nemotron 3.5 Super VL is a hybrid Mamba-MoE vision-language model with image and
  video input. This recipe starts from the NVIDIA cookbook's NVFP4 configuration on
  one H200, using `vllm/vllm-openai:v0.31.0`. The builder reproduces that
  configuration with the full Hugging Face model ID as the served name.

  ## Prerequisites

  - One NVIDIA H200 (141 GB) for the selected configuration.
  - The pinned vLLM Docker image and access to the NVFP4 checkpoint.
  - The model advertises up to 1M tokens; this configuration allocates 114,688
    tokens to fit the H200 memory budget.
  - The 91 GB weight allowance is derived from the NVFP4 checkpoint's 75.01 GB
    safetensors index plus the recipe schema's 20% overhead.

  ## Launch

  Select H200, the default NVFP4 variant, and single-node TP. The generated
  command includes the cookbook's MTP, Mamba cache, reasoning, tool calling,
  and video settings. The cookbook's `--served-model-name nemotron-3.5-super`
  is omitted so that the model ID in the generated verify command works directly.

  ## Client usage

  Send requests to `http://127.0.0.1:8000/v1` with model
  `nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4`. The cookbook includes
  examples for image and video inputs, tool calling, and reasoning output.

  ## References

  - [NVIDIA vLLM cookbook](https://github.com/NVIDIA-NeMo/Nemotron/blob/main/usage-cookbook/Nemotron-3.5-Super-VL/vllm_cookbook.ipynb)
  - [NVFP4 checkpoint](https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4)
