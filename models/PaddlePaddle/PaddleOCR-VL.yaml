meta:
  title: "PaddleOCR-VL"
  slug: "paddleocr-vl"
  provider: "PaddlePaddle"
  description: "PaddleOCR-VL (0.9B) — compact vision-language model for document parsing, OCR, tables, formulas, charts"
  date_added: 2025-11-04
  date_updated: 2026-10-12
  difficulty: beginner
  tasks:
    - multimodal
  related_recipes: []
  hardware:
    ascend_310p3: verified

model:
  model_id: "PaddlePaddle/PaddleOCR-VL"
  min_vllm_version: "0.11.1"
  architecture: dense
  parameter_count: "0.9B"
  active_parameters: "0.9B"
  context_length: 131072
  base_args:
    - "--trust-remote-code"
    - "--max-num-batched-tokens"
    - "16384"
    - "--no-enable-prefix-caching"
    - "--mm-processor-cache-gb"
    - "0"
  base_env: {}

dependencies:
  - note: "PaddlePaddle runtime (install in a separate venv from vllm to avoid conflicts)"
    command: "uv pip install paddlepaddle-gpu==3.2.1 --extra-index-url https://www.paddlepaddle.org.cn/packages/stable/cu126/"
    optional: true
    brand: NVIDIA
  - note: "PaddleOCR document-parsing helpers"
    command: 'uv pip install -U "paddleocr[doc-parser]"'
    optional: true
  - note: "Safetensors loader used by the doc-parser path"
    command: "uv pip install safetensors"
    optional: true

features:
  text_only:
    description: "Skip loading the vision encoder for text-only workloads — frees VRAM for KV cache. Mutually exclusive with encoder_parallel."
    args:
      - "--language-model-only"
  encoder_parallel:
    description: "Run the vision encoder in data-parallel mode — avoids TP comm overhead on the small encoder. Mutually exclusive with text_only."
    args:
      - "--mm-encoder-tp-mode"
      - "data"

opt_in_features:
  - text_only
  - encoder_parallel

variants:
  default:
    precision: bf16
    vram_minimum_gb: 3
    description: "BF16 weights — small footprint, runs on most GPUs"
    supported_hardware:
      - arch:gfx942
      - arch:gfx950
      - arch:sm100
      - arch:sm103
      - arch:sm120
      - arch:sm121
      - arch:sm89
      - arch:sm90
      - arc_pro_b60
      - arc_pro_b70
      - ironwood
      - trillium
      - xeon5
      - xeon6

  ascend_fp16:
    precision: fp16
    label: FP16 · Ascend graph
    vram_minimum_gb: 3
    description: Original 0.9B checkpoint on one Ascend 310P3; FULL_DECODE_ONLY requires CANN >= 9.0.0 and a compatible
      runtime.
    supported_hardware:
    - ascend_310p3
    hardware_overrides:
      ascend_310p3:
        docker_image: quay.io/ascend/vllm-ascend:nightly-main-310p@sha256:3706317b3a91fda5b7b53174d65d97aeb5c762068c8edf96387f0e9f462f9723
        docker_serve_command: vllm serve
        install:
          pip: false
          docker:
            note: Official main 310P image pinned by digest. End-to-end evidence uses the corresponding latest source
              build on HiDevLab CANN 9.1.0; the entire new container has not been run.
        extra_args:
        - --dtype
        - float16
        - --max-model-len
        - '16384'
        - --max-num-batched-tokens
        - '2048'
        - --served-model-name
        - PaddlePaddle/PaddleOCR-VL
        - PaddleOCR-VL-0.9B
        - --additional-config
        - '{"enable_cpu_binding":true}'
        - --compilation-config
        - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
        extra_env: &id001
          VLLM_USE_MODELSCOPE: 'True'
          ASCEND_RT_VISIBLE_DEVICES: '0'
          TASK_QUEUE_ENABLE: '1'
          PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
  ascend_fp16_eager:
    precision: fp16
    label: FP16 · Ascend eager
    vram_minimum_gb: 3
    description: Original 0.9B checkpoint on one Ascend 310P3; eager execution.
    supported_hardware:
    - ascend_310p3
    hardware_overrides:
      ascend_310p3:
        docker_image: quay.io/ascend/vllm-ascend:nightly-main-310p@sha256:3706317b3a91fda5b7b53174d65d97aeb5c762068c8edf96387f0e9f462f9723
        docker_serve_command: vllm serve
        install:
          pip: false
          docker:
            note: Official main 310P image pinned by digest. End-to-end evidence uses the corresponding latest source
              build on HiDevLab CANN 9.1.0; the entire new container has not been run.
        extra_args:
        - --dtype
        - float16
        - --max-model-len
        - '16384'
        - --max-num-batched-tokens
        - '2048'
        - --served-model-name
        - PaddlePaddle/PaddleOCR-VL
        - PaddleOCR-VL-0.9B
        - --additional-config
        - '{"enable_cpu_binding":true}'
        - --enforce-eager
        extra_env: *id001

compatible_strategies:
  - single_node_tp
  - multi_node_tp

kv_offload_support:
  offloading_cpu: verified
  offloading_fs: verified

hardware_overrides:
  amd:
    extra_args: []
    extra_env:
      SAFETENSORS_FAST_GPU: "1"
strategy_overrides: {}

guide: |
  ## Overview

  [PaddleOCR-VL](https://huggingface.co/PaddlePaddle/PaddleOCR-VL) is a SOTA resource-efficient
  model for document parsing. Its core (PaddleOCR-VL-0.9B) combines a NaViT-style dynamic
  resolution visual encoder with an ERNIE-4.5-0.3B language model, optimized for OCR,
  tables, formulas, and chart recognition.

  ## Prerequisites

  - Hardware: 1x GPU (small VRAM footprint)
  - vLLM >= 0.11.1 (nightly if not released yet)
  - AMD ROCm wheels require Python 3.12, ROCm 7.2.3, and glibc >= 2.35.

  ### Install vLLM (NVIDIA)

  ```bash
  uv venv
  source .venv/bin/activate
  uv pip install -U vllm --pre \
    --extra-index-url https://wheels.vllm.ai/nightly \
    --extra-index-url https://download.pytorch.org/whl/cu129 \
    --index-strategy unsafe-best-match
  ```

  ### Install vLLM (AMD ROCm)

  ```bash
  uv venv --python 3.12
  source .venv/bin/activate
  uv pip install vllm --extra-index-url https://wheels.vllm.ai/rocm
  ```

  ## Launch command

  ```bash
  vllm serve PaddlePaddle/PaddleOCR-VL \
    --trust-remote-code \
    --max-num-batched-tokens 16384 \
    --no-enable-prefix-caching \
    --mm-processor-cache-gb 0
  ```

  AMD MI300X/MI325X/MI355X:

  ```bash
  export SAFETENSORS_FAST_GPU=1

  vllm serve PaddlePaddle/PaddleOCR-VL \
    --trust-remote-code \
    --max-num-batched-tokens 16384 \
    --no-enable-prefix-caching \
    --mm-processor-cache-gb 0
  ```

  Tip: OCR workloads don't benefit much from prefix caching or image reuse, so disable
  those to avoid hashing/caching overhead.

  ## Client Usage

  Task-specific prompts:

  ```python
  from openai import OpenAI

  client = OpenAI(api_key="EMPTY", base_url="http://localhost:8000/v1", timeout=3600)

  TASKS = {
      "ocr": "OCR:",
      "table": "Table Recognition:",
      "formula": "Formula Recognition:",
      "chart": "Chart Recognition:",
  }

  response = client.chat.completions.create(
      model="PaddlePaddle/PaddleOCR-VL",
      messages=[{
          "role": "user",
          "content": [
              {"type": "image_url", "image_url": {"url": "https://.../receipt.png"}},
              {"type": "text", "text": TASKS["ocr"]},
          ],
      }],
      temperature=0.0,
  )
  print(response.choices[0].message.content)
  ```

  ## Offline Inference with PP-DocLayoutV2

  Use separate venvs for `vllm` and `paddlepaddle` to avoid conflicts. If you see
  "The model PaddleOCR-VL-0.9B does not exist.", add `--served-model-name PaddleOCR-VL-0.9B`.

  ```bash
  uv pip install paddlepaddle-gpu==3.2.1 --extra-index-url https://www.paddlepaddle.org.cn/packages/stable/cu126/
  uv pip install -U "paddleocr[doc-parser]"
  uv pip install safetensors
  ```

  ```python
  from paddleocr import PaddleOCRVL

  pipeline = PaddleOCRVL(
      vl_rec_backend="vllm-server",
      vl_rec_server_url="http://localhost:8000/v1",
      layout_detection_model_name="PP-DocLayoutV2",
      layout_detection_model_dir="/path/to/your/PP-DocLayoutV2/",
  )

  output = pipeline.predict("https://paddle-model-ecology.bj.bcebos.com/paddlex/imgs/demo_image/paddleocr_vl_demo.png")
  for i, res in enumerate(output):
      res.save_to_json(save_path=f"output_{i}.json")
      res.save_to_markdown(save_path=f"output_{i}.md")
  ```

  ## References

  - [PaddleOCR-VL on Hugging Face](https://huggingface.co/PaddlePaddle/PaddleOCR-VL)
  - [PaddleOCR GitHub](https://github.com/PaddlePaddle/PaddleOCR)

  ## Ascend 310P: original PaddleOCR-VL-0.9B

  Select **Ascend 310P3**, then **FP16 · Ascend graph** or **FP16 · Ascend eager**.
  The builder uses one logical NPU (TP=1), FP16, a 16384-token context, a 2048-token
  batch budget, disabled prefix/processor caches, and CPU-binding configuration.
  The stored BF16 checkpoint is cast to FP16 at load time. The BF16 variant remains
  for the existing non-NPU profiles, so it cannot emit an invalid BF16 310P command.
  Both public model aliases are served: `PaddlePaddle/PaddleOCR-VL` for this site's
  Verify/Bench clients and `PaddleOCR-VL-0.9B` for the PaddleOCR document pipeline.

  The latest official main 310P image was resolved on 2026-10-12 and pinned to
  `sha256:3706317b3a91fda5b7b53174d65d97aeb5c762068c8edf96387f0e9f462f9723`.
  It needs a matching CANN/driver stack. Eager mode disables graph execution; it
  does not make the current image compatible with an older CANN installation.
  The source tutorial permits eager as a graph fallback on older compatible runtimes.

  ### Tested source environment

  - HiDevLab Ascend 310P3: one of two logical devices selected, about 44 GB usable
    device memory; the platform's 64 GB selection is host RAM. The hardware profile
    uses the product's physical 48 GB DDR capacity rather than host RAM.
  - Ubuntu 22.04/aarch64, driver 25.5.0, CANN 9.1.0, Python 3.12.13,
    torch 2.10.0, torch_npu 2.10.0.post4, Transformers 5.14.1.
  - vLLM 0.30.0 source `ced6857afa0ea7b2e3f0846a62e1394e90f15607` with Ascend
    main `0830899b4e3f55ea6ed9f3518385e9d81192ae29`, compiled for Ascend 310P3.
  - The original model weights match Hugging Face revision
    `7fa00a8c55b735ba51ba49a9058f3f9c57a99a11`, SHA256
    `3085f1042e184f68f8a412aa0f64f2c4b8562989598bbfba326aaa11fc685de8`.
  - Graph and eager serving were run with real OCR, table, formula and chart inputs;
    expected content and `finish_reason=stop` were checked. Optional text-only,
    encoder-parallel, KV offload and the advertised 131072-token context were not tested.
  - The platform's 0.26.0rc1 image was preserved as a tested rollback baseline.
    No container engine was available for the complete newest-image run; the latest
    source build was installed separately. Keep this limitation separate from the
    image digest and source validation claims.
  - The container skipped CPU binding because its allowed CPUs conflicted with NUMA
    affinity. Preserve that warning when reporting performance.

  ### Recognition verification

  Save the following scripts in the working directory. The tutorial receipt URL currently returns HTTP 400, so these checks use pinned official demonstration images and crop only input regions. Sources, coordinates and hashes are recorded. If the NPU container cannot reach Hugging Face, download the same source files on the client and transfer them; pass --source-dir with their directory. These are functional sample assertions, not OmniDocBench accuracy. Table output is OTSL; the document pipeline converts it to HTML.

  ```python
  import argparse
  import hashlib
  import json
  import urllib.request
  from pathlib import Path

  from PIL import Image

  REVISION = '702b96b0a06740b0ed3d41ba382a5bf69986dcae'
  SAMPLES = {
      'ocr': ('text_english_arabic.jpg', (45, 159, 607, 449), 'f670627f3afa2e7ea312c71ce5c3c7b77a42938f9a1e62e5ba2505e19f5dede7'),
      'table': ('table_01.jpg', (713, 81, 1302, 424), 'ca798601c74d70cbb34a3a0b91161d21b79513bb049791c96dfed14bb087ceaf'),
      'formula': ('formula_EN.jpg', (126, 1328, 594, 1570), 'b9a96b4be44896a45df21103ba1b06af18621381b563707a42fa6cdf21f837d1'),
      'chart': ('chart_01.jpg', (27, 81, 614, 400), 'd77acb00585d16f978123bc8288c41e7a589083df51e18076a20853892c0d4a9'),
  }
  parser = argparse.ArgumentParser()
  parser.add_argument('--output', type=Path, default=Path('samples'))
  parser.add_argument('--source-dir', type=Path)
  args = parser.parse_args()
  args.output.mkdir(parents=True, exist_ok=True)
  manifest = []
  for task, (filename, box, expected_hash) in SAMPLES.items():
      source = (args.source_dir or args.output) / filename
      url = f'https://huggingface.co/datasets/PaddlePaddle/PaddleOCR-VL_demo/resolve/{REVISION}/imgs/{filename}'
      if not source.exists():
          with urllib.request.urlopen(url, timeout=90) as response:
              source.write_bytes(response.read())
      data = source.read_bytes()
      assert hashlib.sha256(data).hexdigest() == expected_hash, f'Source mismatch: {filename}'
      # The official demo collages contain input and expected output panels.
      # Crop only the input element; record coordinates in original pixels.
      with Image.open(source) as image:
          sx, sy = image.width / 1335, image.height / 1888
          coordinates = tuple(round(value * (sx if index % 2 == 0 else sy)) for index, value in enumerate(box))
          crop = image.crop(coordinates)
          crop.thumbnail((1536, 1536))
          target = args.output / f'{task}-crop.png'
          crop.save(target)
      manifest.append({'task': task, 'source_url': url, 'source_sha256': expected_hash, 'crop_coordinates': coordinates, 'crop_sha256': hashlib.sha256(target.read_bytes()).hexdigest()})
  (args.output / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
  ```

  Save as `prepare_samples.py`, then:

  ```bash
  python prepare_samples.py --output samples
  ```

  Save as `verify.py`:

  ```python
  import argparse
  import base64
  import hashlib
  import json
  import re
  import time
  import urllib.request
  from pathlib import Path

  TASKS = {'ocr': 'OCR:', 'table': 'Table Recognition:', 'formula': 'Formula Recognition:', 'chart': 'Chart Recognition:'}


  def get_json(url):
      with urllib.request.urlopen(url, timeout=15) as response:
          return json.load(response)


  def check_content(task, content):
      normalized = re.sub(r'\s+', '', content).lower()
      if task == 'ocr':
          expected = ['paddleocr', 'opensource', '2020', 'recognition']
          normalized = re.sub(r'[^a-z0-9]', '', content.lower())
      elif task == 'table':
          expected = ['<fcel>', '<nl>', 'regularhours', 'monday'] + [f'11/{day}/2013' for day in range(1, 15)]
      elif task == 'formula':
          expected = ['f(x)', '2x', 'f(3)', '=27']
          normalized = normalized.replace('\\left', '').replace('\\right', '').replace('{', '').replace('}', '')
      else:
          expected = ['2017', '2024', '37', '22']
      missing = [value for value in expected if value not in normalized]
      return {'expected_fragments': expected, 'missing_fragments': missing, 'otsl_row_count': content.count('<nl>') if task == 'table' else None, 'passed': not missing and (task != 'table' or content.count('<nl>') == 15)}


  def main():
      parser = argparse.ArgumentParser()
      parser.add_argument('--base-url', required=True)
      parser.add_argument('--model', default='PaddleOCR-VL-0.9B')
      parser.add_argument('--samples', type=Path, required=True)
      parser.add_argument('--output', type=Path, required=True)
      parser.add_argument('--repeats', type=int, default=1)
      parser.add_argument('--warmup', type=int, default=0)
      args = parser.parse_args()
      args.output.mkdir(parents=True, exist_ok=True)
      with urllib.request.urlopen(args.base_url + '/health', timeout=15) as response:
          assert response.status == 200
      models = get_json(args.base_url + '/v1/models')
      (args.output / 'models.json').write_text(json.dumps(models, indent=2))
      assert any(item['id'] == args.model for item in models['data'])
      results = []
      for repeat in range(-args.warmup, args.repeats):
          for task, prompt in TASKS.items():
              data = (args.samples / (task + '-crop.png')).read_bytes()
              payload = {'model': args.model, 'messages': [{'role': 'user', 'content': [
                  {'type': 'image_url', 'image_url': {'url': 'data:image/png;base64,' + base64.b64encode(data).decode()}},
                  {'type': 'text', 'text': prompt}]}], 'temperature': 0.0, 'max_tokens': 2048, 'seed': 0}
              request = urllib.request.Request(args.base_url + '/v1/chat/completions', data=json.dumps(payload).encode(), headers={'Content-Type': 'application/json'})
              start = time.perf_counter()
              with urllib.request.urlopen(request, timeout=300) as response:
                  result = json.load(response)
              latency = time.perf_counter() - start
              (args.output / f'{task}-{repeat}.json').write_text(json.dumps(result, indent=2, ensure_ascii=False) + '\n')
              choice = result['choices'][0]
              check = check_content(task, choice['message']['content'])
              check['finish_reason'] = choice['finish_reason']
              check['passed'] = check['passed'] and choice['finish_reason'] == 'stop'
              row = {'task': task, 'repeat': repeat, 'warmup': repeat < 0, 'input_sha256': hashlib.sha256(data).hexdigest(), 'latency_seconds': latency, 'usage': result.get('usage'), 'validation': check}
              results.append(row)
              (args.output / 'summary.json').write_text(json.dumps({'definition': 'functional sample checks; not a dataset accuracy score', 'concurrency': 1, 'temperature': 0.0, 'seed': 0, 'max_tokens': 2048, 'warmup_rounds': args.warmup, 'repeats': args.repeats, 'results': results}, indent=2, ensure_ascii=False) + '\n')
              print(json.dumps(row, ensure_ascii=False), flush=True)
      if not all(row['validation']['passed'] for row in results):
          raise SystemExit('Functional sample validation failed; inspect raw outputs')


  if __name__ == '__main__':
      main()
  ```

  ```bash
  python verify.py --base-url 'http://<server_ip>:<port>' --samples samples --output request-results --warmup 1 --repeats 3
  ```

  ### Full document parsing on 310P

  PP-DocLayoutV2 runs as an OM model through ACL on 310P. The unmodified Paddle
  `device="npu"` example is an A2 path. Use a separate layout environment, the pinned
  ModelZoo patch and CPU Paddle preprocessing, while keeping the recognition server
  in its own environment. The inference model is the separately published
  `PaddlePaddle/PP-DocLayoutV2`; the legacy `.pdmodel` bundled with the VLM checkpoint
  is not interchangeable with the reference exporter's `inference.json` model.
  Pin PaddleOCR 3.3.2 to preserve the original VLM; newer PaddleOCR APIs require
  `pipeline_version="v1"` to select it explicitly.

  #### Prepare the separate layout environment

  ```bash
  python3 -m venv layout-venv
  source layout-venv/bin/activate
  python -m pip install --upgrade pip uv
  git clone https://gitcode.com/Ascend/ModelZoo-PyTorch.git modelzoo
  git -C modelzoo checkout e779117e8cfeba296a7105e26adac0741ab04768
  export MODELZOO_DIR="$PWD/modelzoo/ACL_PyTorch/built-in/ocr/PP-DocLayoutV2"
  python -m pip install -r "$MODELZOO_DIR/requirements.txt"
  # The reference requirements install three overlapping cv2 distributions.
  # Keep the headless build on containers without libGL; reinstall it last.
  python -m pip uninstall -y opencv-python opencv-contrib-python opencv-python-headless
  python -m pip install opencv-python-headless==4.11.0.86
  python -m pip install \
      https://aisbench.obs.myhuaweicloud.com/packet/ais_bench_infer/0.0.2/ait/ais_bench-0.0.2-py3-none-any.whl \
      https://aisbench.obs.myhuaweicloud.com/packet/ais_bench_infer/0.0.2/ait/aclruntime-0.0.2-cp312-cp312-linux_aarch64.whl
  export PADDLEX_PACKAGE_DIR="$(python -c 'import importlib.util,pathlib; print(pathlib.Path(importlib.util.find_spec("paddlex").origin).parent)')"
  (cd "$PADDLEX_PACKAGE_DIR" && patch --dry-run -p1 < "$MODELZOO_DIR/paddlex.patch")
  (cd "$PADDLEX_PACKAGE_DIR" && patch -p1 < "$MODELZOO_DIR/paddlex.patch")
  modelscope download --model PaddlePaddle/PP-DocLayoutV2 --local_dir PP-DocLayoutV2
  ```

  #### Export and compile the OM layout model

  This is the pinned ModelZoo conversion sequence. Verify Python/ACL wheel compatibility and the actual chip. Compilation can take about 1.5 hours in the reference environment; preserve its logs.

  ```bash
  source /usr/local/Ascend/ascend-toolkit/set_env.sh
  export DISABLE_MODEL_SOURCE_CHECK=True
  # Activate layout-venv so PaddleX finds the pinned paddle2onnx executable.
  source layout-venv/bin/activate
  paddlex --paddle2onnx --paddle_model_dir PP-DocLayoutV2 --onnx_model_dir PP-DocLayoutV2
  deactivate
  # Surgeon requires ONNX Runtime wheels that are unavailable for Python 3.12.
  # Use a separate Python 3.10 tool environment; keep the serving/layout environments.
  layout-venv/bin/uv venv --python python3.10 --seed optimizer-venv
  source optimizer-venv/bin/activate
  python -m pip install --upgrade pip 'setuptools<81'
  python -m pip install msit 'onnx==1.16.1' 'numpy<2' 'pandas<3'
  msit install surgeon
  python -m auto_optimizer optimize PP-DocLayoutV2/inference.onnx PP-DocLayoutV2/inference_opt.onnx
  deactivate
  # Confirm the chip with npu-smi; this example is for the tested 310P3.
  atc --model=PP-DocLayoutV2/inference_opt.onnx --framework=5 \
      --output=PP-DocLayoutV2/inference --soc_version=Ascend310P3 \
      --input_shape 'im_shape:-1,2;image:-1,3,800,800;scale_factor:-1,2'
  test -f PP-DocLayoutV2/inference_linux_aarch64.om
  source layout-venv/bin/activate
  ```

  #### Parse through the recognition server

  Keep the online vLLM server running in its own environment. Save this as parse_document.py in the layout environment. On 310P, the patched layout predictor executes the OM model; Paddle preprocessing stays on CPU.

  ```python
  import argparse
  import json
  import time
  from pathlib import Path

  from paddleocr import PaddleOCRVL

  parser = argparse.ArgumentParser()
  parser.add_argument('--input', required=True)
  parser.add_argument('--layout-model', type=Path, required=True)
  parser.add_argument('--output', type=Path, default=Path('document-output'))
  parser.add_argument('--server-url', default='http://127.0.0.1:8000/v1')
  parser.add_argument('--layout-device', choices=['cpu', 'npu'], default='cpu')
  args = parser.parse_args()
  if args.layout_device == 'cpu':
      # CPU Paddle preprocessing + the ModelZoo-patched ACL InferSession(0).
      # PP-DocLayoutV2 still runs on NPU; Paddle custom-NPU is not used on 310P.
      assert (args.layout_model / 'inference_linux_aarch64.om').is_file(), 'Compile the aarch64 OM model first'
  pipeline = PaddleOCRVL(
      vl_rec_backend='vllm-server',
      vl_rec_server_url=args.server_url,
      layout_detection_model_name='PP-DocLayoutV2',
      layout_detection_model_dir=str(args.layout_model),
      use_doc_orientation_classify=False,
      use_doc_unwarping=False,
      device=args.layout_device,
  )
  args.output.mkdir(parents=True, exist_ok=True)
  start = time.perf_counter()
  count = 0
  for result in pipeline.predict_iter(args.input):
      result.save_to_json(str(args.output))
      result.save_to_markdown(str(args.output))
      count += 1
  elapsed = time.perf_counter() - start
  assert count > 0, 'No pages parsed'
  assert list(args.output.glob('*.md')), 'No Markdown output'
  assert list(args.output.glob('*.json')), 'No JSON output'
  (args.output / 'timing.json').write_text(json.dumps({'pages': count, 'seconds': elapsed, 'seconds_per_page': elapsed / count, 'scope': 'pipeline prediction only; excludes pipeline initialization', 'layout_device': args.layout_device}, indent=2) + '\n')
  print(f'Parsed {count} page(s) in {elapsed:.3f}s')
  ```

  ```bash
  python parse_document.py --input https://paddle-model-ecology.bj.bcebos.com/paddlex/imgs/demo_image/paddleocr_vl_demo.png --layout-model PP-DocLayoutV2 --layout-device cpu --server-url http://127.0.0.1:8000/v1 --output document-output
  ```

  ### Accuracy and timing methodology

  Use OmniDocBench v1.5 (1355 pages), dataset revision
  `91fe284bbfacfa687959ae3eb00846ca852aa907`, and evaluator commit
  `523fd1d529c3e9d0088c662e983aa70fb9585c9a`. Do not use the newer dataset main.
  Preserve page names, reading order and annotation hashes. Enable Formula CDM only
  after its Node.js, ImageMagick, XeLaTeX and Source Han Sans SC dependencies pass an
  identical-formula identity check; a missing renderer cannot be treated as a zero score.

  `Overall = ((1 - Text Edit Distance) * 100 + Table TEDS * 100 + Formula CDM * 100) / 3`.
  ModelZoo publishes 92.43% Overall and 12.10 seconds per input file on a single
  300I DUO chip, compared with its cited official 92.86% accuracy. These are reference
  values. The prediction-loop timing excludes pipeline initialization, but the source
  leaves warmup, concurrency and input/output limits unspecified. Record PDF versus
  image inputs and those settings before claiming performance equivalence.
  Four-task API sample timing and a nonempty document are separate from full-dataset accuracy.

  ### A2 source-tutorial scenarios

  The source tutorial also documents A2 single-NPU graph serving (BF16,
  `--max-num-batched-tokens 16384`) and a separate Paddle custom-NPU layout pipeline.
  Those configurations are prepared in the bilingual Ascend recipe, but A2 hardware
  was not authorized/available for this task. They remain untested; 310P evidence
  does not validate A2 or all tutorial scenarios. Multi-node PD is not supported by
  this tutorial.

