  - [Model card](https://huggingface.co/CohereLabs/North-Mini-Code-1.0)
  - [FP8 checkpoint](https://huggingface.co/CohereLabs/North-Mini-Code-1.0-fp8)
  - [Release blog post](https://cohere.com/blog/north-mini-code)
