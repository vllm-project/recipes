meta:
  title: "MiMo-V2.6-Flash-RL"
  slug: "mimo-v2-6-flash-rl"
  provider: "MiMo (Xiaomi)"
  description: "Xiaomi's efficiency-balanced omnimodal MoE reasoning model (309B total / 15B active) with hybrid attention, FP8-compute/mxfp4-stored weights, 1M context, and a DFlash speculative decoder"
  date_added: 2026-09-22
  date_updated: 2026-09-23
  difficulty: intermediate
  tasks:
    - text
    - multimodal
  related_recipes:
    - "XiaomiMiMo/MiMo-V2.6-Pro-RL"
    - "XiaomiMiMo/MiMo-V2-Flash"
  hardware:
    h200: verified
    gb300: verified
    mi325x: verified
    mi355x: verified

model:
  model_id: "XiaomiMiMo/MiMo-V2.6-Flash-RL"
  min_vllm_version: "nightly"
  nightly_required: true
  docker_image:
    nvidia: "vllm/vllm-openai:mimo-v26"
    amd: "vllm/vllm-openai-rocm:nightly"
  architecture: moe
  parameter_count: "309B"
  active_parameters: "15B"
  context_length: 1048576
  base_args:
    - "--trust-remote-code"
    - "--max-model-len"
    - "auto"
    - "--generation-config"
    - "vllm"
  base_env: {}

features:
  tool_calling:
    description: "MiMo tool-call parser"
    args:
      - "--tool-call-parser"
      - "mimo"
      - "--enable-auto-tool-choice"
  reasoning:
    description: "MiMo reasoning parser"
    args:
      - "--reasoning-parser"
      - "mimo"
  spec_decoding:
    description: "DFlash 5-layer MTP drafter (predicts 7 tokens); ships in the dflash/ subfolder of the checkpoint"
    args:
      - "--speculative-config"
      - '{"method":"dflash","model":"/root/.cache/huggingface/hub/models--XiaomiMiMo--MiMo-V2.6-Flash-RL/snapshots/<hash>/dflash","num_speculative_tokens":7}'

opt_in_features:
  - spec_decoding

variants:
  default:
    precision: fp8
    vram_minimum_gb: 208
    description: "FP8 (e4m3) compute with mxfp4-stored MoE weights; 173 GB checkpoint — 4x H200 with TP4"
    extra_args:
      - "--tensor-parallel-size"
      - "4"
      - "--gpu-memory-utilization"
      - "0.95"

compatible_strategies:
  - single_node_tp
  - single_node_tep
  - multi_node_tp
  - multi_node_tep
  - multi_node_dep
  - pd_cluster

hardware_overrides:
  amd:
    extra_args:
      - "--kv-cache-dtype"
      - "fp8"
    extra_env:
      VLLM_ROCM_USE_AITER: "1"
      VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: "INT4"
strategy_overrides: {}

guide: |
  ## Overview

  MiMo-V2.6-Flash-RL is the efficiency-balanced checkpoint of Xiaomi's MiMo-V2.6
  series, trained with large-scale mixed RL (GRPO + groupwise agentic grading).
  It is a sparse MoE model with 309B total parameters and 15B active per token:
  48 layers (1 dense + 47 MoE) with 256 routed experts (top-8), hybrid attention
  (sliding-window 128 and global attention), and a 5-layer DFlash-style MTP
  drafter that predicts 7 tokens per pass. The model is natively omnimodal
  (text, image, video, audio via a 681M-param MiMo ViT and audio encoders) and
  supports up to 1M tokens of context.

  Weights are stored as mxfp4 and computed as FP8 (block-wise e4m3, 128x128),
  so the checkpoint is only 173 GB on disk. Loading this mixed storage format
  requires vLLM with the MiMo V2 mxfp4/bf16-router support
  ([vllm-project/vllm#57784](https://github.com/vllm-project/vllm/pull/57784)),
  which is newer than the latest stable release — use the pre-built image or a
  nightly wheel.

  ## Prerequisites

  - Hardware: 4x H200 (TP4), 4x MI355X/MI325X (TP4), or equivalent aggregate VRAM (>= 208 GB)

  ### Pull the vLLM docker image

  Stable vLLM (<= 0.29.0) cannot load the mxfp4-stored weights. Use the
  pre-built image published for the MiMo-V2.6 series:

  ```bash
  docker pull vllm/vllm-openai:mimo-v26
  ```

  A vLLM nightly wheel built after 2026-09-20 also works (`uv pip install -U
  vllm --extra-index-url https://wheels.vllm.ai/nightly/cu130`).

  ## Launch command

  Single-node TP4 (H200):

  ```bash
  vllm serve XiaomiMiMo/MiMo-V2.6-Flash-RL \
    --tensor-parallel-size 4 \
    --trust-remote-code \
    --gpu-memory-utilization 0.95 \
    --max-model-len auto \
    --reasoning-parser mimo \
    --tool-call-parser mimo \
    --enable-auto-tool-choice \
    --generation-config vllm
  ```

  ### AMD (MI355X, MI325X)

  ```bash
  VLLM_ROCM_USE_AITER=1 \
  VLLM_ROCM_QUICK_REDUCE_QUANTIZATION=INT4 \
  vllm serve XiaomiMiMo/MiMo-V2.6-Flash-RL \
    --tensor-parallel-size 4 \
    --trust-remote-code \
    --kv-cache-dtype fp8 \
    --max-model-len auto \
    --reasoning-parser mimo \
    --tool-call-parser mimo \
    --enable-auto-tool-choice \
    --generation-config vllm
  ```

  MI355X also runs TP2 just fine.

  With DFlash speculative decoding (drafter ships inside the checkpoint).
  vLLM does not resolve a `<repo>/dflash` Hub subfolder as the draft model —
  `model` must be a concrete local path to the `dflash/` directory inside the
  downloaded snapshot. Replace `<hash>` with the actual snapshot revision
  (run `hf download XiaomiMiMo/MiMo-V2.6-Flash-RL` first if the checkpoint is
  not cached yet):

  ```bash
  # resolve the on-disk path of the dflash drafter
  DFLASH_DIR=$(ls -d ~/.cache/huggingface/hub/models--XiaomiMiMo--MiMo-V2.6-Flash-RL/snapshots/*/dflash)
  echo "$DFLASH_DIR"
  ```

  ```bash
  vllm serve XiaomiMiMo/MiMo-V2.6-Flash-RL \
    --tensor-parallel-size 4 \
    --trust-remote-code \
    --gpu-memory-utilization 0.95 \
    --max-model-len auto \
    --speculative-config "{\"method\":\"dflash\",\"model\":\"$DFLASH_DIR\",\"num_speculative_tokens\":7}" \
    --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}' \
    --reasoning-parser mimo \
    --tool-call-parser mimo \
    --enable-auto-tool-choice \
    --generation-config vllm
  ```

  The drafter inherits the target's tensor-parallel size by default. To pin it
  explicitly, add `"draft_tensor_parallel_size": 4` to the speculative config
  (useful if you want the draft on fewer GPUs than the target, or to silence
  mis-detection on asymmetric topologies).

  ## Client Usage

  ```bash
  curl -X POST http://localhost:8000/v1/chat/completions \
    -H "Content-Type: application/json" \
    -d '{
      "model": "XiaomiMiMo/MiMo-V2.6-Flash-RL",
      "messages": [{"role": "user", "content": "Hello MiMo!"}],
      "temperature": 1.0,
      "top_p": 0.95,
      "chat_template_kwargs": {"enable_thinking": true}
    }'
  ```

  Recommended sampling: `temperature=1.0`, `top_p=0.95`.
  Set `"enable_thinking": false` (or omit the kwargs) to disable thinking mode.

  ## References

  - [MiMo-V2.6-Flash-RL on Hugging Face](https://huggingface.co/XiaomiMiMo/MiMo-V2.6-Flash-RL)
  - [MiMo-V2.6 technical report](https://huggingface.co/XiaomiMiMo/MiMo-V2.6-Flash-RL/blob/main/MiMo_V2_6_technical_report.pdf)
  - [MiMo-V2.6 blog post](https://mimo.xiaomi.com/mimo-v2-6)
  - [vLLM PR #57784 — mxfp4 MoE / bf16 router / DFlash for MiMo V2](https://github.com/vllm-project/vllm/pull/57784)
  - [SGLang MiMo cookbook](https://docs.sglang.io/cookbook/autoregressive/Xiaomi/MiMo-V2.5)
  - [vLLM ROCm GPU install docs](https://docs.vllm.ai/en/latest/getting_started/installation/gpu/?device=rocm)
