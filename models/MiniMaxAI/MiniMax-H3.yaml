meta:
  title: "MiniMax-H3"
  slug: "minimax-h3"
  provider: "MiniMax"
  description: "Open-weight general-purpose multimodal generation model — jointly generates 24 FPS video with native stereo audio from text, image, video, and audio references, served via vLLM-Omni"
  date_added: 2026-08-02
  date_updated: 2026-08-23
  difficulty: advanced
  tasks:
    - omni
  performance_headline: "8.7 s of 1248×768 video with synchronized stereo audio in ~87 s on 4×B300"
  related_recipes:
    - Wan-AI/Wan2.2-T2V-A14B-Diffusers
    - nvidia/Cosmos3-Super-Image2Video
  hardware:
    gb200: verified
    b300: verified
    dgx_spark_gb10: verified
    rtx_4090_2x: verified
    rtx_pro_5000_4x: verified
    rtx_5090_2x: verified
    rtx_pro_6000_2x: verified
    mi300x: verified
    mi325x: verified
    mi355x: verified

model:
  model_id: "MiniMaxAI/MiniMax-H3"
  min_vllm_version: "0.26.0"
  docker_image:
    nvidia: "vllm/vllm-omni:minimax-h3"
    amd: "vllm/vllm-omni-rocm:minimax-h3"
  # The published H3 images predate the modular pipeline merged in #5720.
  # Docker binds current source read-only and prepends it to PYTHONPATH.
  docker_source:
    mount_path: "/path/to/vllm-omni"
  install:
    docker:
      note: "The H3 images bundle CUDA/ROCm and media dependencies, but predate the merged modular MiniMax-H3 pipeline. Clone current vLLM-Omni main; Docker mounts it read-only and prepends it to PYTHONPATH."
    pip:
      command: |
        uv venv
        source .venv/bin/activate
        uv pip install vllm==0.26.0
      note: "H3 also needs current vLLM-Omni main for the modular FL2VA/Ref2VA pipeline — see the extra install block below."
  architecture: dense
  parameter_count: "64B"
  active_parameters: "64B"
  # Diffusion pipeline — there is no autoregressive KV context. The Qwen3-VL
  # presentation ranges from ~1.8k tokens (text-only) to ~16.3k (two video refs).
  context_length: 0
  # The validated four-GPU best-practice profile uses no offload, Ulysses SP 4,
  # native tiled VAE patch parallelism 4, Ring/TP 1, and the datacenter
  # Blackwell default TRTLLM_ATTN. Keep regional torch.compile enabled.
  base_args:
    - "--trust-remote-code"
    - "--host"
    - "0.0.0.0"
    - "--port"
    - "8000"
    - "--num-gpus"
    - "4"
    - "--usp"
    - "4"
    - "--ring"
    - "1"
    - "--vae-patch-parallel-size"
    - "4"
    - "--vae-parallel-mode"
    - "tile"
    - "--vae-use-tiling"
  base_env:
    VLLM_WORKER_MULTIPROC_METHOD: "spawn"
    VLLM_OMNI_VIDEO_SYNC_TIMEOUT: "1800"

omni:
  port: 8000
  model_id: "/path/to/MiniMax-H3"
  task_label: "Request Mode"
  task_hint: "Select a request preset. A deployment profile may load only the matching task family when the complete service does not fit."

  # Request data is normalized once and rendered against the selected host,
  # port, task, and hardware profile by the shared Omni request builder.
  request_defaults:
    fields:
      fps: 24
      num_inference_steps: 50
      flow_shift: 12
    extra_params:
      duration: 5.0
      audio_flow_shift: 3.0
  request_notes:
    - "Every preset requests a five-second clip at 24 FPS with synchronized stereo audio."
    - "Use /v1/videos/sync for a direct MP4 response; /v1/videos is the asynchronous job endpoint."
    - "FL2VA accepts first, last, or ordered first+last keyframes; Ref2VA accepts image, video, and accompanied audio references."
  evidence_links:
    - label: "BF16 / FP8 video comparison"
      url: "https://lishunyang12.github.io/vllm-omni-rankings/scripts/minimax_h3_global_fp8_vs_bf16/"
    - label: "Online FP8 benchmark artifacts"
      url: "https://github.com/lishunyang12/vllm-omni-rankings/tree/main/scripts/minimax_h3_online_fp8"

  # A profile owns hardware topology, placement, and hardware-shaped request
  # changes. Precision stays in variants; workload semantics stay in tasks.
  profiles:
    b300:
      label: "Resident datacenter"
      reason: "Four high-memory GPUs keep both task partitions resident and avoid host weight transfers."
      constraints:
        - "The hardware selector represents a full host; this latency profile intentionally allocates four GPUs."
        - "Warm the regional compile path before measuring steady-state latency."
    gb200:
      label: "Resident datacenter"
      reason: "Four high-memory GPUs keep both task partitions resident and avoid host weight transfers."
      constraints:
        - "Warm the regional compile path before measuring steady-state latency."
    dgx_spark_gb10:
      label: "Unified-memory FP8"
      reason: "GB10 has one shared CPU/GPU memory pool, so one resident online-FP8 partition is the useful capacity policy."
      vram_minimum_gb: 128
      task_scoped: true
      extra_args:
        - "--num-gpus"
        - "1"
        - "--usp"
        - "1"
        - "--ring"
        - "1"
        - "--vae-patch-parallel-size"
        - "1"
        - "--init-timeout"
        - "3600"
        - "--enforce-eager"
        - "--diffusion-attention-backend"
        - "CUDNN_ATTN"
      extra_env:
        VLLM_OMNI_VIDEO_SYNC_TIMEOUT: "7200"
      request:
        fields:
          width: 1024
          height: 576
          aspect_ratio: "16:9"
        remove_fields: ["short_edge"]
      constraints:
        - "Use the FP8 variant; BF16 does not fit the usable unified-memory budget."
        - "CPU offload and DLO do not create another capacity tier on unified memory."
        - "Restart the service to switch between FL2VA and Ref2VA."
    rtx_pro_5000_4x:
      label: "Resident TP2 × USP2"
      reason: "TP2 shards the DiT while USP2 splits the sequence; encoder TP4 and VAE PP4 balance four 72 GiB cards."
      vram_minimum_gb: 288
      task_scoped: true
      extra_args:
        - "--num-gpus"
        - "4"
        - "--tensor-parallel-size"
        - "2"
        - "--usp"
        - "2"
        - "--ring"
        - "1"
        - "--text-encoder-tp-size"
        - "4"
        - "--vae-patch-parallel-size"
        - "4"
        - "--diffusion-attention-backend"
        - "CUDNN_ATTN"
      constraints:
        - "Use topology-aware CUDA_VISIBLE_DEVICES ordering on dual-socket PCIe hosts."
        - "The published result is a five-step topology screen, not a 50-step throughput claim."
    rtx_pro_6000_2x:
      label: "Resident TP2"
      reason: "Two 96 GiB cards keep one task partition resident with TP2."
      vram_minimum_gb: 192
      task_scoped: true
      extra_args:
        - "--num-gpus"
        - "2"
        - "--tensor-parallel-size"
        - "2"
        - "--usp"
        - "1"
        - "--ring"
        - "1"
        - "--text-encoder-tp-size"
        - "2"
        - "--vae-patch-parallel-size"
        - "2"
      constraints:
        - "Restart the service to switch between FL2VA and Ref2VA."
    rtx_5090_2x:
      label: "Rank-local DLO · 20 layers"
      reason: "TP2 plus rank-local layerwise streaming is the qualified 32 GiB capacity route."
      vram_minimum_gb: 64
      task_scoped: true
      extra_args:
        - "--num-gpus"
        - "2"
        - "--tensor-parallel-size"
        - "2"
        - "--usp"
        - "1"
        - "--ring"
        - "1"
        - "--text-encoder-tp-size"
        - "2"
        - "--vae-patch-parallel-size"
        - "2"
        - "--diffusion-attention-backend"
        - "CUDNN_ATTN"
        - "--enable-distributed-layerwise-offload"
        - "--dlo-no-use-allgather"
        - "--dlo-resident-layers"
        - "20"
        - "--enforce-eager"
      extra_env:
        VLLM_OMNI_VIDEO_SYNC_TIMEOUT: "14400"
      constraints:
        - "Use a 384 GiB-class host and expect PCIe weight transfer during denoising."
        - "Keep --dlo-no-use-allgather with online FP8."
        - "Restart the service to switch between FL2VA and Ref2VA."
    rtx_4090_2x:
      label: "Rank-local DLO · 12 layers"
      reason: "Lower DiT residency preserves activation headroom on two 24 GiB cards."
      vram_minimum_gb: 48
      task_scoped: true
      extra_args:
        - "--num-gpus"
        - "2"
        - "--tensor-parallel-size"
        - "2"
        - "--usp"
        - "1"
        - "--ring"
        - "1"
        - "--text-encoder-tp-size"
        - "2"
        - "--vae-patch-parallel-size"
        - "2"
        - "--diffusion-attention-backend"
        - "CUDNN_ATTN"
        - "--enable-distributed-layerwise-offload"
        - "--dlo-no-use-allgather"
        - "--dlo-resident-layers"
        - "12"
        - "--enforce-eager"
      extra_env:
        VLLM_OMNI_VIDEO_SYNC_TIMEOUT: "14400"
      request:
        fields:
          width: 1024
          height: 576
          aspect_ratio: "16:9"
        remove_fields: ["short_edge"]
      constraints:
        - "Use a 384 GiB-class host and start with the generated 1024×576 request."
        - "Restart the service to switch between FL2VA and Ref2VA."
    mi300x:
      label: "Resident ROCm · AITER"
      reason: "Ulysses4, encoder TP4, AITER attention, and VAE PP4 are the qualified ROCm path."
      constraints:
        - "Keep regional compile enabled, CFG parallel size 1, and native tiled VAE decoding."
    mi325x:
      label: "Resident ROCm · AITER"
      reason: "The resident ROCm profile shares the encoder and VAEs across both task partitions."
      constraints:
        - "Keep regional compile enabled, CFG parallel size 1, and native tiled VAE decoding."
    mi355x:
      label: "Resident ROCm · AITER"
      reason: "The resident ROCm profile shares the encoder and VAEs across both task partitions."
      constraints:
        - "Warm once before measuring; keep CFG parallel size 1 and native tiled VAE decoding."

  # Evidence is workload-scoped, not a blanket status attached to a profile.
  evidence:
    - hardware: b300
      variants: [default]
      tasks: [fl2va_first]
      label: "4×B300 resident BF16"
      scope: "FL2VA · 209 frames · 1248×768 · 50 steps · single-DiT measured operating point"
      metrics:
        - { label: "Client E2E", value: "86.96 s" }
        - { label: "Variation", value: "±0.23 s" }
        - { label: "Placement", value: "U4 · VPP4" }
      note: "This predates the combined root-service merge and is not a combined-service latency guarantee."
    - hardware: b300
      variants: [fp8]
      tasks: [t2va]
      label: "Online global FP8 capacity check"
      scope: "1×B300 resident · T2VA · 5 s · 1344×768 · 50 steps"
      metrics:
        - { label: "Wall time", value: "151.58 s" }
        - { label: "Worker peak", value: "92,146 MiB" }
        - { label: "vs BF16", value: "1.071× / −30.8%" }
      note: "Matched BF16 measured 162.30 s and 133,110 MiB. This is precision evidence, not four-GPU latency."
    - hardware: rtx_pro_5000_4x
      variants: [default]
      tasks: [t2va]
      label: "4×RTX PRO 5000 topology screen"
      scope: "T2VA · 124 frames · 1344×768 · 5 denoising steps"
      metrics:
        - { label: "Client E2E", value: "32.993 s" }
        - { label: "Denoise", value: "27.915 s" }
        - { label: "Peak / GPU", value: "67.6 GiB" }
      note: "The output passed H.264 video and stereo AAC validation."
    - hardware: mi300x
      variants: [default]
      tasks: [t2va]
      label: "4×MI300X resident BF16"
      scope: "T2VA · 209 frames · 1344×768 · 50 steps · one warmup"
      metrics:
        - { label: "Client E2E", value: "267.42 s" }
        - { label: "Denoise", value: "244.04 s" }
        - { label: "Decode", value: "4.15 s" }
      note: "The output passed 209-frame H.264, 24 FPS, and 32 kHz stereo AAC validation."

  # Tasks own model semantics and request data. Hardware-scoped profiles add
  # --task-type from family only when the full two-partition service does not fit.
  tasks:
    - id: t2v
      key: t2va
      family: fl2va
      label: "T2VA - Text"
      endpoint: "/v1/videos/sync"
      description: "Text prompt to joint video and synchronized audio through the FL2VA DiT."
      request:
        fields:
          prompt: "In a snowy blue-purple forest, Ori carefully walks past a sleeping giant; footsteps crunch in the snow while the creature breathes and softly snorts."
          width: 1344
          height: 768
          aspect_ratio: "16:9"
          seed: 1101
        extra_params:
          task: t2va
        output: "t2va.mp4"

    - id: i2v
      key: fl2va_first
      family: fl2va
      label: "FL2VA - First Frame"
      endpoint: "/v1/videos/sync"
      description: "First frame and prompt to video and audio. The output follows the input ratio at a 768 px short edge."
      request:
        setup:
          FIRST_FRAME: "/path/to/fl2va_first_frame.png"
        fields:
          prompt: "A man stands beside a yellow car at night. The car drives away; he follows it with his eyes and begins singing sadly, with synchronized voice and city ambience."
          seed: 2101
        extra_params:
          task: fl2va
        files:
          input_reference:
            path: "${FIRST_FRAME}"
            type: "image/png"
        output: "fl2va_first.mp4"

    - id: i2v
      key: fl2va_last
      family: fl2va
      label: "FL2VA - Last Frame"
      endpoint: "/v1/videos/sync"
      description: "Last frame and prompt to video and audio; frame_indices=[-1] marks the generated endpoint."
      request:
        setup:
          LAST_FRAME: "/path/to/fl2va_last_frame.png"
        fields:
          prompt: "The scene develops naturally toward the supplied final image, with synchronized ambience and sound."
          seed: 2102
        extra_params:
          task: fl2va
          frame_indices: [-1]
        files:
          input_reference:
            path: "${LAST_FRAME}"
            type: "image/png"
        output: "fl2va_last.mp4"

    - id: i2v
      key: fl2va_first_last
      family: fl2va
      label: "FL2VA - First + Last"
      endpoint: "/v1/videos/sync"
      description: "Ordered first and last keyframes plus prompt to video and audio through the FL2VA DiT."
      request:
        setup:
          FIRST_FRAME: "/path/to/fl2va_first_frame.png"
          LAST_FRAME: "/path/to/fl2va_last_frame.png"
        fields:
          prompt: "The subject moves naturally from the first image to the last image, with synchronized ambience and sound."
          seed: 2103
        extra_params:
          task: fl2va
          frame_indices: [0, -1]
        files:
          input_references:
            - { path: "${FIRST_FRAME}", type: "image/png" }
            - { path: "${LAST_FRAME}", type: "image/png" }
        output: "fl2va_first_last.mp4"

    - id: ti2v
      key: ref_image
      family: ref2va
      label: "Ref2VA - Image"
      endpoint: "/v1/videos/sync"
      description: "Reference image and prompt to video and audio through the Ref2VA DiT."
      request:
        setup:
          REF_IMAGE: "/path/to/reference_assets/ref2va_image.png"
        fields:
          prompt: "A white cat sits on a beige couch and slowly looks toward the camera as quiet room ambience continues."
          aspect_ratio: adaptive
          short_edge: 768
          seed: 3100
        extra_params:
          task: ref2va
        files:
          input_reference:
            path: "${REF_IMAGE}"
            type: "image/png"
        output: "ref2va_image.mp4"

    - id: ti2v
      key: ref_image_audio
      family: ref2va
      label: "Ref2VA - Image + Audio"
      endpoint: "/v1/videos/sync"
      description: "Reference image and separate audio plus prompt to video and audio through the Ref2VA DiT."
      request:
        comments:
          - "audio_reference takes an HTTP(S) or data: URL; serve local audio before running this request."
          - "Example: python -m http.server 8092 --bind 127.0.0.1 --directory /path/to/reference_assets"
        setup:
          REF_IMAGE: "/path/to/reference_assets/ref2va_image.png"
          AUDIO_URL: "http://127.0.0.1:8092/ref2va_audio.mp3"
        fields:
          prompt: "A white cat with black mustache and eyebrow markings sits on a beige couch, lip-syncing precisely to the complete reference audio."
          width: 1344
          height: 768
          seed: 3101
          audio_reference:
            value:
              audio_url: "${AUDIO_URL}"
            expand: true
        extra_params:
          task: ref2va
        files:
          input_reference:
            path: "${REF_IMAGE}"
            type: "image/png"
        output: "ref2va_image_audio.mp4"

    - id: ti2v
      key: ref_video_mixed
      family: ref2va
      label: "Ref2VA - Video / Mixed"
      endpoint: "/v1/videos/sync"
      description: "Ordered video or mixed media references plus prompt to video and audio through the Ref2VA DiT."
      request:
        setup:
          SUBJECT_VIDEO: "/path/to/green_screen_subject.mp4"
          BACKGROUND_VIDEO: "/path/to/fairytale_background.mov"
        fields:
          prompt: "Remove the green screen background of Video 1 and replace it with the fairytale environment from Video 2. Match the background motion to the character actions and relight the character to fit the scene."
          width: 1344
          height: 768
          seed: 3102
        extra_params:
          task: ref2va
        files:
          input_references:
            - { path: "${SUBJECT_VIDEO}", type: "video/mp4" }
            - { path: "${BACKGROUND_VIDEO}", type: "video/quicktime" }
        output: "ref2va_video_mixed.mp4"

dependencies:
  # Host-side prerequisite, not a pip install — the weights have to be on disk
  # before the container can bind-mount them, so this one shows under Docker too.
  - note: "Gated checkpoint — request access on the model card, then download it locally. Serve the root directory: both DiTs remain in subdirectories while the modular service shares the encoder and VAEs."
    command: "hf download MiniMaxAI/MiniMax-H3 --local-dir /path/to/MiniMax-H3"
    install_modes: [pip, docker]
  - note: "pip path only: install current vLLM-Omni main for the modular MiniMax-H3 pipeline."
    command: "git clone --depth 1 https://github.com/vllm-project/vllm-omni.git /path/to/vllm-omni && cd /path/to/vllm-omni && uv pip install -e ."
    install_modes: [pip]
  - note: "Optional pip extra for explicitly comparing FA4 on datacenter Blackwell. The generated B300/GB200 route uses the TRTLLM_ATTN default; RTX PRO 5000 and the two-GPU RTX routes use CUDNN_ATTN."
    command: "cd /path/to/vllm-omni && uv pip install -e '.[fa4]'"
    install_modes: [pip]
    brand: NVIDIA
    optional: true
  - note: "Docker path only: clone current vLLM-Omni main to the path mounted by the generated command so it overrides the older package in the image."
    command: "git clone --depth 1 https://github.com/vllm-project/vllm-omni.git /path/to/vllm-omni"
    install_modes: [docker]
  - note: "pip path only: ffmpeg and ffprobe must be on PATH for reference-video preparation and MP4 video+audio muxing. The official Docker images already bundle them."
    command: "sudo apt-get install -y ffmpeg"

features: {}

opt_in_features: []

variants:
  default:
    precision: bf16
    vram_minimum_gb: 202
    supported_hardware:
      - b300
      - gb200
      - rtx_pro_5000_4x
      - rtx_pro_6000_2x
      - rtx_5090_2x
      - rtx_4090_2x
      - mi300x
      - mi325x
      - mi355x
    description: "BF16 accuracy reference. Deployment profiles decide whether the hardware serves both DiTs or one task partition."

  fp8:
    precision: fp8
    label: "FP8 (online)"
    vram_minimum_gb: 202
    supported_hardware:
      - b300
      - gb200
      - dgx_spark_gb10
      - rtx_pro_5000_4x
      - rtx_pro_6000_2x
      - rtx_5090_2x
      - rtx_4090_2x
    description: "Online FP8 for eligible DiT and Qwen3-VL text-decoder linears. Treat it as a capacity option and validate video and audio quality on the selected workload."
    extra_args:
      - "--quantization"
      - "fp8"


# Omni recipes are served through `vllm serve --omni`, which has its own
# diffusion-parallelism flags (--usp / --ring / --vae-patch-parallel-size).
# The serving-strategy row does not apply.
compatible_strategies: []

hardware_overrides:
  blackwell:
    extra_env:
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
  amd:
    extra_args:
      - "--text-encoder-tp-size"
      - "4"
      - "--diffusion-attention-backend"
      - "FLASH_ATTN"
    extra_env:
      VLLM_ROCM_USE_AITER: "1"

strategy_overrides: {}

guide: |
  ## Overview

  MiniMax H3 is a CFG-distilled joint video/audio diffusion model served by
  vLLM-Omni through the OpenAI-compatible `/v1/videos` API. It has two
  task-specific DiT partitions that share the tokenizer, Qwen3-VL text encoder,
  video VAE, and audio VAE:

  | Family | Request task | Inputs |
  |---|---|---|
  | FL2VA | `t2va`, `fl2va` | Text; optional first/last keyframes |
  | Ref2VA | `ref2va` | Image, video, and accompanied audio references |

  The response is an MP4 with H.264 video and synchronized stereo audio.

  ## Use the deployment workspace

  The selectors are independent axes:

  1. **Hardware** chooses a deployment profile: GPU topology, component
     placement, offload policy, and any lower-memory request shape.
  2. **Variant** chooses numerical precision. BF16 is the accuracy reference;
     online FP8 is a capacity option.
  3. **Request Mode** chooses the task family and multipart payload.

  The generated serve command and request are the source of truth for the active
  selection. A memory-constrained profile automatically adds
  `--task-type fl2va` or `--task-type ref2va`; resident high-memory profiles
  serve both families from one process. Restart a task-scoped process to change
  families.

  Evidence is filtered by hardware, precision, and workload. A verified hardware
  profile does not imply that every precision/workload combination has a published
  latency or quality measurement.

  ## Checkpoint and installation

  Request access to the gated checkpoint, then download the complete repository:

  ```bash
  hf download MiniMaxAI/MiniMax-H3 --local-dir /path/to/MiniMax-H3
  ```

  Serve the root directory. It contains sibling `FL2VA` and `Ref2VA`
  directories while shared components are loaded once. A combined BF16 service
  needs roughly 270 GiB of checkpoint storage; a task-scoped service downloads and
  loads only its selected partition.

  The installation block above owns the current pip and Docker setup. `ffmpeg`
  and `ffprobe` must be on `PATH` for reference-video processing and MP4
  output.

  ## Precision and memory policy

  - **BF16** preserves checkpoint precision and is the comparison baseline.
  - **Online FP8** quantizes eligible DiT and Qwen3-VL text-decoder linears at
    load time. The vision tower, embeddings, norms, RoPE, VAEs, and model FP32
    projections retain their original precision.
  - **Distributed layerwise offload (DLO)** is a capacity path for the two-GPU
    RTX profiles. It needs substantial host RAM and streams weights over PCIe;
    the generated profiles retain rank-local shards with
    `--dlo-no-use-allgather`.
  - **DGX Spark / GB10** uses unified memory. CPU offload and DLO do not create a
    second capacity pool, so the profile uses one resident FP8 partition.

  Validate generated video, audio, peak memory, and latency before promoting FP8
  or an unmeasured profile to production.

  ## Request contract

  The presets use `POST /v1/videos/sync` for a direct MP4 response. The
  asynchronous `POST /v1/videos` endpoint accepts the same workload and returns
  a job to poll.

  | Parameter | Recipe default | Meaning |
  |---|---:|---|
  | `fps` | 24 | Fixed H3 output rate |
  | `num_inference_steps` | 50 | Accuracy reference workload |
  | `flow_shift` | 12 | Video sigma shift |
  | `extra_params.audio_flow_shift` | 3 | Audio sigma shift |
  | `extra_params.duration` | 5 s | Preset clip duration |
  | `extra_params.task` | task-specific | Routes to FL2VA or Ref2VA |

  FL2VA first/last-frame presets encode ordering through
  `extra_params.frame_indices`. Ref2VA media fields may repeat; their multipart
  order is preserved. The 24 GiB RTX and GB10 profiles override the starting
  canvas to 1024×576 without duplicating each request.

  ## Operating constraints

  - H3 currently executes one generation request per diffusion batch.
  - `--cfg-parallel-size` must remain 1 because the model is CFG-distilled.
  - VAE patch parallelism uses H3's native `tile` mode.
  - The first request on regional-compile profiles is a warmup; the DLO profiles
    run eager.
  - DLO profiles require a 384 GiB-class host for pinned model shards and
    offload buffers.
  - Measured evidence applies only to its recorded hardware, precision, request
    shape, and task.

  ## Runtime reference

  Model architecture, supported input matrix, API semantics, attention backends,
  caching, and model-specific runtime flags live in the canonical
  [vLLM-Omni MiniMax H3 recipe](https://github.com/vllm-project/vllm-omni/blob/main/recipes/MiniMaxAI/MiniMax-H3.md).
  This recipe owns only selection-aware deployment profiles, generated commands,
  requests, and scoped evidence.

