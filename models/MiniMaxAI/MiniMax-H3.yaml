  vllm serve /path/to/MiniMax-H3/FL2VA \
    --omni \
    --host 0.0.0.0 \
    --port 8000 \
    --trust-remote-code \
    --num-gpus 4 \
    --usp 4 \
    --ring 1 \
    --text-encoder-tp-size 4 \
    --vae-patch-parallel-size 4 \
    --vae-parallel-mode tile \
