meta:
  title: "MiniMax-H3"
  slug: "minimax-h3"
  provider: "MiniMax"
  description: "Open-weight general-purpose multimodal generation model — jointly generates 24 FPS video with native stereo audio from text, image, video, and audio references, served via vLLM-Omni"
  date_added: 2026-08-02
  date_updated: 2026-08-06
  difficulty: advanced
  tasks:
    - omni
  performance_headline: "8.7 s of 1248×768 video with synchronized stereo audio in ~87 s on 4×B300"
  related_recipes:
    - Wan-AI/Wan2.2-T2V-A14B-Diffusers
    - nvidia/Cosmos3-Super-Image2Video
  hardware:
    gb200: verified
    b300: verified
    rtx_4090_2x: verified
    rtx_5090_2x: verified
    rtx_pro_6000_2x: verified 
    mi300x: verified
    mi325x: verified
    mi355x: verified

model:
  model_id: "MiniMaxAI/MiniMax-H3"
  min_vllm_version: "0.26.0"
  docker_image:
    nvidia: "vllm/vllm-omni:minimax-h3"
    amd: "vllm/vllm-omni-rocm:minimax-h3"
  install:
    docker:
      note: "Platform-specific H3 images bundle the model handlers and media dependencies. The refreshed official ROCm tag includes the Ref2VA fixes, TorchCodec, and FFmpeg."
    pip:
      command: |
        uv venv
        source .venv/bin/activate
        uv pip install vllm==0.26.0
      note: "H3 also needs vLLM-Omni built from a checkout carrying the MiniMax H3 handlers — see the extra install block below."
  architecture: dense
  parameter_count: "64B"
  active_parameters: "64B"
  # Diffusion pipeline — there is no autoregressive KV context. The Qwen3-VL
  # presentation ranges from ~1.8k tokens (text-only) to ~16.3k (two video refs).
  context_length: 0
  # The validated four-GPU best-practice profile: no offload, Ulysses SP 4,
  # native tiled VAE patch parallelism 4, Ring/TP left at 1, FlashAttention
  # (CuTe FA4 on Blackwell). Regional torch.compile is the default granularity,
  # so it is deliberately NOT pinned here — do not add --enforce-eager.
  base_args:
    - "--trust-remote-code"
    - "--host"
    - "0.0.0.0"
    - "--port"
    - "8000"
    - "--num-gpus"
    - "4"
    - "--usp"
    - "4"
    - "--ring"
    - "1"
    - "--vae-patch-parallel-size"
    - "4"
    - "--vae-parallel-mode"
    - "tile"
    - "--vae-use-tiling"
    - "--diffusion-attention-backend"
    - "FLASH_ATTN"
  base_env:
    VLLM_WORKER_MULTIPROC_METHOD: "spawn"
    VLLM_OMNI_VIDEO_SYNC_TIMEOUT: "1800"

omni:
  port: 8000
  # One server process loads exactly one checkpoint partition, so the served path
  # swaps with the task: FL2VA serves t2va + fl2va, Ref2VA serves ref2va. H3 is
  # served from the downloaded directory rather than the HF id — substitute your
  # own --local-dir for /path/to/MiniMax-H3.
  tasks:
    - id: t2v
      label: "T2VA · Text → Video+Audio"
      model_id: "/path/to/MiniMax-H3/FL2VA"
      vram_minimum_gb: 135
      endpoint: "/v1/videos/sync"
      description: "Text prompt → joint video + synchronized audio. Served by the FL2VA partition."
      hardware_overrides:
        rtx_pro_6000_2x:
          vram_minimum_gb: 192
        rtx_5090_2x:
          vram_minimum_gb: 64
        rtx_4090_2x:
          vram_minimum_gb: 48
          curl: |
            curl -sS -X POST http://localhost:8000/v1/videos/sync \
              -F 'prompt=In a snowy blue-purple forest, Ori carefully walks past a sleeping giant; footsteps crunch in the snow while the creature breathes and softly snorts.' \
              -F 'width=1024' \
              -F 'height=576' \
              -F 'fps=24' \
              -F 'num_inference_steps=50' \
              -F 'flow_shift=12' \
              -F 'seed=1101' \
              -F 'extra_params={"task":"t2va","duration":5.0,"audio_flow_shift":3.0}' \
              -o t2va.mp4
      curl: |
        curl -sS -X POST http://localhost:8000/v1/videos/sync \
          -F 'prompt=In a snowy blue-purple forest, Ori carefully walks past a sleeping giant; footsteps crunch in the snow while the creature breathes and softly snorts.' \
          -F 'width=1344' \
          -F 'height=768' \
          -F 'fps=24' \
          -F 'num_inference_steps=50' \
          -F 'flow_shift=12' \
          -F 'seed=1101' \
          -F 'extra_params={"task":"t2va","duration":8.7,"audio_flow_shift":3.0}' \
          -o t2va.mp4
    - id: i2v
      label: "FL2VA · First Frame → Video+Audio"
      model_id: "/path/to/MiniMax-H3/FL2VA"
      vram_minimum_gb: 135
      endpoint: "/v1/videos/sync"
      description: "First frame + prompt → video + audio, on the FL2VA partition. Omitting width/height keeps the first frame's aspect ratio at a 768 px short edge."
      hardware_overrides:
        rtx_pro_6000_2x:
          vram_minimum_gb: 192
        rtx_5090_2x:
          vram_minimum_gb: 64
        rtx_4090_2x:
          vram_minimum_gb: 48
          curl: |
            export FIRST_FRAME=/path/to/fl2va_first_frame.png

            curl -sS -X POST http://localhost:8000/v1/videos/sync \
              -F 'prompt=A man stands beside a yellow car at night. The car drives away; he follows it with his eyes and begins singing sadly, with synchronized voice and city ambience.' \
              -F 'width=1024' \
              -F 'height=576' \
              -F 'fps=24' \
              -F 'num_inference_steps=50' \
              -F 'flow_shift=12' \
              -F 'seed=2101' \
              -F 'extra_params={"task":"fl2va","duration":5.0,"audio_flow_shift":3.0}' \
              -F "input_reference=@${FIRST_FRAME};type=image/png" \
              -o fl2va.mp4
      curl: |
        export FIRST_FRAME=/path/to/fl2va_first_frame.png

        curl -sS -X POST http://localhost:8000/v1/videos/sync \
          -F 'prompt=A man stands beside a yellow car at night. The car drives away; he follows it with his eyes and begins singing sadly, with synchronized voice and city ambience.' \
          -F 'fps=24' \
          -F 'num_inference_steps=50' \
          -F 'flow_shift=12' \
          -F 'seed=2101' \
          -F 'extra_params={"task":"fl2va","duration":8.7,"audio_flow_shift":3.0}' \
          -F "input_reference=@${FIRST_FRAME};type=image/png" \
          -o fl2va.mp4
    - id: ti2v
      label: "Ref2VA · Reference → Video+Audio"
      model_id: "/path/to/MiniMax-H3/Ref2VA"
      vram_minimum_gb: 168
      endpoint: "/v1/videos/sync"
      description: "Omni reference (image+audio, or one-or-more videos) → video + audio, on the Ref2VA partition. A full 15 s two-video request peaked at 166 GB on the main rank."
      hardware_overrides:
        rtx_pro_6000_2x:
          vram_minimum_gb: 192
        rtx_5090_2x:
          vram_minimum_gb: 64
        rtx_4090_2x:
          vram_minimum_gb: 48
          curl: |
            # A) image + audio reference. Serve local assets first:
            #    python -m http.server 8092 --bind 127.0.0.1 \
            #      --directory /path/to/reference_assets
            export REF_IMAGE=/path/to/reference_assets/ref2va_image.png
            export AUDIO_URL=http://127.0.0.1:8092/ref2va_audio.mp3

            curl -sS -X POST http://localhost:8000/v1/videos/sync \
              -F 'prompt=A white cat with black mustache and eyebrow markings sits on a beige couch, lip-syncing precisely to the complete reference audio before shifting from confusion to deadpan speechlessness.' \
              -F 'width=1024' \
              -F 'height=576' \
              -F 'fps=24' \
              -F 'num_inference_steps=50' \
              -F 'flow_shift=12' \
              -F 'seed=3101' \
              -F 'extra_params={"task":"ref2va","duration":5.0,"audio_flow_shift":3.0}' \
              -F "input_reference=@${REF_IMAGE};type=image/png" \
              -F "audio_reference={\"audio_url\":\"${AUDIO_URL}\"}" \
              -o ref2va_image_audio.mp4

            # B) two video references. Repeat input_references in source order.
            export SUBJECT_VIDEO=/path/to/green_screen_subject.mp4
            export BACKGROUND_VIDEO=/path/to/fairytale_background.mov

            curl -sS -X POST http://localhost:8000/v1/videos/sync \
              -F 'prompt=Remove the green screen background of Video 1 and replace it with the fairytale environment from Video 2. Match the background motion to the character actions and relight the character to fit the scene.' \
              -F 'width=1024' \
              -F 'height=576' \
              -F 'fps=24' \
              -F 'num_inference_steps=50' \
              -F 'flow_shift=12' \
              -F 'seed=3101' \
              -F 'extra_params={"task":"ref2va","duration":5.0,"audio_flow_shift":3.0}' \
              -F "input_references=@${SUBJECT_VIDEO};type=video/mp4" \
              -F "input_references=@${BACKGROUND_VIDEO};type=video/quicktime" \
              -o ref2va_video_video.mp4
      curl: |
        # A) image + audio reference. `audio_reference` takes an HTTP(S) or data: URL —
        #    serve local assets first:  python -m http.server 8092 --bind 127.0.0.1 \
        #                                --directory /path/to/reference_assets
        export REF_IMAGE=/path/to/reference_assets/ref2va_image.png
        export AUDIO_URL=http://127.0.0.1:8092/ref2va_audio.mp3

        curl -sS -X POST http://localhost:8000/v1/videos/sync \
          -F 'prompt=A white cat with black mustache and eyebrow markings sits on a beige couch, lip-syncing precisely to the complete reference audio before shifting from confusion to deadpan speechlessness.' \
          -F 'width=1344' \
          -F 'height=768' \
          -F 'fps=24' \
          -F 'num_inference_steps=50' \
          -F 'flow_shift=12' \
          -F 'seed=3101' \
          -F 'extra_params={"task":"ref2va","duration":15.0,"audio_flow_shift":3.0}' \
          -F "input_reference=@${REF_IMAGE};type=image/png" \
          -F "audio_reference={\"audio_url\":\"${AUDIO_URL}\"}" \
          -o ref2va_image_audio.mp4

        # B) two video references — repeat `input_references` once per source video.
        #    H3 consumes them in form order and keeps their original soundtracks.
        export SUBJECT_VIDEO=/path/to/green_screen_subject.mp4
        export BACKGROUND_VIDEO=/path/to/fairytale_background.mov

        curl -sS -X POST http://localhost:8000/v1/videos/sync \
          -F 'prompt=Remove the green screen background of Video 1 and replace it with the fairytale environment from Video 2. Match the background motion to the character actions and relight the character to fit the scene.' \
          -F 'width=1344' \
          -F 'height=768' \
          -F 'fps=24' \
          -F 'num_inference_steps=50' \
          -F 'flow_shift=12' \
          -F 'seed=3101' \
          -F 'extra_params={"task":"ref2va","duration":15.0,"audio_flow_shift":3.0}' \
          -F "input_references=@${SUBJECT_VIDEO};type=video/mp4" \
          -F "input_references=@${BACKGROUND_VIDEO};type=video/quicktime" \
          -o ref2va_video_video.mp4

dependencies:
  # Host-side prerequisite, not a pip install — the weights have to be on disk
  # before the container can bind-mount them, so this one shows under Docker too.
  - note: "Gated checkpoint — request access on the model card, then download it locally. H3 is served from a local path, not the HF id: both partitions (FL2VA and Ref2VA) land as subdirectories and one server loads one of them"
    command: "hf download MiniMaxAI/MiniMax-H3 --local-dir /path/to/MiniMax-H3"
    install_modes: [pip, docker]
  - note: "pip path only (the Docker image already bundles it): MiniMax H3 support ships in vLLM-Omni, not the vllm wheel, so install it from a checkout. The [fa4] extra pulls the CuTe-DSL FlashAttention-4 kernels used on Blackwell"
    command: "git clone https://github.com/vllm-project/vllm-omni.git && cd vllm-omni && uv pip install -e '.[fa4]'"
  - note: "pip path only: ffmpeg and ffprobe must be on PATH for reference-video preparation and MP4 video+audio muxing. The official Docker images already bundle them."
    command: "sudo apt-get install -y ffmpeg"

features: {}

opt_in_features: []

