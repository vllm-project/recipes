meta:
  title: "Qwen3.5-4B"
  slug: "qwen3.5-4b"
  provider: "Qwen"
  description: "Qwen3.5 compact dense multimodal model (4B) — fits on 16 GB consumer GPUs with full 262K context or one Xeon 6 NUMA node or Intel Arc Pro B60/B70"
  date_added: 2026-04-22
  date_updated: 2026-09-14
  difficulty: beginner
  tasks:
    - multimodal
    - text
  performance_headline: "Consumer-GPU-friendly Qwen3.5 dense with MTP support"
  related_recipes:
    - "Qwen/Qwen3.5-9B"
    - "Qwen/Qwen3.5-2B"
  hardware:
    xeon6: verified
    arc_pro_b60: verified
    arc_pro_b70: verified
    # Official vllm-ascend tutorial: Qwen3.5-Dense (2B/4B/9B) on Atlas 300I DUO
    # and Atlas 200I Pro from vllm-ascend v0.23.0rc1 (FP16, TP=1/TP=2, MTP k=1).
    atlas_300i_duo: verified
    atlas_200i_pro: verified

model:
  model_id: "Qwen/Qwen3.5-4B"
  min_vllm_version: "0.17.0"
  default_frontend: rust
  architecture: dense
  parameter_count: "4B"
  active_parameters: "4B"
  context_length: 262144
  base_args:
    - "--trust-remote-code"
  base_env: {}

features:
  tool_calling:
    description: "Enable automatic tool choice with Qwen3 Coder parser"
    args:
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "qwen3_coder"
  reasoning:
    description: "Enable chain-of-thought reasoning with Qwen3 parser"
    args:
      - "--reasoning-parser"
      - "qwen3"
  spec_decoding:
    description: "Multi-token prediction speculative decoding for lower latency"
    args:
      - "--speculative-config"
      - '{"method":"mtp","num_speculative_tokens":1}'
  text_only:
    description: "Skip loading the vision encoder for text-only workloads."
    args:
      - "--language-model-only"
  long_context:
    description: "YaRN RoPE scaling past the native 262,144-token window to ~1,010,000 tokens. Static YaRN holds the scaling factor constant regardless of input length, so leave this off unless you actually serve long prompts; for ~524K, halve the factor to 2.0."
    args:
      - "--hf-overrides"
      - '{"text_config": {"rope_parameters": {"mrope_interleaved": true, "mrope_section": [11, 11, 10], "rope_type": "yarn", "rope_theta": 10000000, "partial_rotary_factor": 0.25, "factor": 4.0, "original_max_position_embeddings": 262144}}}'
      - "--max-model-len"
      - "1010000"
    env:
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"

opt_in_features:
  - spec_decoding
  - text_only
  - long_context

variants:
  default:
    precision: bf16
    vram_minimum_gb: 10
    description: "Full precision BF16 — fits on a single 16 GB GPU or one Xeon 6 NUMA node or one Intel Arc Pro B60/B70"
    supported_hardware: [xeon6, arc_pro_b60, arc_pro_b70]

  fp8:
    model_id: "RedHatAI/Qwen3.5-4B-FP8-dynamic"
    precision: fp8
    vram_minimum_gb: 5
    description: "RedHatAI FP8 (E4M3) with dynamic per-token activation quantization"
    supported_hardware: [arc_pro_b60, arc_pro_b70]
    extra_args:
      - "--kv-cache-dtype"
      - "fp8"

  fp16_310p:
    precision: bf16
    label: "FP16 (310P)"
    vram_minimum_gb: 10
    description: "Atlas 300I DUO / Atlas 200I Pro (Ascend 310P) serving cast to FP16 — follows the official vllm-ascend Qwen3.5-Dense tutorial"
    supported_hardware: [atlas_300i_duo, atlas_200i_pro]
    min_vllm_version: "0.23.0rc1"
    tp: { atlas_300i_duo: 1, atlas_200i_pro: 1 }
    hardware_overrides:
      atlas_300i_duo:
        docker_image: "quay.io/ascend/vllm-ascend:v0.23.0rc1-310p"
        install: { pip: false }
      atlas_200i_pro:
        docker_image: "quay.io/ascend/vllm-ascend:v0.23.0rc1-310p"
        install: { pip: false }
    extra_args:
      - "--dtype"
      - "float16"
      - "--mamba-ssm-cache-dtype"
      - "float16"
      - "--speculative-config"
      - '{"method": "qwen3_5_mtp", "num_speculative_tokens": 1}'
      - "--compilation-config"
      - '{"cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_capture_sizes": [2, 16]}'
      - "--additional-config"
      - '{"ascend_compilation_config": {"enable_npugraph_ex": false}}'
    extra_env:
      VLLM_USE_MODELSCOPE: "True"

compatible_strategies:
  - single_node_tp

hardware_overrides:
  xpu:
    extra_args:
      - "--enforce-eager"

strategy_overrides: {}

hardware_notes:
  atlas_300i_duo:
    title: "vLLM Ascend 310P image required"
    body: "Single-node serving on Atlas 300I DUO with TP=1 or TP=2 (choose per available devices). Pin quay.io/ascend/vllm-ascend:v0.23.0rc1-310p — the NVIDIA pip wheel cannot run here. The 310P execution path supports FP16 only: --dtype float16 and --mamba-ssm-cache-dtype float16 are required, MTP uses the qwen3_5_mtp head with num_speculative_tokens 1, and enable_npugraph_ex must be disabled. Set --max-model-len / --max-num-seqs / --gpu-memory-utilization conservatively (tutorial baseline: 16384 / 32 / 0.9) — too high may cause OOM."
    link:
      label: "Qwen3.5-Dense tutorial"
      href: "https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/Qwen3.5-Dense.html"
  atlas_200i_pro:
    title: "vLLM Ascend 310P image required"
    body: "Single-node serving on one Atlas 200I Pro NPU with TP=1. Pin quay.io/ascend/vllm-ascend:v0.23.0rc1-310p (Ubuntu 24.04; on openEuler 24.03 use the matching v0.23.0rc1-310p-openeuler image). The 310P execution path supports FP16 only: --dtype float16 and --mamba-ssm-cache-dtype float16 are required, MTP uses the qwen3_5_mtp head with num_speculative_tokens 1, and enable_npugraph_ex must be disabled."
    link:
      label: "Qwen3.5-Dense tutorial"
      href: "https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/Qwen3.5-Dense.html"

guide: |
  ## Overview

  [Qwen3.5-4B](https://huggingface.co/Qwen/Qwen3.5-4B) is the compact dense
  entry in the Qwen3.5 family — same gated delta networks architecture, vision
  encoder, 262K context, and MTP decoding as the larger siblings, sized for
  16 GB consumer GPUs.

  ## Prerequisites

  - **vLLM version:** >= 0.17.0
  - **Hardware:** single 16 GB GPU (RTX 4080 / L4 / A10 / T4-24GB) or one Xeon 6 NUMA node or one Intel Arc Pro B60/B70; Atlas 300I DUO / Atlas 200I Pro via vLLM Ascend (FP16)

  ### Install vLLM

  ```bash
  uv venv
  source .venv/bin/activate
  uv pip install -U vllm --torch-backend=auto
  ```

  ### pip (Intel Xeon 6 CPUs)
  For Intel and AMD x86 CPUs, follow the [CPU pre-built wheels](https://docs.vllm.ai/en/latest/getting_started/installation/cpu/#pre-built-wheels) installation instructions.

  ### Docker 
  ```bash
  docker pull vllm/vllm-openai-xpu:latest  # Intel XPU (B60 / B70)
  ```

  ## Launching the Server

  ```bash
  vllm serve Qwen/Qwen3.5-4B \
    --max-model-len 262144 \
    --reasoning-parser qwen3
  ```

  ### Intel Xeon 6 Deployment via Docker

  Launch the x86 CPU vLLM Docker container for `Qwen/Qwen3.5-4B`:

  ```bash
  docker run \
    --privileged --ipc=host -p 8000:8000 \
    -v ~/.cache/huggingface:/root/.cache/huggingface \
    vllm/vllm-openai-cpu:latest-x86_64 Qwen/Qwen3.5-4B \
    --trust-remote-code \
    --tensor-parallel-size 1 \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser qwen3
  ```

  ### Docker (Intel XPU B60 / B70)

  Validated on 1× Intel Arc Pro B60 / B70 (B60 24 GB, B70 32 GB per card) with the
  official vLLM XPU image `vllm/vllm-openai-xpu:latest`.

  ```bash
  docker run --device /dev/dri \
    -v /dev/dri/by-path:/dev/dri/by-path --shm-size=16g \
    --privileged --ipc=host -p 8000:8000 \
    -v ~/.cache/huggingface:/root/.cache/huggingface \
    vllm/vllm-openai-xpu:latest \
    Qwen/Qwen3.5-4B \
    --reasoning-parser qwen3 \
    --enforce-eager
  ```


  ### MTP speculative decoding

  ```bash
  vllm serve Qwen/Qwen3.5-4B \
    --speculative-config '{"method": "mtp", "num_speculative_tokens": 1}' \
    --reasoning-parser qwen3
  ```

  ## Client Usage

  ```python
  from openai import OpenAI

  client = OpenAI(api_key="EMPTY", base_url="http://localhost:8000/v1")
  resp = client.chat.completions.create(
      model="Qwen/Qwen3.5-4B",
      messages=[{"role": "user", "content": "Hello!"}],
      max_tokens=128,
  )
  print(resp.choices[0].message.content)
  ```

  ## Troubleshooting

  - **CUDA graph / Mamba cache size error:** reduce `--max-cudagraph-capture-size`.
  - **Disable reasoning:** add `--default-chat-template-kwargs '{"enable_thinking": false}'`.

  ## References

  - [Model card](https://huggingface.co/Qwen/Qwen3.5-4B)
  - [Base checkpoint](https://huggingface.co/Qwen/Qwen3.5-4B-Base)
