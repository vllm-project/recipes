guide: |
  ## Overview

  Qwen1.5-0.5B-Chat is Qwen's compact chat model with 32K context. This recipe
  groups the canonical BF16 parent checkpoint with the official GPTQ INT4
  checkpoint validated on Intel Xeon 6.

  The recipe retains model-level requirements while leaving runtime tuning,
  TP/DP, and host-specific CPU placement as deployment choices.

  ## Prerequisites

  - Hardware: 1x Xeon6/Xeon5 NUMA node
  - vLLM >= 0.8.5

  ### pip (Intel Xeon 6 CPUs)

  For Intel and AMD x86 CPUs, follow the
  [CPU pre-built wheels](https://docs.vllm.ai/en/latest/getting_started/installation/cpu/#pre-built-wheels)
  installation instructions.

  ### Docker (Intel Xeon 6 CPUs)

  ```bash
  docker pull vllm/vllm-openai-cpu:latest-x86_64
  ```

  ## Intel Xeon 6

  ```bash
  vllm serve Qwen/Qwen1.5-0.5B-Chat-GPTQ-Int4 \
    --quantization gptq
  ```

  Docker:

  ```bash
  docker run -itd --name qwen15-05b-chat-cpu \
    --network host \
    --shm-size 16g \
    -v ~/.cache/huggingface:/root/.cache/huggingface \
    vllm/vllm-openai-cpu:latest-x86_64 \
      --model Qwen/Qwen1.5-0.5B-Chat-GPTQ-Int4 \
      --quantization gptq \
      --host 0.0.0.0 \
      --port 8000
  ```

  ## Configuration Notes

  - The validation TP/DP layout is benchmark topology and is not hard-coded.
  - `--max-num-seqs=256` and `--no-enable-prefix-caching` are benchmark controls and are not promoted.
  - Qwen1.5 uses native Qwen2 architecture support, so `--trust-remote-code` is not required by this recipe.

  ## Runtime and Platform Tuning

  The following settings are intentionally not prescribed as portable CPU model
  defaults because they depend on the workload, hardware, or runtime environment:

  - `--max-num-batched-tokens`: scheduler/throughput tuning.
  - `--max-num-seqs`: concurrency and scheduler-capacity tuning.
  - `--gpu-memory-utilization`: platform memory-budget tuning.
  - `--no-enable-prefix-caching`: workload/benchmark cache-policy tuning.
  - `VLLM_ENGINE_ITERATION_TIMEOUT_S`: operational runtime timeout.

  These settings may still appear in validated hardware-specific overrides. Tune
  them at deployment time based on platform resources, workload shape, and
  latency/throughput goals.

  ## References

  - [Parent model](https://huggingface.co/Qwen/Qwen1.5-0.5B-Chat)
  - [GPTQ INT4 variant](https://huggingface.co/Qwen/Qwen1.5-0.5B-Chat-GPTQ-Int4)
  - [vLLM CPU installation](https://docs.vllm.ai/en/latest/getting_started/installation/cpu/)
