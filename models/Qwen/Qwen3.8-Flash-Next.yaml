      - "fp8"

strategy_hardware:
  single_node_tp:
    dgx_spark_gb10_64gb: unsupported
  single_node_tep:
    dgx_spark_gb10: unsupported
    dgx_spark_gb10_64gb: unsupported
  single_node_dep:
    dgx_spark_gb10: unsupported
    dgx_spark_gb10_64gb: unsupported

strategy_overrides:
  single_node_tp:
    tp: 4
    hardware_overrides:
      dgx_spark_gb10:
        extra_env:
          VLLM_PLE_TABLE_MEMORY: "disk"
          VLLM_B12X_MOE_FP4_LAYER_MAX_INPUT_SCALE: "w13"
      dgx_spark_gb10_64gb: unsupported
  single_node_dep:
    extra_env:
      VLLM_PLE_CPU_OFFLOAD: "1"
  multi_node_tp:
    hardware_overrides:
      dgx_spark_gb10:
        extra_env:
          MN_IF_NAME: "$IFACE_NAME"
          UCX_NET_DEVICES: "$IFACE_NAME"
