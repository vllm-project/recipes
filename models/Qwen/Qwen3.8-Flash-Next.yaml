meta:
  title: "Qwen3.8-Flash-Next"
  slug: "qwen3.8-flash-next"
  provider: "Qwen"
  description: "Qwen4 architecture preview with a 125B-parameter main model, supplemented by an additional 51B N-gram embeddings, with 6B parameters activated per token."
  date_updated: 2026-08-28
  difficulty: advanced
  tasks:
    - multimodal
    - text
  performance_headline: "Qwen4 architecture preview with 6B active parameters and efficient 262K context"
  related_recipes:
    - "Qwen/Qwen3-Next-80B-A3B-Instruct"
  hardware:
    h200: verified
    gb200: verified
    gb300: verified
    mi355x: verified
    rtx_pro_6000_4x: verified
    # rtx_5090_4x is the RadixArk NVFP4 checkpoint (FP8 N-gram table) at TEP4
    # with PLE CPU offload; see the RTX 5090 guide section for the sm120 knobs.
    rtx_5090_4x: verified
    dgx_station_gb300: verified

model:
  model_id: "Qwen/Qwen3.8-Flash-Next"
  min_vllm_version: "0.29.0"
  docker_image:
    nvidia: "vllm/vllm-openai:qwen38-flash-next"
    amd: "vllm/vllm-openai-rocm:qwen38-flash-next"
  nightly_required: true
  install:
    docker:
      note: "Use the dedicated Qwen3.8 Flash-Next image; PyPI installation is not supported for this recipe."
    pip: false
  architecture: moe
  parameter_count: "176B"
  active_parameters: "6B"
  context_length: 262144
  base_args:
    - "--max-num-seqs"
    - "256"
    - "--gpu-memory-utilization"
    - "0.90"
    - "--enable-prefix-caching"
    - "--no-enable-flashinfer-autotune"
  base_env: {}

dependencies: []

features:
  tool_calling:
    description: "Enable automatic tool choice with the Qwen3 XML parser"
    args:
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "qwen3_xml"
  reasoning:
    description: "Extract thinking output with the Qwen3 reasoning parser"
    args:
      - "--reasoning-parser"
      - "qwen3"
  spec_decoding:
    description: "Use the checkpoint's Multi-Token Prediction module for faster decoding"
    args:
      - "--speculative-config"
      - '{"method":"mtp","num_speculative_tokens":3}'
  text_only:
    description: "Skip the vision encoder for text-only workloads and leave more memory for KV cache"
    args:
      - "--language-model-only"

opt_in_features:
  - spec_decoding
  - text_only

variants:
  default:
    model_id: "Inferact/Qwen3.8-Flash-Next-NVFP4"
    precision: nvfp4
    vram_minimum_gb: 130
    description: "Inferact quantized NVFP4 weights with per-layer embeddings in nvfp4 too"
    hardware_overrides:
      dgx_station_gb300:
        extra_args:
          - "--max-num-seqs"
          - "32"
          - "--gpu-memory-utilization"
          - "0.95"
          - "--max-num-batched-tokens"
          - "8192"
          - "--enable-prefix-caching"
          - "--distributed-executor-backend"
          - "mp"
          - "-cc.mode"
          - "none"
          - "-cc.cudagraph_mode"
          - "full_decode_only"
      rtx_pro_6000_4x:
        extra_args:
          - "--max-num-seqs"
          - "16"
          - "--gpu-memory-utilization"
          - "0.95"
          - "--max-num-batched-tokens"
          - "8192"
          - "--enable-prefix-caching"
          - "--moe-backend"
          - "marlin"
  nvfp4_fp8_ple:
    model_id: "RadixArk/Qwen3.8-Flash-Next-NVFP4"
    precision: nvfp4
    vram_minimum_gb: 120
    description: "NVFP4 weights with the N-gram table stored as FP8 + per-tensor scale — halves the host RAM needed for PLE CPU offload (~51 GB instead of ~102 GB)"
    hardware_overrides:
      rtx_5090_4x:
        extra_args:
          - "--quantization"
          - "modelopt"
          - "--enable-expert-parallel"
          - "--disable-custom-all-reduce"
          - "--enable-prefix-caching"
          - "--compilation-config"
          - '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[4,8,12,16,24,32]}'
        extra_env:
          VLLM_PLE_CPU_OFFLOAD: "1"
          VLLM_PLE_FORCE_FP8: "1"
          VLLM_USE_DEEP_GEMM: "0"
          VLLM_MOE_USE_DEEP_GEMM: "0"
  fp8:
    model_id: "Qwen/Qwen3.8-Flash-Next-FP8"
    precision: fp8
    vram_minimum_gb: 250
    description: "Official dynamic FP8 checkpoint with blockwise weight quantization"
    hardware_overrides:
      dgx_station_gb300:
        extra_args:
          - "--max-num-seqs"
          - "32"
          - "--gpu-memory-utilization"
          - "0.95"
          - "--max-num-batched-tokens"
          - "8192"
          - "--enable-prefix-caching"
          - "--distributed-executor-backend"
          - "mp"
          - "-cc.mode"
          - "none"
          - "-cc.cudagraph_mode"
          - "full_decode_only"
      rtx_pro_6000_4x:
        extra_args:
          - "--max-num-seqs"
          - "16"
          - "--gpu-memory-utilization"
          - "0.95"
          - "--max-num-batched-tokens"
          - "8192"
          - "--enable-prefix-caching"
  bf16:
    model_id: "Qwen/Qwen3.8-Flash-Next"
    precision: bf16
    vram_minimum_gb: 423
    description: "Official BF16 checkpoint"

compatible_strategies:
  - single_node_tp
  - single_node_tep
  - single_node_dep

hardware_overrides:
  hopper:
    extra_args:
      - "--moe-backend"
      - "triton"
      - "--gpu-memory-utilization"
      - "0.85"
    extra_env: {}
strategy_overrides:
  single_node_tp:
    tp: 4
  single_node_dep:
    extra_env:
      VLLM_PLE_CPU_OFFLOAD: "1"

guide: |
  ## Overview

  [Qwen3.8-Flash-Next](https://huggingface.co/Qwen/Qwen3.8-Flash-Next) is a
  multimodal, ultra-sparse Mixture-of-Experts model. It has 125B parameters, 
  including an additional 51B N-gram embedding table, while activating 6B 
  parameters per token.

  The architecture combines four main ideas:

  - **GDN + QSA:** three of every four layers use Gated DeltaNet to compress history;
    the fourth uses Qwen Sparse Attention for precise long-range retrieval.
  - **Gated Residual:** four residual branches dynamically control cross-layer reads
    and writes.
  - **N-gram Embedding:** a 51B lookup memory adds capacity with little per-token
    compute and can be asynchronously offloaded to host memory. (note that offload
    currently only runs on Nvidia devices)
  - **MTP:** the built-in Multi-Token Prediction module supports speculative decoding.

  The checkpoint natively supports 262,144 tokens. Qwen reports that QSA reaches up
  to 10.2x prefill and 6.6x decode attention-kernel speedups at one million tokens.
  On GB300, TP2 is the minimum validated FP8 deployment and TP4 is the recommended
  full-tray configuration. On an 8x H200 node, use TEP8 for the official FP8
  checkpoint; plain TP8 is incompatible with its 128-wide quantization blocks.

  ## Prerequisites

  - **Runtime:** use `vllm/vllm-openai:qwen38-flash-next`. PyPI installation is
    not supported for this recipe.
  - **Hardware:** NVIDIA CUDA and AMD ROCm instructions are provided below.
  - **FP8 memory:** the checkpoint is 172.78 GiB. TP2 is the validated minimum on
    GB300; TP4 is the recommended full-tray configuration.
  - **BF16 memory:** the checkpoint is 335.28 GiB. The validated TP2 configuration
    used about 190 GiB per GB300 GPU.
  - **Host memory for N-gram Embedding offload:** at least 51 GB plus
    runtime headroom.

  The Install block above generates the pull and Docker launch flow for the dedicated
  image.

  ## Serving

  ### Recommended FP8 configuration on 4x GB300

  Use the official
  [`Qwen/Qwen3.8-Flash-Next-FP8`](https://huggingface.co/Qwen/Qwen3.8-Flash-Next-FP8)
  checkpoint tested by this recipe.

  ```bash
  vllm serve Qwen/Qwen3.8-Flash-Next-FP8 \
    --tensor-parallel-size 4 \
    --gpu-memory-utilization 0.90 \
    --max-num-seqs 256 \
    --enable-prefix-caching \
    --no-enable-flashinfer-autotune \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_xml \
    --reasoning-parser qwen3
  ```

  TP2 is the minimum FP8 deployment on GB300. TP4 and TEP4 are validated
  full-tray configurations, including with MTP3. Enable expert parallelism with
  `--enable-expert-parallel` to improve throughput.

  To serve BF16, use the `Qwen/Qwen3.8-Flash-Next` checkpoint with the same
  arguments.

  ### Recommended FP8 configuration on 8x H200

  Use TEP8 with the Triton MoE backend on Hopper:

  ```bash
  vllm serve Qwen/Qwen3.8-Flash-Next-FP8 \
    --tensor-parallel-size 8 \
    --enable-expert-parallel \
    --moe-backend triton \
    --gpu-memory-utilization 0.85 \
    --max-num-seqs 256 \
    --enable-prefix-caching \
    --no-enable-flashinfer-autotune \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_xml \
    --reasoning-parser qwen3
  ```

  Plain TP8 is incompatible with the FP8 checkpoint; use TEP8.

  ### FP8 configuration on a 4x MI355X GPU
  ```bash
  export VLLM_ROCM_USE_AITER=1
  export VLLM_ROCM_USE_AITER_MOE=0

  vllm serve Qwen/Qwen3.8-Flash-Next-FP8 \
  --tensor-parallel-size 4 \
  --max-model-len auto \
  --gpu-memory-utilization 0.9
  ```

  ### NVFP4 on 4x RTX 5090 (consumer Blackwell, sm120)

  Verified on 4x RTX 5090 32 GB (PCIe, sm120) with the
  [`RadixArk/Qwen3.8-Flash-Next-NVFP4`](https://huggingface.co/RadixArk/Qwen3.8-Flash-Next-NVFP4)
  checkpoint, which stores the 51B N-gram table as FP8 with a per-tensor scale.
  On a 128 GB host that is the difference between fitting and not fitting: the
  FP8 table needs ~51 GB of host RAM under PLE CPU offload, where a BF16-table
  NVFP4 checkpoint needs ~102 GB plus load transients.

  ```bash
  docker run --gpus all --cap-add=SYS_PTRACE --ipc=host -p 8000:8000 \
    -e VLLM_PLE_CPU_OFFLOAD=1 \
    -e VLLM_PLE_FORCE_FP8=1 \
    -e VLLM_USE_DEEP_GEMM=0 -e VLLM_MOE_USE_DEEP_GEMM=0 \
    -e PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \
    vllm/vllm-openai:qwen38-flash-next \
    --model RadixArk/Qwen3.8-Flash-Next-NVFP4 \
    --quantization modelopt \
    --tensor-parallel-size 4 \
    --enable-expert-parallel \
    --disable-custom-all-reduce \
    --max-model-len 262144 \
    --enable-prefix-caching \
    --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[4,8,12,16,24,32]}' \
    --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
    --enable-auto-tool-choice --tool-call-parser qwen3_xml \
    --reasoning-parser qwen3
  ```

  Every knob is load-bearing on this hardware:

  - **`--enable-expert-parallel`**: the NVFP4 checkpoint's
    `moe_intermediate_size` of 640 is not divisible by the 64-wide quantization
    groups after TP4 sharding (640/4 = 160). Expert parallelism keeps experts
    whole per rank. (`--moe-backend marlin` is the alternative route the
    RTX PRO 6000 profile uses.)
  - **`--disable-custom-all-reduce`**: without it, CUDA graph capture dies at
    engine init with `custom_all_reduce.cuh:164 'invalid argument'` on
    multi-GPU consumer Blackwell.
  - **`VLLM_USE_DEEP_GEMM=0` / `VLLM_MOE_USE_DEEP_GEMM=0`**: DeepGEMM's
    capability gate accepts the whole sm12x family, then its blockwise-FP8
    kernels fail on consumer parts (`Unknown SF transformation`, or an
    `unspecified launch failure` inside `profile_run` surfaced only as
    `Engine core initialization failed`). See vllm#51884 and vllm#54125.
  - **`VLLM_PLE_CPU_OFFLOAD=1`**: 32 GB cards cannot hold the N-gram table;
    it lives in host RAM and rows are prefetched asynchronously.
  - **`--cap-add=SYS_PTRACE`**: the PLE offload handoff uses `pidfd_getfd`,
    which Docker's default seccomp profile blocks.
  - **`VLLM_PLE_FORCE_FP8=1`**: the PLE embedding quant gate only selects the
    FP8 path for `Fp8Config` checkpoints, so under this ModelOpt NVFP4 config
    the FP8 table shards otherwise have no loadable parameter and startup fails
    with `no module/parameter named 'ngram_embedding.weight_scale'`. This
    escape hatch is part of the pending PLE-offload work (see the discussion on
    vllm PR #53896); until it lands in the image, the small `ple_layer.py`
    patch from that discussion must be applied.
  - **`cudagraph_mode FULL_DECODE_ONLY`**: launch-day eager mode decodes at
    ~40 tok/s; full decode graphs are the difference to ~200 tok/s.

  Measured (MTP `num_speculative_tokens: 3`, greedy, single stream unless
  noted):

  | | |
  |---|---|
  | GPU KV cache | 389,084 tokens (1.48x at 262,144 per request) |
  | decode, short context | 169 tok/s (code prompts: 203 tok/s, acceptance 0.90) |
  | decode at 99K / 156K context | 188 / 200 tok/s — no depth decay |
  | prefill at 99K / 156K | 2,690 / 2,551 tok/s (TTFT 37 s / 61 s) |
  | 4 concurrent streams | 340 tok/s aggregate, 87-110 tok/s per stream |
  | host RAM for PLE | ~51 GB (fits a 128 GB host without swap) |

  ### Full native context

  The checkpoint advertises a native 262,144-token context, which vLLM uses when
  `--max-model-len` is omitted. Startup and bounded evaluation were validated with
  this limit configured, but a single 262K-token request was not tested.

  ### MTP speculative decoding

  Add the following option:

  ```bash
  --speculative-config '{"method":"mtp","num_speculative_tokens":3}'
  ```

  ### Offload the 51B N-gram embedding table

  Builds containing N-gram Embedding offload can keep the N-gram lookup 
  memory in host RAM and asynchronously prefetch the required rows. The initial 
  implementation supports both ModelRunner V1 and V2. PLE CPU offload is optional
  for TP and TEP, but required for DEP. The DEP strategy generated by this recipe
  enables it automatically.

  ```bash
  VLLM_PLE_CPU_OFFLOAD=1 \
  vllm serve Qwen/Qwen3.8-Flash-Next-FP8 \
    --tensor-parallel-size 4 \
    --max-model-len 262144 \
    --no-enable-flashinfer-autotune \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_xml \
    --reasoning-parser qwen3
  ```

  ### Extend to one million tokens with YaRN

  The checkpoint is native at 262K. For a one-million-token workload, enable static
  YaRN explicitly; evaluate shorter-context quality before using this as the default.

  ```bash
  VLLM_ALLOW_LONG_MAX_MODEL_LEN=1 \
  vllm serve Qwen/Qwen3.8-Flash-Next-FP8 \
    --tensor-parallel-size 4 \
    --hf-overrides '{"rope_parameters":{"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":262144}}' \
    --max-model-len 1000000 \
    --no-enable-flashinfer-autotune \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_xml \
    --reasoning-parser qwen3
  ```

  ## Verifying

  ```python
  from openai import OpenAI

  client = OpenAI(api_key="EMPTY", base_url="http://localhost:8000/v1")
  response = client.chat.completions.create(
      model="Qwen/Qwen3.8-Flash-Next-FP8",
      messages=[{
          "role": "user",
          "content": "Explain how Gated DeltaNet and Qwen Sparse Attention complement each other.",
      }],
      max_tokens=8196,
  )
  print(response.choices[0].message.content)
  ```

  A correct response should explain that GDN maintains a compact recurrent summary,
  while QSA selectively retrieves important regions from the full token history.

  ## Troubleshooting

  - **FP8 on eight GPUs:** use TEP8; plain TP8 is incompatible with this
    checkpoint. TP4 is also supported if GPU memory capacity allows.
  - **TP1 compilation OOM on GB300:** use TP2 or TP4.
  - **Mamba-cache capacity error at startup:** keep `--max-num-seqs 256`.
  - **Runtime OOM on large multimodal batches:** keep `--gpu-memory-utilization 0.90`.
  - **Out of memory while loading:** enable N-gram Embedding CPU offload, increase 
    TP size, or reduce `--max-model-len` to reserve less KV cache.
  - **XPU/TPU startup error:** these platforms are not supported by the initial
    implementation.
  - **Pipeline-parallel startup error:** N-gram Embedding does not initially support
    pipeline parallelism; use single-node TP or TEP instead.
  - **DEP startup failure:** DEP requires `VLLM_PLE_CPU_OFFLOAD=1`; DEP without PLE
    offload is not supported. The generated DEP command sets this automatically.
  - **MTP memory pressure:** reduce `num_speculative_tokens` below 3.
  - **PLE:** a network layer that injects N-gram Embeddings into the main model. 
  - **`no module/parameter named 'ngram_embedding.weight_scale'` at load:** the
    checkpoint stores the N-gram table as FP8 but the quant config is not
    `Fp8Config`, so the FP8 embedding path is never selected. Set
    `VLLM_PLE_FORCE_FP8=1` (see the RTX 5090 section).
  - **`PLE offload checkpoint did not load all materialized parameters:
    [...weight_scale]`:** the reverse mismatch — `VLLM_PLE_FORCE_FP8=1` with a
    checkpoint whose N-gram table is BF16 and ships no scale tensor. Unset the
    variable or use an FP8-table checkpoint.
  - **`custom_all_reduce.cuh:164 'invalid argument'` at init on consumer
    Blackwell:** add `--disable-custom-all-reduce`.
  - **`Engine core initialization failed` with no traceback on sm120:** usually
    DeepGEMM; set `VLLM_USE_DEEP_GEMM=0` and `VLLM_MOE_USE_DEEP_GEMM=0`.

  ## References

  - [Qwen3.8-Flash-Next model card](https://huggingface.co/Qwen/Qwen3.8-Flash-Next)
  - [Qwen3.8-Flash-Next FP8 checkpoint](https://huggingface.co/Qwen/Qwen3.8-Flash-Next-FP8)
  - [Qwen3.8-Flash-Next: A New Architecture, Towards Ultimate Cost-Efficiency](https://qwen.ai/blog?id=qwen3.8-flash-next)
  - [Qwen3-Next recipe](../Qwen3-Next-80B-A3B-Instruct)
