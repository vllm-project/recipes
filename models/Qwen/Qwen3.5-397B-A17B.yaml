meta:
  title: "Qwen3.5-397B"
  slug: "qwen3.5-397b"
  provider: "Qwen"
  description: "Multimodal MoE model with gated delta networks architecture, 397B total / 17B active parameters, up to 262K context"
  date_added: 2026-02-16
  date_updated: 2026-08-08
  difficulty: intermediate
  tasks:
    - multimodal
    - text
  performance_headline: "25K total TPS/GPU on GB200 NVL72 with P/D disaggregation · verified on 8x H200 and 8x MI300X/MI355X"
  related_recipes:
    - "Qwen/Qwen3.6-35B-A3B"
  hardware:
    h200: verified
    gb200: verified
    mi300x: verified
    mi325x: verified
    mi355x: verified

model:
  model_id: "Qwen/Qwen3.5-397B-A17B"
  min_vllm_version: "0.17.0"
  architecture: moe
  parameter_count: "397B"
  active_parameters: "17B"
  context_length: 262144
  base_args:
    - "--trust-remote-code"
  base_env:
    VLLM_DEEP_GEMM_WARMUP: "skip"
    VLLM_USE_DEEP_GEMM: "0"
    VLLM_FLASHINFER_MOE_BACKEND: "latency"

features:
  tool_calling:
    description: "Enable automatic tool choice with Qwen3 Coder parser"
    args:
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "qwen3_coder"
  reasoning:
    description: "Enable chain-of-thought reasoning with Qwen3 parser"
    args:
      - "--reasoning-parser"
      - "qwen3"
  spec_decoding:
    description: "Multi-token prediction speculative decoding for lower latency"
    args:
      - "--speculative-config"
      - '{"method":"mtp","num_speculative_tokens":3}'
  text_only:
    description: "Skip loading the vision encoder for text-only workloads — frees VRAM for KV cache and unlocks the fused QK-norm + RoPE + gate path in the attention layers. Mutually exclusive with encoder_parallel."
    args:
      - "--language-model-only"
  encoder_parallel:
    description: "Run the vision encoder in data-parallel mode — avoids TP comm overhead on the small encoder. Mutually exclusive with text_only."
    args:
      - "--mm-encoder-tp-mode"
      - "data"

opt_in_features:
  - spec_decoding
  - text_only

variants:
  default:
    precision: bf16
    vram_minimum_gb: 953
    description: "Full precision BF16 — requires 8x H200 or equivalent"
  nvfp4:
    model_id: "nvidia/Qwen3.5-397B-A17B-NVFP4"
    precision: nvfp4
    vram_minimum_gb: 238
    extra_args:
      - "--kv-cache-dtype"
      - "fp8"
    extra_env:
      VLLM_USE_FLASHINFER_MOE_FP4: "1"
  gptq_int4:
    model_id: "Qwen/Qwen3.5-397B-A17B-GPTQ-Int4"
    precision: int4
    vram_minimum_gb: 239
    description: "GPTQ Int4 checkpoint — halves VRAM vs FP8"

compatible_strategies:
  - single_node_tp
  - single_node_tep
  - single_node_dep
  - multi_node_tp
  - multi_node_tp_pp
  - multi_node_dep
  - multi_node_tep
  - pd_cluster

hardware_overrides: {}

strategy_overrides:
  # Disaggregated settings track the vLLM 25K total TPS/GPU GB200 NVL72 run
  # (https://vllm.ai/blog/2026-08-06-qwen35-25k-tps), whose launcher recipes
  # live in NVIDIA/srt-slurm-recipes under Qwen3.5/GB200/8k1k/vllm/disagg.
  pd_cluster:
    env:
      # Mandatory for SSM models under disaggregation — GDN conv-state transfer
      # over NIXL does not work without the DS layout.
      VLLM_SSM_CONV_STATE_LAYOUT: "DS"
    prefill:
      # Reference layout is NxDEP2 prefill endpoints (N = 4..8) against one DEP8
      # decode endpoint. On 4-GPU NVL4 trays that is 2 trays of prefill at the
      # 4xDEP2 base config, growing to 4 trays at 8xDEP2; rendered here as one
      # aggregate DEP pool per role (same GPU budget, one endpoint instead of N).
      nodes:
        gb200: 2
        gb300: 2
      parallelism: dep
      tp: 1
      vllm_args:
        # Key contributor to crossing 25K tok/s/GPU. Needs a vLLM build that
        # already carries the PD race fixes (vllm#48481, vllm#45357) — older
        # builds collapse to zero accuracy with async scheduling enabled.
        - "--async-scheduling"
        # Frees KV cache capacity by keeping SSM state in bf16.
        - "--mamba-ssm-cache-dtype"
        - "bfloat16"
        # 2x ISL (8192), so each prefill step batches two full prompts —
        # worth ~+8% total TPS/GPU when prefill is the bottleneck.
        - "--max-num-batched-tokens"
        - "16384"
        # Cuts frontend overhead at high concurrency; buffers streamed output in
        # 100-token chunks, so drop it when optimizing for ITL/TPOT.
        - "--stream-interval"
        - "100"
      env: {}
    decode:
      nodes:
        gb200: 2
        gb300: 2
      parallelism: dep
      tp: 1
      vllm_args:
        - "--async-scheduling"
        - "--mamba-ssm-cache-dtype"
        - "bfloat16"
        - "--stream-interval"
        - "100"
      env: {}

guide: |
  ## Overview

  [Qwen3.5](https://huggingface.co/Qwen/Qwen3.5-397B-A17B) is a multimodal mixture-of-experts model featuring a gated delta networks architecture with 397B total parameters and 17B active parameters. This guide covers how to efficiently deploy and serve the model across different hardware configurations and workload profiles using vLLM.

  ## Prerequisites

  ### Pip Install

  #### NVIDIA
  ```bash
  uv venv
  source .venv/bin/activate
  uv pip install -U vllm --torch-backend=auto
  ```

  #### AMD
  > Note: The vLLM wheel for ROCm requires Python 3.12, ROCm 7.0, and glibc >= 2.35. If your environment does not meet these requirements, please use the Docker-based setup. Supported GPUs: MI300X, MI325X, MI355X.
  ```bash
  uv venv --python 3.12
  source .venv/bin/activate
  uv pip install vllm --extra-index-url https://wheels.vllm.ai/rocm
  ```

  ### Docker

  #### NVIDIA
  ```bash
  docker run --gpus all \
    -p 8000:8000 \
    --ipc=host \
    -v ~/.cache/huggingface:/root/.cache/huggingface \
    vllm/vllm-openai Qwen/Qwen3.5-397B-A17B \
      --tensor-parallel-size 8 \
      --reasoning-parser qwen3 \
      --enable-prefix-caching
  ```
  For Blackwell GPUs, use `vllm/vllm-openai:cu130-nightly`.

  #### AMD
  ```bash
  docker run --device=/dev/kfd --device=/dev/dri \
    --security-opt seccomp=unconfined \
    --group-add video \
    --ipc=host \
    -p 8000:8000 \
    -v ~/.cache/huggingface:/root/.cache/huggingface \
    vllm/vllm-openai-rocm:latest \
    Qwen/Qwen3.5-397B-A17B-FP8 \
    --tensor-parallel-size 8 \
    --reasoning-parser qwen3 \
    --enable-prefix-caching
  ```

  ## Deployment Configurations

  The configurations below have been verified on 8x H200 GPUs and 8x MI300X/MI355X GPUs. We recommend using the official FP8 checkpoint [Qwen/Qwen3.5-397B-A17B-FP8](https://huggingface.co/Qwen/Qwen3.5-397B-A17B-FP8) for optimal serving efficiency.

  ### Throughput-Focused (Text-Only)

  For maximum text throughput under high concurrency, use `--language-model-only` to skip loading the vision encoder and free up memory for KV cache, and enable Expert Parallelism.

  ```bash
  vllm serve Qwen/Qwen3.5-397B-A17B-FP8 \
    -dp 8 \
    --enable-expert-parallel \
    --language-model-only \
    --reasoning-parser qwen3 \
    --enable-prefix-caching
  ```

  ### Throughput-Focused (Multimodal)

  For multimodal workloads, use `--mm-encoder-tp-mode data` for data-parallel vision encoding and `--mm-processor-cache-type shm` for shared-memory caching of preprocessed multimodal inputs.

  ```bash
  vllm serve Qwen/Qwen3.5-397B-A17B-FP8 \
    -dp 8 \
    --enable-expert-parallel \
    --mm-encoder-tp-mode data \
    --mm-processor-cache-type shm \
    --reasoning-parser qwen3 \
    --enable-prefix-caching
  ```

  To enable tool calling, add `--enable-auto-tool-choice --tool-call-parser qwen3_coder` to the serve command.

  ### Latency-Focused

  For latency-sensitive workloads at low concurrency, enable MTP-1 speculative decoding and disable prefix caching. MTP-1 reduces time-per-output-token (TPOT) with a high acceptance rate, at the cost of lower throughput under load.

  > Note: MTP-1 speculative decoding for AMD GPUs is under development.

  ```bash
  vllm serve Qwen/Qwen3.5-397B-A17B-FP8 \
    --tensor-parallel-size 8 \
    --speculative-config '{"method": "mtp", "num_speculative_tokens": 1}' \
    --reasoning-parser qwen3
  ```

  ### GB200 Deployment

  We recommend using the NVFP4 checkpoint [nvidia/Qwen3.5-397B-A17B-NVFP4](https://huggingface.co/nvidia/Qwen3.5-397B-A17B-NVFP4) for optimal serving efficiency on GB200 nodes.

  ```bash
  vllm serve nvidia/Qwen3.5-397B-A17B-NVFP4 \
    -dp 4 \
    --enable-expert-parallel \
    --language-model-only \
    --reasoning-parser qwen3 \
    --enable-prefix-caching
  ```

  ### GB200 NVL72 Disaggregated Serving — 25K total TPS/GPU

  vLLM reaches **25,000 total TPS/GPU** on
  [nvidia/Qwen3.5-397B-A17B-NVFP4](https://huggingface.co/nvidia/Qwen3.5-397B-A17B-NVFP4)
  over GB200 NVL72 with prefill/decode disaggregation at ISL/OSL = 8192/1024.
  GSM8K accuracy across all measured configurations is 88%, matching the
  aggregated run. Full Pareto sweep in the
  [vLLM blog post](https://vllm.ai/blog/2026-08-06-qwen35-25k-tps); the launcher
  recipes live in
  [NVIDIA/srt-slurm-recipes](https://github.com/NVIDIA/srt-slurm-recipes/tree/main/recipes/multi-node/Qwen3.5/GB200/8k1k/vllm/disagg).

  #### Topology

  The naming scheme is `NxDEP2-1xDEP8`: N prefill endpoints (N = 4…8), each
  DEP2 — 2 GPUs running DP2 + expert parallel — against a single DEP8 decode
  endpoint (8 GPUs = 2 NVL4 trays). Prefill grows from 2 trays at `4xDEP2` to 4
  trays at `8xDEP2` while the decode side stays fixed. Concurrency was swept
  from 64 to 5120; past 5120 the single decode endpoint runs out of KV cache
  capacity and you need to add decode GPUs rather than push concurrency higher.

  The command builder above renders one aggregate DEP pool per role — the same
  GPU budget, one endpoint instead of N. To reproduce the blog's exact layout,
  launch N independent DEP2 prefill workers behind the router.

  #### Settings that matter

  | Setting | Where | Why |
  | --- | --- | --- |
  | `VLLM_SSM_CONV_STATE_LAYOUT=DS` | both roles | Mandatory for SSM models under disaggregation — conv-state transfer does not work without it. |
  | `--async-scheduling` | both roles | One of the key features behind crossing 25K tok/s/GPU. Requires a vLLM build containing the PD race fixes ([#48481](https://github.com/vllm-project/vllm/pull/48481), [#45357](https://github.com/vllm-project/vllm/pull/45357)); on earlier builds accuracy collapses to zero with it enabled. |
  | `--mamba-ssm-cache-dtype bfloat16` | both roles | Significantly increases effective KV cache capacity on the decode endpoint. |
  | `--max-num-batched-tokens 16384` | prefill | 2× ISL, so each prefill step batches two full prompts. Worth about +8% total TPS/GPU at high concurrency in the configurations where prefill is the bottleneck ({4,5,6}×DEP2). |
  | `--language-model-only` | both roles | Text-only workload: disables multimodal inputs and unlocks the fused QK-norm + RoPE + gate path in the attention layers. Toggle the **Text Only** feature above. |
  | `--stream-interval 100` | both roles | Reduces frontend overhead at high concurrency. It buffers streamed output in 100-token chunks, so it does affect measured per-token latency — drop it if you optimize for ITL/TPOT rather than aggregate throughput. |
  | `--max-cudagraph-capture-size` | decode | Raised to `concurrency/8 + 128` (640 at cc=4096, 768 at cc=5120), where 8 is the number of DP ranks on the decode endpoint. vLLM's default caps captured graphs at 512, which is enough through cc=3072. |

  Prefix caching was disabled for these runs — it buys nothing on the random
  benchmark dataset. Keep it enabled for workloads with shared prefixes.

  On supported Blackwell configurations, prefill automatically selects the
  [FlashInfer GDN kernel](https://github.com/flashinfer-ai/flashinfer/pull/3001)
  when the GDN backend is `auto` (the default); request it explicitly with
  `--gdn-prefill-backend flashinfer`. `--no-disable-hybrid-kv-cache-manager` is
  no longer required — HMA has been enabled by default for several vLLM releases.

  #### Reproducing

  The measurements used the `vllm/vllm-openai:nightly-d223c90` image,
  [Dynamo](https://github.com/ai-dynamo/dynamo) `1.2.0.dev20260526`, and
  [srt-slurm](https://github.com/NVIDIA/srt-slurm) `v1.0.32`:

  ```bash
  srtctl run --file 4xdep2-1xdep8.yaml
  ```

  Two practical debugging notes:

  - On a data-parallel endpoint vLLM defaults `--api-server-count` to the
    data-parallel size, and with more than one API server it disables its default
    stats logging. Forcing `--api-server-count 1` brings back the periodic prompt
    and generation throughput plus KV cache utilization lines (interval
    configurable via `VLLM_LOG_STATS_INTERVAL`, default 10s) — the metrics that
    identify per-configuration bottlenecks.
  - Set `DYN_LOG=error`, `DYN_SDK_DISABLE_ANSI_LOGGING=1`, and
    `VLLM_LOGGING_COLOR=0`. The first cuts Dynamo's very verbose default logging;
    the other two suppress most ANSI escape sequences so log files stay readable.

  ### MI355X Deployment

  ```bash
  vllm serve Qwen/Qwen3.5-397B-A17B-FP8 \
    -tp 2 \
    --enable-expert-parallel \
    --language-model-only \
    --reasoning-parser qwen3 \
    --enable-prefix-caching
  ```

  ## Processing Ultra-Long Texts

  Qwen3.5-397B-A17B natively supports `262,144` tokens. For longer inputs, apply
  YaRN RoPE scaling via `--hf-overrides` and raise `--max-model-len`. Pick
  `factor` to match your real workload — `2.0` covers ~524K, `4.0` covers
  ~1M — since YaRN at higher factors degrades short-context quality.

  ```bash
  VLLM_ALLOW_LONG_MAX_MODEL_LEN=1 vllm serve Qwen/Qwen3.5-397B-A17B-FP8 \
    --tensor-parallel-size 8 \
    --max-model-len 1010000 \
    --reasoning-parser qwen3 \
    --hf-overrides '{"text_config": {"rope_parameters": {"mrope_interleaved": true, "mrope_section": [11, 11, 10], "rope_type": "yarn", "rope_theta": 10000000, "partial_rotary_factor": 0.25, "factor": 4.0, "original_max_position_embeddings": 262144}}}'
  ```

  See the [model card](https://huggingface.co/Qwen/Qwen3.5-397B-A17B#processing-ultra-long-texts) for the full parameter reference.

  ## Client Usage

  ```python
  import time
  from openai import OpenAI

  client = OpenAI(
      api_key="EMPTY",
      base_url="http://localhost:8000/v1",
      timeout=3600
  )

  messages = [
      {
          "role": "user",
          "content": [
              {
                  "type": "image_url",
                  "image_url": {
                      "url": "https://ofasys-multimodal-wlcb-3-toshanghai.oss-accelerate.aliyuncs.com/wpf272043/keepme/image/receipt.png"
                  }
              },
              {
                  "type": "text",
                  "text": "Read all the text in the image."
              }
          ]
      }
  ]

  start = time.time()
  response = client.chat.completions.create(
      model="Qwen/Qwen3.5-397B-A17B",
      messages=messages,
      max_tokens=2048
  )
  print(f"Response costs: {time.time() - start:.2f}s")
  print(f"Generated text: {response.choices[0].message.content}")
  ```

  ## Troubleshooting

  **CUDA graph / Mamba cache size error**

  You may encounter:
  ```
  assert num_cache_lines >= batch
  ```
  This occurs because the CUDA graph capture size is larger than the Mamba cache size. Reduce `--max-cudagraph-capture-size` (default is 512). See https://github.com/vllm-project/vllm/pull/34571 for details.

  **Configuration tips**

  - **Disable Reasoning**: Add `--reasoning-parser qwen3 --default-chat-template-kwargs '{"enable_thinking": false}'` to disable reasoning mode via command-line parameters.
  - **Prefix Caching**: Prefix caching for Mamba cache "align" mode is currently experimental.
  - **Multi-token Prediction**: MTP-1 reduces per-token latency but degrades throughput under high concurrency because speculative tokens consume KV cache capacity. Adjust `num_speculative_tokens` (1-5) based on your use case.
  - **Encoder Data Parallelism**: `--mm-encoder-tp-mode data` deploys the vision encoder in a data-parallel fashion. This consumes additional memory and may require adjustment of `--gpu-memory-utilization`.
  ## References

  - Model card: https://huggingface.co/Qwen/Qwen3.5-397B-A17B
  - FP8 checkpoint: https://huggingface.co/Qwen/Qwen3.5-397B-A17B-FP8
  - NVFP4 checkpoint: https://huggingface.co/nvidia/Qwen3.5-397B-A17B-NVFP4
  - vLLM blog — 25K total TPS/GPU on Qwen3.5: https://vllm.ai/blog/2026-08-06-qwen35-25k-tps
  - Disaggregated launcher recipes: https://github.com/NVIDIA/srt-slurm-recipes/tree/main/recipes/multi-node/Qwen3.5/GB200/8k1k/vllm/disagg
  - vLLM documentation: https://docs.vllm.ai/
