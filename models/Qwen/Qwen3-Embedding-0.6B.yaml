meta:
  title: "Qwen3-Embedding-0.6B"
  slug: "Qwen3-Embedding-0.6B"
  provider: "Qwen"
  description: "Qwen3-Embedding-0.6B — the smallest Qwen3 Embedding model (0.6B dense), for text embedding and retrieval; single-card pooling deployment on Ascend 910B with vLLM Ascend"
  date_added: 2026-10-14
  date_updated: 2026-10-14
  tasks:
    - embedding
  performance_headline: "Single-card pooling serving on Ascend 910B (Atlas 800I A2) with vLLM Ascend"
  hardware:
    ascend_910b: verified

model:
  model_id: "Qwen/Qwen3-Embedding-0.6B"
  min_vllm_version: "0.9.2"
  architecture: dense
  parameter_count: "0.6B"
  active_parameters: "0.6B"
  context_length: 32768
  base_args:
    - "--runner"
    - "pooling"
  base_env: {}
  docker_image:
    ascend_910b: "quay.io/ascend/vllm-ascend:v0.30.0rc2"

variants:
  default:
    precision: bf16
    vram_minimum_gb: 2
    supported_hardware: [ascend_910b]
    hardware_overrides:
      ascend_910b:
        docker_image: "quay.io/ascend/vllm-ascend:v0.30.0rc2"
        install:
          pip: false
        extra_args:
          - "--max-model-len"
          - "1024"
    description: "BF16 checkpoint on a single 64 GB Ascend 910B NPU (pooling, max-model-len 1024), verified end-to-end with vLLM Ascend"

compatible_strategies:
  - single_node_tp

hardware_overrides: {}
strategy_overrides: {}

dependencies: []

guide: |
  ## Overview

  The Qwen3 Embedding model series is designed for text embedding and ranking tasks, built
  on the dense foundational models of the Qwen3 series and available in 0.6B, 4B, and 8B
  sizes. Qwen3-Embedding-0.6B is the smallest variant, optimized for fast, low-cost
  embedding serving. vLLM Ascend 0.9.2rc1 and higher supports this model.

  ## Prerequisites

  - **Hardware:** 1x Ascend 910B NPU (64 GB HBM), Atlas 800I A2 series
  - **Runtime:** official vLLM Ascend Docker image (Ascend installs are docker-only —
    there is no official pip wheel):

    ```bash
    docker pull quay.io/ascend/vllm-ascend:v0.30.0rc2
    ```

  - **Checkpoint:** download the BF16 weights and record the local path

    ```bash
    pip install modelscope
    modelscope download --model Qwen/Qwen3-Embedding-0.6B
    ```

    Larger siblings are available as [Qwen3-Embedding-4B](https://www.modelscope.cn/models/Qwen/Qwen3-Embedding-4B)
    and [Qwen3-Embedding-8B](https://www.modelscope.cn/models/Qwen/Qwen3-Embedding-8B).

  ## Launching the Server

  ### Single Ascend 910B (pooling)

  Start the container with the NPU devices mounted, then serve the model in pooling mode:

  ```bash
  export IMAGE=quay.io/ascend/vllm-ascend:v0.30.0rc2

  docker run --rm \
      --name vllm-ascend \
      --shm-size=1g \
      --net=host \
      --privileged=true \
      --device /dev/davinci0 \
      --device /dev/davinci_manager \
      --device /dev/devmm_svm \
      --device /dev/hisi_hdc \
      -v /usr/local/dcmi:/usr/local/dcmi \
      -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool \
      -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
      -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
      -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
      -v /etc/ascend_install.info:/etc/ascend_install.info \
      -v /root/.cache:/root/.cache \
      -it $IMAGE bash
  ```

  ```bash
  vllm serve /root/.cache/models/Qwen/Qwen3-Embedding-0.6B \
      --served-model-name Qwen/Qwen3-Embedding-0.6B \
      --runner pooling \
      --port 8000 \
      --max-model-len 1024
  ```

  > `--max-model-len` must stay an explicit conservative value (e.g. 1024): a large
  > automatically-resolved context allocates an O(max_model_len^2) attention mask and can
  > OOM the NPU.

  ## Verifying the Deployment

  ```bash
  curl -X POST http://localhost:8000/v1/embeddings -H "Content-Type: application/json" -d '{
    "input": [
      "The capital of China is Beijing.",
      "Gravity is a force that attracts two bodies towards each other. It gives weight to physical objects and is responsible for the movement of planets around the sun."
    ]
  }'
  ```

  Expected result: HTTP 200 with a JSON response whose `data[]` entries carry `embedding`
  vectors. For more usage examples see the [pooling examples](https://github.com/vllm-project/vllm/tree/main/examples/pooling/embed).

  ## Accuracy Evaluation (MTEB)

  Run the evaluation with [MTEB](https://docs.mteb.org/):

  ```python
  import os
  import mteb

  from mteb.models.vllm_wrapper import VllmEncoderWrapper

  if __name__ == "__main__":
      data_path = "/home/data/mteb_data"
      os.environ["HF_DATASETS_CACHE"] = data_path
      os.environ["HF_ENDPOINT"] = "https://hf-mirror.com"

      model = VllmEncoderWrapper("/root/.cache/Qwen3-Embedding-0.6B",
                                  revision="norm",
                                  dtype="float16",
                                  max_model_len=10240,
                                  )

      cache = mteb.ResultCache(data_path)
      tasks = mteb.get_tasks(tasks=["LeCaRDv2"])
      results = mteb.evaluate(model, tasks=tasks, cache=cache, encode_kwargs={"batch_size": 2}, overwrite_strategy="always")
      df = results.to_dataframe()
      print(df)
  ```

  ## Performance Evaluation

  ```bash
  vllm bench serve \
      --model /root/.cache/models/Qwen/Qwen3-Embedding-0.6B \
      --served-model-name Qwen/Qwen3-Embedding-0.6B \
      --backend openai-embeddings \
      --host 127.0.0.1 \
      --port 8000 \
      --dataset-name random \
      --endpoint /v1/embeddings \
      --random-input 200 \
      --request-rate 5 \
      --save-result \
      --result-dir ./
  ```

  Measured on 1x Ascend 910B 64GB (vllm-ascend v0.30.0rc2 image): 1000/1000 requests
  succeeded, 0 failed; 999.74 tokens/s total throughput, 5.00 requests/s, mean E2E
  latency 47.45 ms (P99 124.07 ms).

