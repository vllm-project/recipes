meta:
  title: "Qwen3-ASR-1.7B"
  slug: "Qwen3-ASR-1.7B"
  provider: "Qwen"
  description: "Qwen3-ASR-1.7B — a 1.7B automatic speech recognition model for Chinese/English speech, dialects, multilingual audio, and singing; single-card serving on Ascend 910B with vLLM Ascend"
  date_added: 2026-10-14
  date_updated: 2026-10-14
  tasks:
    - multimodal
  performance_headline: "Single-card ASR serving on Ascend 910B (Atlas 800I A2) with vLLM Ascend"
  hardware:
    ascend_910b: verified

model:
  model_id: "Qwen/Qwen3-ASR-1.7B"
  architecture: dense
  parameter_count: "1.7B"
  active_parameters: "1.7B"
  context_length: 4096
  base_args:
    - "--enforce-eager"
  base_env: {}
  docker_image:
    ascend_910b: "quay.io/ascend/vllm-ascend:v0.30.0rc2"

variants:
  default:
    precision: bf16
    vram_minimum_gb: 5
    supported_hardware: [ascend_910b]
    hardware_overrides:
      ascend_910b:
        docker_image: "quay.io/ascend/vllm-ascend:v0.30.0rc2"
        install:
          pip: false
        extra_args:
          - "--gpu-memory-utilization"
          - "0.9"
    description: "BF16 checkpoint on a single 64 GB Ascend 910B NPU (TP1, eager mode), verified end-to-end with vLLM Ascend"

compatible_strategies:
  - single_node_tp

hardware_overrides: {}
strategy_overrides: {}

dependencies: []

guide: |
  ## Overview

  Qwen3-ASR-1.7B is a 1.7B-parameter automatic speech recognition (ASR) model from the Qwen
  team. It supports Chinese and English speech, Chinese dialects, multilingual speech, and
  singing voice transcription, with long-audio and streaming inference capabilities.

  ## Prerequisites

  - **Hardware:** 1x Ascend 910B NPU (64 GB HBM), Atlas 800I A2 series
  - **Runtime:** official vLLM Ascend Docker image (Ascend installs are docker-only —
    there is no official pip wheel):

    ```bash
    docker pull quay.io/ascend/vllm-ascend:v0.30.0rc2
    ```

  - **Checkpoint:** download the BF16 weights and record the local path

    ```bash
    pip install modelscope
    modelscope download --model Qwen/Qwen3-ASR-1.7B
    ```

  ## Launching the Server

  ### Single Ascend 910B (TP1)

  Start the container with the NPU devices mounted, then serve the model:

  ```bash
  export IMAGE=quay.io/ascend/vllm-ascend:v0.30.0rc2

  docker run --rm \
      --name vllm-ascend \
      --shm-size=1g \
      --net=host \
      --device /dev/davinci0 \
      --device /dev/davinci_manager \
      --device /dev/devmm_svm \
      --device /dev/hisi_hdc \
      -v /usr/local/dcmi:/usr/local/dcmi \
      -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
      -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
      -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
      -v /etc/ascend_install.info:/etc/ascend_install.info \
      -v /root/.cache:/root/.cache \
      -it $IMAGE bash
  ```

  ```bash
  vllm serve /root/.cache/models/Qwen3-ASR-1.7B \
      --served-model-name qwen3-asr \
      --tensor-parallel-size 1 \
      --max-model-len 4096 \
      --gpu-memory-utilization 0.9 \
      --enforce-eager \
      --port 8000
  ```

  ## Verifying the Deployment

  ```bash
  curl http://localhost:8000/v1/chat/completions \
      -H "Content-Type: application/json" \
      -d '{
          "model": "qwen3-asr",
          "messages": [
              {
                  "role": "user",
                  "content": [
                      {
                          "type": "audio_url",
                          "audio_url": {
                              "url": "https://qianwen-res.oss-cn-beijing.aliyuncs.com/Qwen3-ASR-Repo/asr_en.wav"
                          }
                      }
                  ]
              }
          ]
      }'
  ```

  Expected result: HTTP 200 and a JSON response containing the transcription in the
  `choices` field.

  ## Accuracy Evaluation

  Evaluate transcription quality with Word Error Rate (WER) for word-level recognition and
  Character Error Rate (CER) for character-level recognition. The official tutorial does not
  publish fixed WER/CER numbers; measure them on your own deployment with a labeled audio set.

  ## Performance Evaluation

  Measure ASR serving performance with audio samples that represent the production workload.
  Record at least the audio duration, request concurrency, end-to-end latency, real-time
  factor, and throughput, so audio preprocessing, request construction, API communication,
  inference, and response parsing are all included.

  Measured on 1x Ascend 910B 64GB (vllm-ascend v0.30.0rc2 image): 20/20 concurrent (4-way)
  audio transcription requests succeeded, ~4.4s mean per-request latency. Actual performance
  varies with audio duration, concurrency, and deployment configuration.

  ## References

  - [Qwen3-ASR-1.7B model card (HuggingFace)](https://huggingface.co/Qwen/Qwen3-ASR-1.7B)
  - [Qwen3-ASR-1.7B (ModelScope)](https://www.modelscope.cn/models/Qwen/Qwen3-ASR-1.7B)
  - [vLLM Ascend tutorial: Qwen3-ASR-1.7B](https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/Qwen3-ASR-1.7B.html)
  - [vLLM Ascend repository](https://github.com/vllm-project/vllm-ascend)
