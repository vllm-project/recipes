meta:
  title: "Qwen3.6-35B-A3B"
  slug: "qwen3.6-35b-a3b"
  provider: "Qwen"
  description: "Smaller Qwen3.6 multimodal MoE model (35B total / 3B active) with BF16, FP8, and NVIDIA NVFP4 variants"
  date_added: 2026-04-16
  date_updated: 2026-06-03
  difficulty: beginner
  tasks:
    - multimodal
    - text
  performance_headline: "Compact Qwen3.6 MoE with 3B active parameters — single-GPU FP8 or 2-4 GPU BF16 serving"
  related_recipes:
    - "Qwen/Qwen3.5-397B-A17B"
  hardware:
    dgx_spark_gb10: verified
    h100: verified
    h200: verified
    mi300x: verified
    mi325x: verified
    mi355x: verified
    rtx_pro_6000: verified
    dgx_station_gb300: verified
    rtx_5090: verified

model:
  model_id: "Qwen/Qwen3.6-35B-A3B"
  min_vllm_version: "0.17.0"
  architecture: moe
  parameter_count: "35B"
  active_parameters: "3B"
  context_length: 262144
  base_args:
    - "--trust-remote-code"
  base_env: {}

features:
  tool_calling:
    description: "Enable automatic tool choice with Qwen3 XML parser"
    args:
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "qwen3_xml"
  reasoning:
    description: "Enable chain-of-thought reasoning with Qwen3 parser"
    args:
      - "--reasoning-parser"
      - "qwen3"
  spec_decoding:
    description: "Multi-token prediction speculative decoding for lower latency"
    modes:
      mtp:
        args:
          - "--speculative-config"
          - '{"method":"mtp","num_speculative_tokens":3,"moe_backend":"triton"}'
        hardware_overrides:
          rtx_pro_6000:
            args:
              - "--speculative-config"
              - '{"method":"mtp","num_speculative_tokens":4,"moe_backend":"flashinfer_cutlass"}'
          rtx_5090:
            args:
              - "--speculative-config"
              - '{"method":"mtp","num_speculative_tokens":4,"moe_backend":"flashinfer_cutlass"}'
  text_only:
    description: "Skip loading the vision encoder for text-only workloads — frees VRAM for KV cache. Mutually exclusive with encoder_parallel."
    args:
      - "--language-model-only"
  encoder_parallel:
    description: "Run the vision encoder in data-parallel mode — avoids TP comm overhead on the small encoder. Mutually exclusive with text_only."
    args:
      - "--mm-encoder-tp-mode"
      - "data"

opt_in_features:
  - spec_decoding
  - text_only

variants:
  default:
    precision: bf16
    vram_minimum_gb: 84
    description: "Full precision BF16 — fits on 1x H200 or 2x H100"
    hardware_overrides:
      rtx_pro_6000:
        extra_args:
          - "--max-num-seqs"
          - "8"
  fp8:
    model_id: "Qwen/Qwen3.6-35B-A3B-FP8"
    precision: fp8
    vram_minimum_gb: 42
    description: "Qwen official FP8 checkpoint — single-GPU serving"
    hardware_overrides:
      rtx_pro_6000:
        extra_env:
          VLLM_USE_DEEP_GEMM: "0"
  nvfp4:
    model_id: "nvidia/Qwen3.6-35B-A3B-NVFP4"
    precision: nvfp4
    vram_minimum_gb: 21
    tp: 1
    min_vllm_version: "0.28.0"
    docker_image: "vllm/vllm-openai:v0.28.0"
    description: "NVIDIA ModelOpt NVFP4 checkpoint for Blackwell GPUs, including DGX Spark"
    extra_args:
      - "--kv-cache-dtype"
      - "fp8"
      - "--moe-backend"
      - "marlin"
      - "--enable-prefix-caching"
    hardware_overrides:
      dgx_spark_gb10:
        extra_args:
          - "--attention-backend"
          - "flashinfer"
          - "--gpu-memory-utilization"
          - "0.5"
          - "--max-model-len"
          - "262144"
          - "--max-num-seqs"
          - "8"
          - "--max-num-batched-tokens"
          - "8192"
          - "--enable-chunked-prefill"
          - "--async-scheduling"
          - "--load-format"
          - "fastsafetensors"
      dgx_station_gb300:
        extra_args:
          - "--attention-backend"
          - "flashinfer"
          - "--gpu-memory-utilization"
          - "0.92"
          - "--max-model-len"
          - "262144"
          - "--max-num-batched-tokens"
          - "8192"
          - "--enable-chunked-prefill"
          - "--async-scheduling"
          - "--load-format"
          - "fastsafetensors"
      rtx_pro_6000:
        extra_args:
          - "--quantization"
          - "modelopt_fp4"
          - "--block-size"
          - "128"
          - "--attention-backend"
          - "flashinfer"
          - "--attention-config"
          - '{"use_trtllm_attention":true}'
          - "--gpu-memory-utilization"
          - "0.9"
          - "--max-num-seqs"
          - "8"
          - "--max-num-batched-tokens"
          - "8192"
          - "--enable-chunked-prefill"
          - "--async-scheduling"
          - "--skip-mm-profiling"
          - "--load-format"
          - "fastsafetensors"
        extra_env:
          VLLM_HAS_FLASHINFER_CUBIN: "1"
      rtx_5090:
        extra_args:
          - "--quantization"
          - "modelopt_fp4"
          - "--block-size"
          - "128"
          - "--attention-backend"
          - "flashinfer"
          - "--attention-config"
          - '{"use_trtllm_attention":true}'
          - "--gpu-memory-utilization"
          - "0.85"
          - "--max-model-len"
          - "65536"
          - "--max-num-seqs"
          - "8"
          - "--max-num-batched-tokens"
          - "8192"
          - "--enable-chunked-prefill"
          - "--async-scheduling"
          - "--skip-mm-profiling"
        extra_env:
          VLLM_HAS_FLASHINFER_CUBIN: "1"

compatible_strategies:
  - single_node_tp
  - single_node_tep
  - single_node_dep
  - multi_node_tp
  - multi_node_tp_pp
  - multi_node_dep
  - multi_node_tep

hardware_overrides:
  amd:
    extra_args: []
    extra_env:
      VLLM_ROCM_USE_AITER: "1"

strategy_overrides: {}

guide: |
  ## Overview

  [Qwen3.6-35B-A3B](https://huggingface.co/Qwen/Qwen3.6-35B-A3B) is the smaller sibling
  of Qwen3.5, sharing the same gated-delta-networks MoE architecture but with 35B total
  parameters and 3B activated (256 experts, 8 routed + 1 shared). The recipe covers the
  BF16 base model, Qwen's official FP8 checkpoint, and NVIDIA's ModelOpt NVFP4
  checkpoint.

  ## Prerequisites

  - **vLLM version:** >= 0.17.0
  - **NVFP4 vLLM version:** >= 0.28.0. 0.24.0 loads the checkpoint, but
    FlashInfer only selects its XQA decode kernel on SM120 GPUs from 0.28.0.
  - **Hardware (BF16):** 1x H200 or 2x H100
  - **Hardware (FP8):** single H100/H200 or 1x MI300X/MI325X/MI355X
  - **Hardware (NVFP4):** NVIDIA Blackwell GPUs, including DGX Spark (GB10)

  ## NVFP4 on Blackwell

  Two distinct paths. GB10 (DGX Spark) and GB300 (DGX Station) run the
  checkpoint on the default loader with FlashInfer attention and a 3-token MTP
  draft on Triton; on Spark, unified memory is shared with the host, so
  `--gpu-memory-utilization` is capped at 0.5. The SM120 parts (RTX PRO 6000,
  RTX 5090) go through `modelopt_fp4` with FlashInfer's TRT-LLM attention
  kernels — hence `--block-size 128`, `VLLM_HAS_FLASHINFER_CUBIN=1`, and a
  deeper 4-token MTP draft on `flashinfer_cutlass`. The RTX 5090's 32 GB caps
  the context at 64K. Pick the hardware above and the command builder emits the
  right set.

  ## Processing Ultra-Long Texts

  Qwen3.6-35B-A3B natively supports `262,144` tokens. For longer inputs, apply
  YaRN RoPE scaling via `--hf-overrides` and raise `--max-model-len`. Pick
  `factor` to match your real workload — `2.0` covers ~524K, `4.0` covers
  ~1M — since YaRN at higher factors degrades short-context quality.

  ```bash
  VLLM_ALLOW_LONG_MAX_MODEL_LEN=1 vllm serve Qwen/Qwen3.6-35B-A3B-FP8 \
    --tensor-parallel-size 2 \
    --max-model-len 1010000 \
    --reasoning-parser qwen3 \
    --hf-overrides '{"text_config": {"rope_parameters": {"mrope_interleaved": true, "mrope_section": [11, 11, 10], "rope_type": "yarn", "rope_theta": 10000000, "partial_rotary_factor": 0.25, "factor": 4.0, "original_max_position_embeddings": 262144}}}'
  ```

  See the [model card](https://huggingface.co/Qwen/Qwen3.6-35B-A3B#processing-ultra-long-texts) for the full parameter reference.

  ## Client Usage

  ```python
  from openai import OpenAI

  client = OpenAI(api_key="EMPTY", base_url="http://localhost:8000/v1")
  resp = client.chat.completions.create(
      model="Qwen/Qwen3.6-35B-A3B",
      messages=[{"role": "user", "content": "Explain gated delta networks in one paragraph."}],
      max_tokens=512,
  )
  print(resp.choices[0].message.content)
  ```

  ## Troubleshooting

  - **CUDA graph / Mamba cache size error:** reduce `--max-cudagraph-capture-size`
    (default 512). See [vLLM PR #34571](https://github.com/vllm-project/vllm/pull/34571).
  - **Reasoning disable:** add `--default-chat-template-kwargs '{"enable_thinking": false}'`.
  - **Prefix Caching (Mamba):** currently experimental in "align" mode.

  ## References

  - [Qwen3.6-35B-A3B on Hugging Face](https://huggingface.co/Qwen/Qwen3.6-35B-A3B)
  - [FP8 checkpoint](https://huggingface.co/Qwen/Qwen3.6-35B-A3B-FP8)
  - [NVIDIA NVFP4 checkpoint](https://huggingface.co/nvidia/Qwen3.6-35B-A3B-NVFP4)
  - [Qwen3.5 recipe (sibling 397B-A17B flagship)](../Qwen3.5-397B-A17B)
