meta:
  title: "Qwen3-VL-30B-A3B-Instruct"
  slug: "qwen3-vl-30b-a3b-instruct"
  provider: "Qwen"
  description: "Qwen3-VL MoE vision-language model with 30B total / 3B active parameters, supporting image, video, and text workloads."
  date_added: 2026-08-17
  date_updated: 2026-09-28
  difficulty: intermediate
  tasks:
    - multimodal
    - text
  performance_headline: "Validated BF16 on Intel Xeon 6 and W8A8/MXFP8 on Ascend 950DT"
  related_recipes:
    - "Qwen/Qwen3-VL-235B-A22B-Instruct"
  hardware:
    xeon6: verified
    ascend_950dt: verified

model:
  model_id: "Qwen/Qwen3-VL-30B-A3B-Instruct"
  min_vllm_version: "0.11.0"
  architecture: moe
  parameter_count: "30B"
  active_parameters: "3B"
  context_length: 262144
  base_args: []
  base_env: {}

dependencies:
  - note: "Recommended for offline multimodal inference (image/video pre-processing helpers)"
    command: "uv pip install qwen-vl-utils==0.0.14"
    optional: true

features:
  text_only:
    description: "Skip loading the vision encoder for text-only workloads — frees memory for KV cache."
    args:
      - "--language-model-only"
  encoder_parallel:
    description: "Run the vision encoder in data-parallel mode."
    args:
      - "--mm-encoder-tp-mode"
      - "data"

opt_in_features:
  - text_only

hardware_opt_in_features:
  ascend_950dt:
    - encoder_parallel

variants:
  default:
    precision: bf16
    vram_minimum_gb: 72
    description: "Full precision BF16"
    supported_hardware:
      - xeon6
  ascend_w8a8_mxfp8:
    model_id: "Eco-Tech/Qwen3-VL-30B-A3B-Instruct-w8a8-mxfp8"
    label: "W8A8 (Ascend MXFP8)"
    precision: mxfp8
    vram_minimum_gb: 36
    description: "ModelSlim W8A8/MXFP8 checkpoint for one 8x96 GB Ascend 950DT node, using TP8 + EP."
    supported_hardware: [ascend_950dt]
    tp: 8
    min_vllm_version: "0.23.0"
    extra_args:
      - "--distributed-executor-backend"
      - "mp"
      - "--data-parallel-size"
      - "1"
      - "--enable-expert-parallel"
      - "--seed"
      - "1024"
      - "--quantization"
      - "ascend"
      - "--max-num-seqs"
      - "32"
      - "--max-model-len"
      - "32768"
      - "--max-num-batched-tokens"
      - "8192"
      - "--no-enable-prefix-caching"
      - "--mm-processor-cache-gb"
      - "0"
      - "--limit-mm-per-prompt"
      - '{"image":1,"video":0}'
      - "--gpu-memory-utilization"
      - "0.9"
      - "--compilation-config"
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - "--trust-remote-code"
    extra_env:
      VLLM_USE_MODELSCOPE: "True"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      HCCL_OP_EXPANSION_MODE: "AIV"
      HCCL_BUFFSIZE: "400"
      OMP_PROC_BIND: "false"
      OMP_NUM_THREADS: "100"
      TASK_QUEUE_ENABLE: "1"
      VLLM_ASCEND_ENABLE_FLASHCOMM1: "1"
    hardware_overrides:
      ascend_950dt:
        docker_image: "quay.io/ascend/vllm-ascend:v0.23.0-a5"
        install:
          pip: false
          docker:
            container_shell: true

compatible_strategies:
  - single_node_tp
  - single_node_tep
  - single_node_dep
  - multi_node_tp
  - multi_node_tp_pp
  - multi_node_dep
  - multi_node_tep

# This variant occupies the full node with TP8 and fixes DP=1; the DEP
# strategy would otherwise advertise DP8 on the same eight devices.
strategy_hardware:
  single_node_dep:
    ascend_950dt: unsupported

kv_offload_support:
  offloading_cpu: verified
  offloading_fs: verified

hardware_overrides: {}

strategy_overrides: {}

guide: |
  ## Overview

  Qwen3-VL-30B-A3B-Instruct is a multimodal Qwen3-VL MoE model. Intel Xeon 6
  CPU serving was validated with BF16.

  ## Prerequisites

  - Hardware: Intel Xeon 6 CPUs
  - vLLM >= 0.11.0

  ### pip (Intel Xeon 6 CPUs)

  For Intel and AMD x86 CPUs, follow the
  [CPU pre-built wheels](https://docs.vllm.ai/en/latest/getting_started/installation/cpu/#pre-built-wheels)
  installation instructions.

  ### Docker (Intel Xeon 6 CPUs)

  ```bash
  docker pull vllm/vllm-openai-cpu:latest-x86_64
  ```

  ## Intel Xeon 6

  ```bash
  vllm serve Qwen/Qwen3-VL-30B-A3B-Instruct \
    --tensor-parallel-size 1 \
    --mm-encoder-tp-mode data
  ```

  Docker (the image entrypoint is `vllm serve`):

  ```bash
  docker run \
    --privileged --ipc=host -p 8000:8000 \
    -v ~/.cache/huggingface:/root/.cache/huggingface \
    vllm/vllm-openai-cpu:latest-x86_64 Qwen/Qwen3-VL-30B-A3B-Instruct \
    --tensor-parallel-size 1 \
    --mm-encoder-tp-mode data
  ```

  The example uses TP=1. Adjust TP/DP based on system topology; NUMA binding is
  intentionally not hard-coded in the recipe.

  ## Ascend 950DT

  Select **Ascend 950DT**, **W8A8 (Ascend MXFP8)** and **Tensor + Expert
  Parallel** for the single-node TP8 configuration. Expand **Install** and run
  the container preparation command on the host, then run the generated
  `vllm serve` command inside that container. If already inside a prepared Ascend
  container, skip Install. The pinned image uses the public ModelScope checkpoint;
  the preparation command mounts both ModelScope and Hugging Face caches.
  The reference configuration serves one image per prompt, disables video,
  and caps context at 32K. Encoder data parallelism is opt-in on this hardware.

  [Runtime verification](https://github.com/vllm-ascend/vllm-ascend-recipes/actions/runs/33243667020/job/99077266543)
  covered server startup, model discovery and an image chat-completions request
  on eight 96 GB NPUs. This is a functional check, not a performance comparison.

  ## Configuration Notes

  - TP/DP values and topology-specific CPU binding remain deployment choices.

  ## Runtime and Platform Tuning

  The following settings are intentionally not prescribed as portable CPU model
  defaults because they depend on the workload, hardware, or runtime environment:

  - `--max-num-batched-tokens`: scheduler/throughput tuning.
  - `--max-num-seqs`: concurrency and scheduler-capacity tuning.
  - `--gpu-memory-utilization`: platform memory-budget tuning.
  - `--no-enable-prefix-caching`: workload/benchmark cache-policy tuning.
  - `VLLM_ENGINE_ITERATION_TIMEOUT_S`: operational runtime timeout.

  These settings may still appear in validated hardware-specific overrides. Tune
  them at deployment time based on platform resources, workload shape, and
  latency/throughput goals.

  ## References

  - [Model card](https://huggingface.co/Qwen/Qwen3-VL-30B-A3B-Instruct)
  - [Ascend W8A8/MXFP8 checkpoint](https://modelscope.cn/models/Eco-Tech/Qwen3-VL-30B-A3B-Instruct-w8a8-mxfp8)
  - [vLLM CPU installation](https://docs.vllm.ai/en/latest/getting_started/installation/cpu/)
