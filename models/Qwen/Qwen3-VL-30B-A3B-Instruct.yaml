meta:
  title: "Qwen3-VL-30B-A3B-Instruct"
  slug: "qwen3-vl-30b-a3b-instruct"
  provider: "Qwen"
  description: "Qwen3-VL MoE vision-language model with 30B total / 3B active parameters, validated for BF16 image/video serving on Intel Xeon 6 and Huawei Ascend 910C."
  date_added: 2026-08-17
  date_updated: 2026-10-19
  difficulty: intermediate
  tasks:
    - multimodal
    - text
  performance_headline: "Validated BF16 on Intel Xeon 6 and Huawei Ascend 910C (Atlas 800 A3)"
  related_recipes:
    - "Qwen/Qwen3-VL-235B-A22B-Instruct"
  hardware:
    xeon6: verified
    ascend_910c: verified

model:
  model_id: "Qwen/Qwen3-VL-30B-A3B-Instruct"
  min_vllm_version: "0.11.0"
  architecture: moe
  parameter_count: "30B"
  active_parameters: "3B"
  context_length: 262144
  base_args: []
  base_env: {}

dependencies:
  - note: "Recommended for offline multimodal inference (image/video pre-processing helpers)"
    command: "uv pip install qwen-vl-utils==0.0.14"
    optional: true

features:
  text_only:
    description: "Skip loading the vision encoder for text-only workloads — frees memory for KV cache."
    args:
      - "--language-model-only"
  encoder_parallel:
    description: "Run the vision encoder in data-parallel mode."
    args:
      - "--mm-encoder-tp-mode"
      - "data"

opt_in_features:
  - text_only

variants:
  default:
    precision: bf16
    vram_minimum_gb: 72
    description: "Full precision BF16"
    supported_hardware:
      - xeon6
  ascend_bf16:
    model_id: "Qwen/Qwen3-VL-30B-A3B-Instruct"
    label: "BF16 (Ascend A3)"
    precision: bf16
    vram_minimum_gb: 72
    description: "Full precision BF16 checkpoint for one Atlas 800 A3 node (16x Ascend 910C, 64 GB each), using TP2 + expert parallelism."
    supported_hardware: [ascend_910c]
    tp: 2
    min_vllm_version: "0.23.0"
    extra_args:
      - "--data-parallel-size"
      - "1"
      - "--enable-expert-parallel"
      - "--seed"
      - "1024"
      - "--max-num-seqs"
      - "32"
      - "--max-model-len"
      - "32768"
      - "--max-num-batched-tokens"
      - "16384"
      - "--gpu-memory-utilization"
      - "0.9"
      - "--no-enable-prefix-caching"
      - "--mm-processor-cache-gb"
      - "0"
      - "--limit-mm-per-prompt"
      - '{"image":1,"video":0}'
      - "--compilation-config"
      - '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[1,2,4,8,16,24,32]}'
      - "--additional-config"
      - '{"enable_fused_mc2":1}'
    extra_env:
      VLLM_USE_MODELSCOPE: "True"
      HCCL_BUFFSIZE: "1024"
      HCCL_OP_EXPANSION_MODE: "AIV"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
    hardware_overrides:
      ascend_910c:
        docker_image: "quay.io/ascend/vllm-ascend:v0.23.0-a3"

compatible_strategies:
  - single_node_tp
  - single_node_tep
  - single_node_dep
  - multi_node_tp
  - multi_node_tp_pp
  - multi_node_dep
  - multi_node_tep

kv_offload_support:
  offloading_cpu: verified
  offloading_fs: verified

hardware_overrides: {}

strategy_overrides: {}

guide: |
  ## Overview

  Qwen3-VL-30B-A3B-Instruct is a multimodal Qwen3-VL MoE model. This recipe
  includes an Intel Xeon 6 BF16 configuration and a verified BF16 variant for
  one Atlas 800 A3 node (16x Ascend 910C, 64 GB each).

  ## Prerequisites

  - Hardware: Intel Xeon 6 CPUs, or one Atlas 800 A3 node (16x Ascend 910C,
    64 GB each)
  - vLLM >= 0.11.0 for Intel Xeon 6; vLLM Ascend >= 0.23.0 for Ascend 910C

  ### pip (Intel Xeon 6 CPUs)

  For Intel and AMD x86 CPUs, follow the
  [CPU pre-built wheels](https://docs.vllm.ai/en/latest/getting_started/installation/cpu/#pre-built-wheels)
  installation instructions.

  ### Docker (Intel Xeon 6 CPUs)

  ```bash
  docker pull vllm/vllm-openai-cpu:latest-x86_64
  ```

  ## Intel Xeon 6

  ```bash
  vllm serve Qwen/Qwen3-VL-30B-A3B-Instruct \
    --tensor-parallel-size 1 \
    --mm-encoder-tp-mode data
  ```

  Docker (the image entrypoint is `vllm serve`):

  ```bash
  docker run \
    --privileged --ipc=host -p 8000:8000 \
    -v ~/.cache/huggingface:/root/.cache/huggingface \
    vllm/vllm-openai-cpu:latest-x86_64 Qwen/Qwen3-VL-30B-A3B-Instruct \
    --tensor-parallel-size 1 \
    --mm-encoder-tp-mode data
  ```

  The example uses TP=1. Adjust TP/DP based on system topology; NUMA binding is
  intentionally not hard-coded in the recipe.

  ## Huawei Ascend 910C / Atlas 800 A3

  Verified on a single Atlas 800 A3 node (16x Ascend 910C, 64 GB each) with
  vLLM Ascend v0.23.0 from `quay.io/ascend/vllm-ascend:v0.23.0-a3`.

  Start a container on the host:

  ```bash
  docker pull quay.io/ascend/vllm-ascend:v0.23.0-a3
  docker run --rm -it \
    --privileged --net=host --shm-size=512g \
    --device /dev/davinci0 --device /dev/davinci1 \
    --device /dev/davinci2 --device /dev/davinci3 \
    --device /dev/davinci4 --device /dev/davinci5 \
    --device /dev/davinci6 --device /dev/davinci7 \
    --device /dev/davinci8 --device /dev/davinci9 \
    --device /dev/davinci10 --device /dev/davinci11 \
    --device /dev/davinci12 --device /dev/davinci13 \
    --device /dev/davinci14 --device /dev/davinci15 \
    --device /dev/davinci_manager --device /dev/devmm_svm \
    --device /dev/hisi_hdc \
    -v /usr/local/dcmi:/usr/local/dcmi \
    -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
    -v /usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64 \
    -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
    -v /etc/ascend_install.info:/etc/ascend_install.info \
    -v /etc/hccn.conf:/etc/hccn.conf \
    -v /root/.cache:/root/.cache \
    quay.io/ascend/vllm-ascend:v0.23.0-a3 bash
  ```

  Image-only online serving with TP2 + expert parallelism:

  ```bash
  export VLLM_USE_MODELSCOPE=True
  export HCCL_BUFFSIZE=1024
  export HCCL_OP_EXPANSION_MODE=AIV
  export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

  vllm serve Qwen/Qwen3-VL-30B-A3B-Instruct \
    --host 0.0.0.0 \
    --port 8000 \
    --served-model-name qwen3-vl-30b \
    --data-parallel-size 1 \
    --tensor-parallel-size 2 \
    --enable-expert-parallel \
    --seed 1024 \
    --max-num-seqs 32 \
    --max-model-len 32768 \
    --max-num-batched-tokens 16384 \
    --gpu-memory-utilization 0.9 \
    --no-enable-prefix-caching \
    --mm-processor-cache-gb 0 \
    --limit-mm-per-prompt.image 1 \
    --limit-mm-per-prompt.video 0 \
    --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[1,2,4,8,16,24,32]}' \
    --additional-config '{"enable_fused_mc2":1}'
  ```

  Video serving raises the context limit and lowers concurrency to leave HBM
  headroom. Mount the video directory to `/media` and allow that path:

  ```bash
  export VLLM_USE_MODELSCOPE=True
  export HCCL_BUFFSIZE=1024
  export HCCL_OP_EXPANSION_MODE=AIV
  export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

  vllm serve Qwen/Qwen3-VL-30B-A3B-Instruct \
    --host 0.0.0.0 \
    --port 8000 \
    --served-model-name qwen3-vl-30b \
    --data-parallel-size 1 \
    --tensor-parallel-size 2 \
    --enable-expert-parallel \
    --seed 1024 \
    --max-num-seqs 8 \
    --max-model-len 128000 \
    --max-num-batched-tokens 4096 \
    --gpu-memory-utilization 0.9 \
    --no-enable-prefix-caching \
    --mm-processor-cache-gb 0 \
    --limit-mm-per-prompt.image 1 \
    --limit-mm-per-prompt.video 1 \
    --allowed-local-media-path /media \
    --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[1,2,4,8,16,24,32]}' \
    --additional-config '{"enable_fused_mc2":1}'
  ```

  Functional graph validation uses TP1 + PP2 and a short context. On vLLM
  v0.23.0, multimodal checkpoints do not populate
  `text_config.architectures`, so the PP capability check needs an explicit
  override:

  ```bash
  export VLLM_USE_MODELSCOPE=True
  export HCCL_BUFFSIZE=1024
  export HCCL_OP_EXPANSION_MODE=AIV
  export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

  vllm serve Qwen/Qwen3-VL-30B-A3B-Instruct \
    --host 0.0.0.0 \
    --port 8000 \
    --served-model-name qwen3-vl-30b \
    --data-parallel-size 1 \
    --tensor-parallel-size 1 \
    --pipeline-parallel-size 2 \
    --enable-expert-parallel \
    --seed 1024 \
    --max-num-seqs 8 \
    --max-model-len 4096 \
    --max-num-batched-tokens 1024 \
    --gpu-memory-utilization 0.9 \
    --no-enable-prefix-caching \
    --mm-processor-cache-gb 0 \
    --limit-mm-per-prompt.image 1 \
    --limit-mm-per-prompt.video 0 \
    --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[1,2,4,8,16,24,32]}' \
    --additional-config '{"enable_fused_mc2":1}' \
    --hf-overrides '{"text_config":{"architectures":["Qwen3MoeForCausalLM"]}}'
  ```

  Notes:

  - `enable_fused_mc2` is A3-specific; keep `HCCL_BUFFSIZE=1024` and
    `--mm-processor-cache-gb 0` for these validated configurations.
  - Image-only serving disables video inputs to reserve HBM for visual tokens
    and KV cache.
  - AISBench `mmmu_val` with `acc,none` in generation mode scored **66.22**
    overall on the full 900-question set (the tutorial reference is 0.58).
    AISBench passes images as local `file://` paths, so add
    `--allowed-local-media-path <MMMU_images directory>` for that run.

  ## Configuration Notes

  - TP/DP values and topology-specific CPU binding remain deployment choices.

  ## Runtime and Platform Tuning

  The following settings are intentionally not prescribed as portable CPU model
  defaults because they depend on the workload, hardware, or runtime environment:

  - `--max-num-batched-tokens`: scheduler/throughput tuning.
  - `--max-num-seqs`: concurrency and scheduler-capacity tuning.
  - `--gpu-memory-utilization`: platform memory-budget tuning.
  - `--no-enable-prefix-caching`: workload/benchmark cache-policy tuning.
  - `VLLM_ENGINE_ITERATION_TIMEOUT_S`: operational runtime timeout.

  These settings may still appear in validated hardware-specific overrides. Tune
  them at deployment time based on platform resources, workload shape, and
  latency/throughput goals.

  ## References

  - [Model card](https://huggingface.co/Qwen/Qwen3-VL-30B-A3B-Instruct)
  - [Ascend BF16 checkpoint](https://modelscope.cn/models/Qwen/Qwen3-VL-30B-A3B-Instruct)
  - [vLLM Ascend Qwen3-VL tutorial](https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/Qwen3-VL-30B-A3B-Instruct.html)
  - [vLLM CPU installation](https://docs.vllm.ai/en/latest/getting_started/installation/cpu/)
