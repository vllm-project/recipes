meta:
  title: "Qwen3-VL-30B-A3B-Instruct"
  slug: "qwen3-vl-30b-a3b-instruct"
  provider: "Qwen"
  description: "Qwen3-VL MoE vision-language model with 30B total / 3B active parameters, supporting image, video, and text workloads."
  date_added: 2026-08-17
  date_updated: 2026-08-17
  difficulty: intermediate
  tasks:
    - multimodal
    - text
  performance_headline: "Validated on Intel Xeon 6 CPU with BF16 serving"
  related_recipes:
    - "Qwen/Qwen3-VL-235B-A22B-Instruct"
  hardware:
    xeon6: verified

model:
  model_id: "Qwen/Qwen3-VL-30B-A3B-Instruct"
  min_vllm_version: "0.11.0"
  architecture: moe
  parameter_count: "30B"
  active_parameters: "3B"
  context_length: 262144
  base_args: []
  base_env: {}

dependencies:
  - note: "Recommended for offline multimodal inference (image/video pre-processing helpers)"
    command: "uv pip install qwen-vl-utils==0.0.14"
    optional: true

features:
  text_only:
    description: "Skip loading the vision encoder for text-only workloads — frees memory for KV cache."
    args:
      - "--language-model-only"
  encoder_parallel:
    description: "Run the vision encoder in data-parallel mode."
    args:
      - "--mm-encoder-tp-mode"
      - "data"

opt_in_features:
  - text_only

variants:
  default:
    precision: bf16
    vram_minimum_gb: 72
    description: "Full precision BF16"

compatible_strategies:
  - single_node_tp
  - single_node_tep
  - single_node_dep
  - multi_node_tp
  - multi_node_tp_pp
  - multi_node_dep
  - multi_node_tep

kv_offload_support:
  offloading_cpu: verified
  offloading_fs: verified

hardware_overrides:
  cpu:
    extra_args:
      - "--max-num-batched-tokens"
      - "16384"
      - "--gpu-memory-utilization"
      - "0.8"
      - "--enforce-eager"

strategy_overrides: {}

guide: |
  ## Overview

  Qwen3-VL-30B-A3B-Instruct is a multimodal Qwen3-VL MoE model. Intel Xeon 6
  CPU serving was validated with BF16; the model-specific validation row adds
  `--enforce-eager`.

  ## Prerequisites

  - Hardware: 2x Xeon 6 CPUs
  - vLLM >= 0.11.0

  ### pip (Intel Xeon 6 CPUs)

  For Intel and AMD x86 CPUs, follow the
  [CPU pre-built wheels](https://docs.vllm.ai/en/latest/getting_started/installation/cpu/#pre-built-wheels)
  installation instructions, or use:

  ```bash
  docker pull vllm/vllm-openai-cpu:latest-x86_64
  ```

  ## Intel Xeon 6

  ```bash
  vllm serve Qwen/Qwen3-VL-30B-A3B-Instruct \
    --max-num-batched-tokens 16384 \
    --gpu-memory-utilization 0.8 \
    --enforce-eager
  ```

  Choose tensor parallelism based on system topology; TP/DP and NUMA binding
  are intentionally not hard-coded in the recipe.

  ## Configuration Notes

  - `--enforce-eager` is retained because it is the only row-specific extra argument in the validated serving manifest for this model.
  - Benchmark-only prefix-cache disabling and extended engine timeouts are not required for general serving.

  ## References

  - [Model card](https://huggingface.co/Qwen/Qwen3-VL-30B-A3B-Instruct)
  - [vLLM CPU installation](https://docs.vllm.ai/en/latest/getting_started/installation/cpu/)
