  provider: "Qwen"
  description: "Qwen3-VL-Reranker-2B — a 2B vision-language reranker producing relevance scores for query-document pairs across text and multimodal inputs; single-card pooling serving on Ascend 910B with vLLM Ascend"
  date_added: 2026-10-14
  date_updated: 2026-10-14
  tasks:
    - multimodal
  performance_headline: "Single-card pooling serving on Ascend 910B (Atlas 800I A2) with vLLM Ascend"
  hardware:
    ascend_910b: verified

model:
  model_id: "Qwen/Qwen3-VL-Reranker-2B"
  min_vllm_version: "0.9.2"
  architecture: dense
  parameter_count: "2B"
  active_parameters: "2B"
  context_length: 32768
  base_args:
    - "--runner"
    - "pooling"
    - "--hf_overrides"
    - '{"architectures": ["Qwen3VLForSequenceClassification"],"classifier_from_token": ["no", "yes"],"is_original_qwen3_reranker": true}'
  base_env: {}
  docker_image:
    ascend_910b: "quay.io/ascend/vllm-ascend:v0.30.0rc2"

variants:
  default:
    precision: bf16
    vram_minimum_gb: 5
    supported_hardware: [ascend_910b]
    hardware_overrides:
      ascend_910b:
        docker_image: "quay.io/ascend/vllm-ascend:v0.30.0rc2"
        install:
          pip: false
        extra_args:
          - "--max-model-len"
          - "1024"
    description: "BF16 checkpoint on a single 64 GB Ascend 910B NPU (pooling with sequence-classification hf_overrides), verified end-to-end with vLLM Ascend"

compatible_strategies:
  - single_node_tp

hardware_overrides: {}
strategy_overrides: {}

dependencies: []

guide: |
  ## Overview

  Qwen3-VL-Reranker-2B is a vision-language reranking model in the Qwen3 series. It produces
  relevance scores for query-document pairs across text and multimodal inputs, suitable for
  search, retrieval, and RAG pipelines. vLLM Ascend 0.9.2rc1 and higher supports this model.

  ## Prerequisites

  - **Hardware:** 1x Ascend 910B NPU (64 GB HBM), Atlas 800I A2 series
  - **Runtime:** official vLLM Ascend Docker image (Ascend installs are docker-only —
    there is no official pip wheel):

    ```bash
    docker pull quay.io/ascend/vllm-ascend:v0.30.0rc2
    ```

  - **Checkpoint:** download the BF16 weights and record the local path

    ```bash
    pip install modelscope
    modelscope download --model Qwen/Qwen3-VL-Reranker-2B
    ```

  ## Launching the Server

  ### Single Ascend 910B (pooling)

  Start the container with the NPU devices mounted, then serve the model in pooling mode with
  the sequence-classification overrides required by this model family:

  ```bash
  export IMAGE=quay.io/ascend/vllm-ascend:v0.30.0rc2

  docker run --rm \
      --name vllm-ascend \
      --shm-size=1g \
      --net=host \
      --privileged=true \
      --device /dev/davinci0 \
      --device /dev/davinci_manager \
      --device /dev/devmm_svm \
      --device /dev/hisi_hdc \
      -v /usr/local/dcmi:/usr/local/dcmi \
      -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool \
      -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
      -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
      -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
      -v /etc/ascend_install.info:/etc/ascend_install.info \
      -v /root/.cache:/root/.cache \
      -it $IMAGE bash
  ```

  ```bash
  vllm serve /root/.cache/models/Qwen3-VL-Reranker-2B \
      --served-model-name Qwen/Qwen3-VL-Reranker-2B \
      --runner pooling \
      --hf_overrides '{"architectures": ["Qwen3VLForSequenceClassification"],"classifier_from_token": ["no", "yes"],"is_original_qwen3_reranker": true}' \
      --port 8000 \
      --max-model-len 1024
  ```

  > `--max-model-len` must stay an explicit conservative value (e.g. 1024): a large
  > automatically-resolved context allocates an O(max_model_len^2) attention mask and can
  > OOM the NPU.

  ## Verifying the Deployment

  ```bash
  curl http://localhost:8000/v1/rerank \
      -X POST \
      -d '{"query":"What is the capital of China?", "documents": ["The capital of China is Beijing.", "Gravity is a force that attracts two bodies towards each other. It gives weight to physical objects and is responsible for the movement of planets around the sun."]}' \
      -H 'Content-Type: application/json'
  ```

  Expected result: HTTP 200 with a `results[]` list carrying `relevance_score` per document;
  the capital-of-China document should score much higher than the gravity document
  (tutorial reference: 0.721 vs 0.189).

  For more usage examples see the [score examples](https://github.com/vllm-project/vllm/tree/main/examples/pooling/score).

  ## Accuracy Evaluation (MTEB)

  Run the evaluation with [MTEB](https://docs.mteb.org/):

  ```python
  import os

  from mteb.models.vllm_wrapper import VllmCrossEncoderWrapper

  if __name__ == "__main__":
      import mteb

      data_path = "/home/data/mteb_data"
      os.environ["HF_DATASETS_CACHE"] = data_path
      os.environ["HF_ENDPOINT"] = "https://hf-mirror.com"

      model = VllmCrossEncoderWrapper("/root/.cache/Qwen3-VL-Reranker-2B",
                                  revision="norm",
                                  dtype="float16",
                                  enforce_eager=True,
                                  max_model_len=10240,
                                  hf_overrides={"architectures": ["Qwen3VLForSequenceClassification"],"classifier_from_token": ["no", "yes"],"is_original_qwen3_reranker": True})

      cache = mteb.ResultCache(data_path)
      tasks = mteb.get_tasks(
          task_types=["Reranking"],
          languages=["zho"]
      )
      tasks = mteb.get_tasks(tasks=["MultiLongDocReranking"])
      results = mteb.evaluate(model, tasks=tasks, cache=cache, overwrite_strategy="always")
      print(results)
  ```

  ## Performance Evaluation

  ```bash
  vllm bench serve --model Qwen/Qwen3-VL-Reranker-2B --backend vllm-rerank --port 8000 --dataset-name random-rerank --endpoint /v1/rerank --random-input 200 --save-result --result-dir ./
  ```

  Measured on 1x Ascend 910B 64GB (vllm-ascend v0.30.0rc2 image): 1000/1000 requests
  succeeded, 0 failed; request throughput 5.00 req/s, mean E2E latency 42.36 ms.

