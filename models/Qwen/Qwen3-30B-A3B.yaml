meta:
  title: "Qwen3-30B-A3B"
  slug: "qwen3-30b-a3b"
  provider: "Qwen"
  description: "Qwen3 MoE model with 30.5B total and 3.3B active parameters, validated for BF16 serving on Intel Xeon 6 and W8A8 serving on Huawei Atlas 800I A2."
  date_added: 2026-08-14
  date_updated: 2026-09-02
  difficulty: intermediate
  tasks:
    - text
  performance_headline: "Validated on Intel Xeon 6 (GNR) with BF16 serving and Atlas 800I A2 with W8A8 serving"
  related_recipes:
    - "Qwen/Qwen3-235B-A22B-Instruct-2507"
  hardware:
    xeon6: verified
    ascend_910b_8x: verified

model:
  model_id: "Qwen/Qwen3-30B-A3B"
  min_vllm_version: "0.8.5"
  architecture: moe
  parameter_count: "30.5B"
  active_parameters: "3.3B"
  context_length: 40960
  base_args: []
  base_env: {}

features:
  tool_calling:
    description: "Enable automatic tool choice with the Hermes parser"
    args:
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "hermes"
  reasoning:
    description: "Enable Qwen3 thinking mode with the Qwen3 reasoning parser"
    args:
      - "--reasoning-parser"
      - "qwen3"

opt_in_features: []

variants:
  default:
    precision: bf16
    vram_minimum_gb: 74
    description: "Full precision BF16"
  ascend_w8a8:
    model_id: "Eco-Tech/Qwen3-30B-A3B-w8a8"
    precision: int8
    label: "W8A8 (Ascend)"
    vram_minimum_gb: 37
    supported_hardware: [ascend_910b_8x]
    tp:
      ascend_910b_8x: 4
    extra_args:
      - "--quantization"
      - "ascend"
      - "--enable-expert-parallel"
      - "--distributed-executor-backend"
      - "mp"
    extra_env:
      HCCL_BUFFSIZE: "1024"
      OMP_PROC_BIND: "false"
      OMP_NUM_THREADS: "1"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
    hardware_overrides:
      ascend_910b_8x:
        docker_image: "quay.io/ascend/vllm-ascend:v0.23.0rc1"
    description: "ModelSlim INT8 W8A8 for Atlas 800I A2. Validated with TP4; requires --quantization ascend."

compatible_strategies:
  - single_node_tp
  - multi_node_tp

hardware_overrides:
  cpu:
    extra_args:
      - "--max-num-batched-tokens"
      - "16384"
      - "--gpu-memory-utilization"
      - "0.8"

strategy_overrides: {}

guide: |
  ## Overview

  Qwen3-30B-A3B is a mixture-of-experts Qwen3 model with 30.5B total parameters
  and 3.3B active parameters per token. This recipe includes an Intel Xeon 6 CPU
  configuration validated with BF16 serving.

  ## Prerequisites

  - Hardware: 4x Xeon 6 CPUs.
  - vLLM >= 0.8.5

  ### pip (Intel Xeon 6 CPUs)

  For Intel and AMD x86 CPUs, follow the
  [CPU pre-built wheels](https://docs.vllm.ai/en/latest/getting_started/installation/cpu/#pre-built-wheels)
  installation instructions.

  ### Docker (Intel Xeon 6 CPUs)

  ```bash
  docker pull vllm/vllm-openai-cpu:latest-x86_64
  ```

  ## Intel Xeon 6

  Choose the tensor parallel size based on the system topology and deployment
  requirements. Add `--tensor-parallel-size <N>` when needed; the recipe does
  not prescribe a Xeon 6 TP value or hard-code NUMA node IDs.

  ```bash
  vllm serve Qwen/Qwen3-30B-A3B \
    --max-num-batched-tokens 16384 \
    --gpu-memory-utilization 0.8
  ```

  Docker:

  ```bash
  docker run -itd --name qwen3-30b-a3b-cpu \
    --network host \
    --shm-size 16g \
    -v ~/.cache/huggingface:/root/.cache/huggingface \
    vllm/vllm-openai-cpu:latest-x86_64 \
      --model Qwen/Qwen3-30B-A3B \
      --max-num-batched-tokens 16384 \
      --gpu-memory-utilization 0.8 \
      --host 0.0.0.0 \
      --port 8000
  ```

  ## Huawei Atlas 800I A2 (8× Ascend 910B)

  The validated Ascend path uses the ModelSlim W8A8 checkpoint on four of the
  eight Ascend 910B NPUs (TP4), vLLM Ascend 0.23.0rc1, and the
  `quay.io/ascend/vllm-ascend:v0.23.0rc1` image. The checkpoint is hosted on
  ModelScope, so set `VLLM_USE_MODELSCOPE=True` before serving it.

  ```bash
  export VLLM_USE_MODELSCOPE=True
  export HCCL_BUFFSIZE=1024
  export OMP_PROC_BIND=false
  export OMP_NUM_THREADS=1
  export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

  vllm serve Eco-Tech/Qwen3-30B-A3B-w8a8 \
    --tensor-parallel-size 4 \
    --enable-expert-parallel \
    --distributed-executor-backend mp \
    --quantization ascend
  ```

  Verify the OpenAI-compatible server after it becomes ready:

  ```bash
  curl http://localhost:8000/v1/models
  curl http://localhost:8000/v1/chat/completions \
    -H "Content-Type: application/json" \
    -d '{"model":"Eco-Tech/Qwen3-30B-A3B-w8a8","messages":[{"role":"user","content":"Give one sentence about tensor parallelism."}]}'
  ```
  ## Client Usage

  ```python
  from openai import OpenAI

  client = OpenAI(base_url="http://localhost:8000/v1", api_key="unused")
  response = client.chat.completions.create(
      model="Qwen/Qwen3-30B-A3B",
      messages=[{"role": "user", "content": "Explain tensor parallelism briefly."}],
  )
  print(response.choices[0].message.content)
  ```

  ## References

  - [Model card](https://huggingface.co/Qwen/Qwen3-30B-A3B)
  - [Ascend W8A8 checkpoint (ModelScope)](https://www.modelscope.cn/models/Eco-Tech/Qwen3-30B-A3B-w8a8)
  - [vLLM CPU installation](https://docs.vllm.ai/en/latest/getting_started/installation/cpu/)
  - [vLLM Ascend documentation](https://docs.vllm.ai/projects/ascend/en/latest/)
