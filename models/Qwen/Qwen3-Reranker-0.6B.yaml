guide: |
  ## Overview

  [Qwen/Qwen3-Reranker-0.6B](https://huggingface.co/Qwen/Qwen3-Reranker-0.6B)
  is a text reranker from the Qwen3 series. Serve it with the vLLM pooling runner
  and call `/v1/rerank`. On Ascend A3, use the A3-tagged vLLM Ascend image or the
  A3 variant wheel.

  ## Prerequisites

  - Hardware: Atlas 800 A3 / Ascend 910C (single NPU is enough for 0.6B)
  - vLLM Ascend >= 0.9.2rc1 (verified with v0.23.0 A3 package)

  ### Install (Ascend A3 Docker)

  ```bash
  export IMAGE=quay.io/ascend/vllm-ascend:v0.23.0-a3
  docker run --rm --net=host --shm-size=1g --privileged \
    --device /dev/davinci0 --device /dev/davinci_manager \
    --device /dev/devmm_svm --device /dev/hisi_hdc \
    -v /usr/local/Ascend/driver:/usr/local/Ascend/driver \
    -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
    -v /root/.cache:/root/.cache \
    -it $IMAGE bash
  ```

  ## Launch command

  ```bash
  vllm serve Qwen/Qwen3-Reranker-0.6B \
    --served-model-name Qwen/Qwen3-Reranker-0.6B \
    --runner pooling \
    --hf_overrides '{"architectures": ["Qwen3ForSequenceClassification"],"classifier_from_token": ["no", "yes"],"is_original_qwen3_reranker": true}' \
    --port 8000 \
    --max-model-len 1024
  ```

  ## Rerank API

  Format query/document with the official chat template for best scores, then:

  ```bash
  curl -X POST http://localhost:8000/v1/rerank \
    -H "Content-Type: application/json" \
    -d '{
      "model": "Qwen/Qwen3-Reranker-0.6B",
      "query": "<templated query>",
      "documents": ["<templated doc A>", "<templated doc B>"]
    }'
  ```

  Expected: HTTP 200 with `relevance_score` per document.

  ## References

  - [Qwen3-Reranker-0.6B on Hugging Face](https://huggingface.co/Qwen/Qwen3-Reranker-0.6B)
  - [vLLM Ascend Qwen3-Reranker tutorial](https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/Qwen3-Reranker.html)
  - [vLLM Ascend recipes](https://vllm-ascend.github.io/vllm-ascend-recipes/)
