guide: |
  ## Overview

  Qwen3-VL-Embedding-2B is a vision-language embedding model in the Qwen3 series. It produces
  vector representations for text and multimodal inputs, supporting retrieval, clustering, and
  similarity ranking across text, image, video, and mixed-modality content. vLLM Ascend
  0.9.2rc1 and higher supports this model.

  ## Prerequisites

  - **Hardware:** 1x Ascend 910B NPU (64 GB HBM), Atlas 800I A2 series
  - **Runtime:** official vLLM Ascend Docker image (Ascend installs are docker-only —
    there is no official pip wheel):

    ```bash
    docker pull quay.io/ascend/vllm-ascend:v0.30.0rc2
    ```

  - **Checkpoint:** download the BF16 weights and record the local path

    ```bash
    pip install modelscope
    modelscope download --model Qwen/Qwen3-VL-Embedding-2B
    ```

  ## Launching the Server

  ### Single Ascend 910B (pooling)

  Start the container with the NPU devices mounted, then serve the model in pooling mode:

  ```bash
  export IMAGE=quay.io/ascend/vllm-ascend:v0.30.0rc2

  docker run --rm \
      --name vllm-ascend \
      --shm-size=1g \
      --net=host \
      --privileged=true \
      --device /dev/davinci0 \
      --device /dev/davinci_manager \
      --device /dev/devmm_svm \
      --device /dev/hisi_hdc \
      -v /usr/local/dcmi:/usr/local/dcmi \
      -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool \
      -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
      -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
      -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
      -v /etc/ascend_install.info:/etc/ascend_install.info \
      -v /root/.cache:/root/.cache \
      -it $IMAGE bash
  ```

  ```bash
  vllm serve /root/.cache/models/Qwen/Qwen3-VL-Embedding-2B \
      --served-model-name Qwen/Qwen3-VL-Embedding-2B \
      --runner pooling \
      --port 8000 \
      --max-model-len 1024
  ```

  > `--max-model-len` must stay an explicit conservative value (e.g. 1024): a large
  > automatically-resolved context allocates an O(max_model_len^2) attention mask and can
  > OOM the NPU.

  ## Verifying the Deployment

  ```bash
  curl -X POST http://localhost:8000/v1/embeddings -H "Content-Type: application/json" -d '{
    "input": [
      "The capital of China is Beijing.",
      "Gravity is a force that attracts two bodies towards each other. It gives weight to physical objects and is responsible for the movement of planets around the sun."
    ]
  }'
  ```

  Expected result: HTTP 200 with a JSON response whose `data[]` entries carry `embedding`
  vectors. For more usage examples see the [embedding examples](https://github.com/vllm-project/vllm/tree/main/examples/pooling/embed).

  ## Accuracy Evaluation (MTEB)

  Run the evaluation with [MTEB](https://docs.mteb.org/):

  ```python
  import os
  import mteb

  from mteb.models.vllm_wrapper import VllmEncoderWrapper

  if __name__ == "__main__":
      data_path = "/home/data/mteb_data"
      os.environ["HF_DATASETS_CACHE"] = data_path
      os.environ["HF_ENDPOINT"] = "https://hf-mirror.com"

      model = VllmEncoderWrapper("/root/.cache/Qwen3-VL-Embedding-2B",
                                  revision="norm",
                                  dtype="float16",
                                  max_model_len=10240,
                                  )

      cache = mteb.ResultCache(data_path)
      tasks = mteb.get_tasks(tasks=["LeCaRDv2"])
      results = mteb.evaluate(model, tasks=tasks, cache=cache, encode_kwargs={"batch_size": 2}, overwrite_strategy="always")
      df = results.to_dataframe()
      print(df)
  ```

  ## Performance Evaluation

  ```bash
  vllm bench serve --model Qwen/Qwen3-VL-Embedding-2B --backend openai-embeddings --port 8000 --dataset-name random --endpoint /v1/embeddings --random-input 200 --save-result --result-dir ./
  ```

  Measured on 1x Ascend 910B 64GB (vllm-ascend v0.30.0rc2 image): 1000/1000 requests
  succeeded, 0 failed; total token throughput 999.75 tok/s, request throughput 5.00 req/s,
  mean E2E latency 46.60 ms (P99 121.97 ms).

