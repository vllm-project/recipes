guide: |
  ## Overview

  Qwen3-VL-Embedding-2B produces vectors for text and mixed multimodal inputs (retrieval, clustering, similarity). This guide records a verified single-card pooling serve on Atlas 300I DUO (310P) with vLLM 0.23.0 and vLLM Ascend 0.23.0. Atlas 800I A2 commands from the official tutorial are included as an untested reference on this page.

  ## Prerequisites

  - **Hardware:** one Atlas 300I DUO die (310P3, about 44 GB HBM). The verified run used about 21 GB.
  - **Runtime:** `quay.io/ascend/vllm-ascend:v0.23.0-310p`, or a matching vLLM Ascend 0.23.0 install. On 310P, uninstall `triton` / `triton-ascend` if present.
  - **Checkpoint:**

    ```bash
    pip install modelscope
    modelscope download --model Qwen/Qwen3-VL-Embedding-2B
    ```

  ## Launching the Server

  ### Atlas 300I DUO (verified)

  ```bash
  export ASCEND_RT_VISIBLE_DEVICES=0
  export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

  vllm serve Qwen/Qwen3-VL-Embedding-2B \
    --served-model-name Qwen/Qwen3-VL-Embedding-2B \
    --runner pooling \
    --dtype float16 \
    --max-model-len 1024 \
    --compilation-config '{"cudagraph_capture_sizes": [1024,512]}' \
    --additional-config '{"ascend_compilation_config": {"fuse_norm_quant": false}}' \
    --port 8000
  ```

  `--runner pooling` is required (`Supported tasks: ['token_embed', 'embed']`). Keep `--max-model-len` explicit so 310P does not allocate an oversized attention mask. `No module named 'triton'` is expected. Limit cudagraph capture sizes because 310P has fewer hardware streams.

  ### Atlas 800I A2 (tutorial reference, not verified here)

  ```bash
  vllm serve Qwen/Qwen3-VL-Embedding-2B \
    --served-model-name Qwen/Qwen3-VL-Embedding-2B \
    --runner pooling \
    --max-model-len 1024 \
    --port 8000
  ```

  ## Client Usage

  ```bash
  curl -sS http://localhost:8000/v1/embeddings \
    -H "Content-Type: application/json" \
    -d '{
      "model": "Qwen/Qwen3-VL-Embedding-2B",
      "input": [
        "The capital of China is Beijing.",
        "Gravity is a force that attracts two bodies towards each other. It gives weight to physical objects and is responsible for the movement of planets around the sun."
      ]
    }'
  ```

  On the verified 310P3 host this returned HTTP 200, two vectors of dimension 2048, and `usage.prompt_tokens` 39. The leading values match the official tutorial sample: `-0.028474265709519386`, `-0.02678542211651802` and `-0.016785264015197754`, `-0.003787524998188019`.

  ## Troubleshooting

  - **Startup OOM:** set `--max-model-len 1024` and `--dtype float16`.
  - **Not an embeddings response:** restart with `--runner pooling`.
  - **Benchmark:** `vllm bench serve --model Qwen/Qwen3-VL-Embedding-2B --backend openai-embeddings --port 8000 --dataset-name random --endpoint /v1/embeddings --random-input 200`.
  - **Accuracy:** MTEB via `VllmEncoderWrapper` (tutorial example task `LeCaRDv2`). This page does not publish a new MTEB score.
