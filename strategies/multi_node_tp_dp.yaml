name: multi_node_tp_dp
deploy_type: multi_node
display_name: "Multi-Node TP + Data Parallel"
short_label: "TP+DP"                  # compact name for tight spots (Preset pills)
orientation: balanced
description: >
  Tensor parallel within each node, data parallel across nodes. By default,
  each node hosts one full model replica; a smaller configured TP allows
  multiple local DP ranks. TP traffic stays inside the node. The head serves
  the cluster through internal load balancing, with headless followers;
  explicitly selecting hybrid load balancing gives every node an HTTP endpoint.

hardware_match:
  min_gpus: 2
  multi_node: true

# Default TP = devices per node. strategy_overrides.multi_node_tp_dp.tp
# (scalar or hardware map) and scoped preset/point TP can select a smaller TP.
# Unless DP sizes are explicit: local DP = devices / TP, global DP = nodes * local DP.
# Worker node N starts at rank N * local DP. PP must be 1 and TP must divide
# the node's device count. vLLM supervises local ranks from one command per node;
# this is separate from Ascend PD's external launcher and per-rank templates.
parallelism: tp_dp

vllm_args: []

parallel_flag: "--tensor-parallel-size"

env:
  GLOO_SOCKET_IFNAME: "$IFACE_NAME"
  NCCL_SOCKET_IFNAME: "$IFACE_NAME"
