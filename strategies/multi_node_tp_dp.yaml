name: multi_node_tp_dp
deploy_type: multi_node
display_name: "Multi-Node TP + Data Parallel"
short_label: "TP+DP"                  # compact name for tight spots (Preset pills)
orientation: balanced
description: >
  Tensor parallel within each node, data parallel across nodes — one
  full model replica per node by default. Recipes may explicitly configure
  smaller TP groups and multiple local DP replicas. TP stays inside the high-bandwidth
  intra-node NVLink domain; the inter-node link carries only DP
  coordination, no tensor traffic. E.g. 2× H200 nodes → TP8·DP2,
  4× GB200/GB300 NVL4 trays → TP4·DP4.

hardware_match:
  min_gpus: 2
  multi_node: true

# "tp_dp" defaults to full-node TP; local DP1 is added only if not configured.
# Global DP defaults to node_count × final local DP, and
# worker node N starts at DP rank N × final local DP; explicit global DP is kept.
# Example: TP4/local DP2 on four 8-device nodes → DP8, follower ranks 2/4/6.
parallelism: tp_dp

vllm_args: []

parallel_flag: "--tensor-parallel-size"

env:
  GLOO_SOCKET_IFNAME: "$IFACE_NAME"
  NCCL_SOCKET_IFNAME: "$IFACE_NAME"
