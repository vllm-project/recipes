name: multi_node_tp_dp
deploy_type: multi_node
display_name: "Multi-Node TP + Data Parallel"
short_label: "TP+DP"                  # compact name for tight spots (Preset pills)
orientation: balanced
description: >
  Tensor parallel within each node, data parallel across nodes — one
  full model replica per node by default. To run smaller TP groups, set TP and
  local DP together in a strategy override, its hardware override, or a preset.
  TP stays inside the high-bandwidth intra-node NVLink domain; the inter-node link carries only DP
  coordination, no tensor traffic. E.g. 2× H200 nodes → TP8·DP2,
  4× GB200/GB300 NVL4 trays → TP4·DP4.

hardware_match:
  min_gpus: 2
  multi_node: true

# Full-node TP and local DP1 override base/variant args.
# Global DP defaults to node_count × final local DP, and
# worker node N starts at DP rank N × final local DP. Global DP overrides
# base/variant args; later strategy, hardware, and preset overrides still win.
# Preset remove_args remains final.
# Example: TP4/local DP2 on four 8-device nodes → DP8, follower ranks 2/4/6.
parallelism: tp_dp

vllm_args: []

parallel_flag: "--tensor-parallel-size"

env:
  GLOO_SOCKET_IFNAME: "$IFACE_NAME"
  NCCL_SOCKET_IFNAME: "$IFACE_NAME"
