name: multi_node_tp_dp
deploy_type: multi_node
display_name: "Multi-Node TP + Data Parallel"
short_label: "TP+DP"                  # compact name for tight spots (Preset pills)
orientation: balanced
description: >
  Tensor parallel within each node, data parallel within and across nodes.
  By default, each node hosts one full-node TP replica. Smaller TP sizes
  allow multiple local replicas. TP stays inside the high-bandwidth
  intra-node NVLink domain; the inter-node link carries only DP
  coordination, no tensor traffic. E.g. 2× H200 nodes → TP8·DP2,
  4× GB200/GB300 NVL4 trays → TP4·DP4.

hardware_match:
  min_gpus: 2
  multi_node: true

# Read by command-synthesis: "tp_dp" defaults to full-node TP and local DP1.
# Final recipe/preset TP and DP arguments determine local replicas, global DP
# and each follower's start rank (node index × local DP).
parallelism: tp_dp

vllm_args: []

parallel_flag: "--tensor-parallel-size"

env:
  GLOO_SOCKET_IFNAME: "$IFACE_NAME"
  NCCL_SOCKET_IFNAME: "$IFACE_NAME"
