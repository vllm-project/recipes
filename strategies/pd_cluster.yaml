name: pd_cluster
deploy_type: pd_cluster
display_name: "Prefill/Decode Disaggregation"
short_label: "PD"                  # compact name for tight spots (Preset pills)
orientation: production
description: >
  Disaggregated prefill/decode cluster. Splits inference into separate
  prefill and decode workers communicating via the selected KV transfer connector.
  Optimal for high-concurrency, low-latency production deployments.
  Each role can be a single-node or multi-node DP/TP/EP pool, with its
  own HTTP port, transfer configuration, and parallelism coordinator.

hardware_match:
  min_gpus: 8
  multi_node: true

# Worker environment follows the Kimi-K2.5 NIXL/MoE pattern.
# CUDA_VISIBLE_DEVICES is set per-rank when running one `vllm serve` per GPU
# (data parallel); omit it if your launcher already pins GPUs.
# The KV transfer wiring (--kv-transfer-config and its env) comes from the
# selected entry of `connectors` below, emitted after each role's vllm_args.
prefill:
  vllm_args:
    - "--port"
    - "8001"
  env:
    NCCL_CUMEM_ENABLE: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_NVLS_ENABLE: "1"
    UCX_NET_DEVICES: "all"

decode:
  vllm_args:
    - "--port"
    - "8002"
    - "--compilation-config"
    - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'

# KV transfer connectors between the prefill and decode pools, picked on the
# builder's PD Connector row (URL ?pd_connector=, a preset's
# select.pd_connector). Each role's `config` is its --kv-transfer-config (an
# object, serialized by synthesis; `{port}` becomes the role's served port)
# and `env` its connector env. KV tiers that compose under PD (the Mooncake
# store, Simple CPU offload on prefill) wrap the selected config in a
# MultiConnector, so a tier never names the transfer connector itself.
#   default: true  — rendered when nothing selects another
#   brands         — hardware brands that run it (absent = all)
#   routers        — PD routers that speak it (absent = vLLM Router only)
#   router         — vllm-router's mode: kv_connector (--kv-connector, nixl
#                    is its default), bootstrap_port (listed after each
#                    prefill endpoint), discovery_port (workers register via
#                    --vllm-discovery-address instead of being listed)
#   install        — extra pip steps (the vLLM images ship them)
#   docker         — host_network / extra runtime flags for the workers
connectors:
  nixl:
    display_name: "NIXL"
    default: true
    description: "NIXL pull transfer: decode reads each request's KV from prefill. Works with every PD router."
    docs: "https://docs.vllm.ai/en/latest/features/nixl_connector_usage.html"
    routers: [vllm, dynamo, smg]
    prefill:
      config: { kv_connector: NixlConnector, kv_role: kv_producer, kv_load_failure_policy: fail }
      env:
        VLLM_NIXL_SIDE_CHANNEL_PORT: "5557"
        # Bind on this prefill node's own IP. Rendered as $PREFILL_NODE_1 by
        # default (rank-0 view); command-synthesis rewrites to $PREFILL_NODE_<rank+1>
        # when the UI shows a non-zero DEP rank.
        VLLM_NIXL_SIDE_CHANNEL_HOST: "$PREFILL_NODE_1"
    decode:
      config: { kv_connector: NixlConnector, kv_role: kv_consumer, kv_load_failure_policy: fail }
      env:
        VLLM_NIXL_SIDE_CHANNEL_PORT: "5558"
        # Same per-node binding pattern as prefill above.
        VLLM_NIXL_SIDE_CHANNEL_HOST: "$DECODE_NODE_1"

  mooncake:
    display_name: "Mooncake"
    description: "Mooncake push transfer over RDMA: prefill writes KV into decode. The router queries each prefill's bootstrap server for its engines. Set WITH_NVIDIA_PEERMEM=0 on hosts without the nvidia-peermem module (GB200)."
    docs: "https://docs.vllm.ai/en/latest/features/mooncake_connector_usage.html"
    brands: [NVIDIA]
    prefill:
      config: { kv_connector: MooncakeConnector, kv_role: kv_producer, kv_load_failure_policy: fail }
      env:
        VLLM_MOONCAKE_BOOTSTRAP_PORT: "8998"
    decode:
      config: { kv_connector: MooncakeConnector, kv_role: kv_consumer, kv_load_failure_policy: fail }
    router: { kv_connector: mooncake, bootstrap_port: 8998 }
    install:
      - note: "Mooncake transfer engine on every prefill / decode node (CUDA 12: mooncake-transfer-engine)"
        command: "uv pip install mooncake-transfer-engine-cuda13"
    docker: { host_network: true, flags: ["--ulimit", "memlock=-1"] }
  mooncakev2:
    display_name: "Mooncake V2 (Ascend)"
    description: "Ascend KV transfer using MooncakeConnectorV2 with independently replicated prefill and decode groups, fronted by the vLLM Ascend load balancing proxy."
    docs: "https://docs.vllm.ai/projects/ascend/en/latest/tutorials/features/pd_disaggregation_mooncake_multi_node.html"
    brands: [Huawei]
    routers: [ascend]
    prefill:
      config: { kv_connector: MooncakeConnectorV2, kv_role: kv_producer, kv_port: "36000" }
    decode:
      config: { kv_connector: MooncakeConnectorV2, kv_role: kv_consumer, kv_port: "36100" }
    router:
      type: ascend-proxy
      launcher_url: "https://raw.githubusercontent.com/vllm-project/vllm-ascend/v0.23.0/examples/external_online_dp/launch_online_dp.py"
      launcher_source: "https://github.com/vllm-project/vllm-ascend/blob/v0.23.0/examples/external_online_dp/launch_online_dp.py"
      script: "/vllm-workspace/vllm-ascend/examples/disaggregated_prefill_v1/load_balance_proxy_server_example.py"
      port: 8000
    docker: { host_network: true }
  moriio:
    display_name: "MoRI-IO"
    description: "ROCm MoRI-IO transfer over RDMA. Workers register with the router (proxy_ip / proxy_ping_port), which discovers them instead of listing endpoints; WRITE mode by default, READ with read_mode."
    docs: "https://docs.vllm.ai/en/latest/features/moriio_connector_usage.html"
    brands: [AMD]
    prefill:
      config:
        kv_connector: MoRIIOConnector
        kv_role: kv_producer
        kv_load_failure_policy: fail
        # proxy_ping_port is the router's discovery port below. Handshake and
        # notify ports differ per role so co-located pools don't collide;
        # notify_port is a base, offset per rank.
        kv_connector_extra_config: { proxy_ip: "$ROUTER_HOST", proxy_ping_port: "36367", http_port: "{port}", handshake_port: "6301", notify_port: "61005" }
    decode:
      config:
        kv_connector: MoRIIOConnector
        kv_role: kv_consumer
        kv_load_failure_policy: fail
        kv_connector_extra_config: { proxy_ip: "$ROUTER_HOST", proxy_ping_port: "36367", http_port: "{port}", handshake_port: "7301", notify_port: "62005" }
    router: { kv_connector: moriio, discovery_port: 36367 }
    install:
      - note: "MoRI on every prefill / decode node (the ROCm image ships it)"
        command: "uv pip install amd_mori"
    docker: { host_network: true, flags: ["--ulimit", "memlock=-1"] }
parallel_flag: "--tensor-parallel-size"

router:
  policy: round_robin

ascend:
  display_name: "Ascend Router"
  description: "vLLM Ascend load-balancing proxy for MooncakeConnectorV2. Routes requests to prefill group heads and every decode node."
  brands: [Huawei]
  docs: "https://docs.vllm.ai/projects/ascend/en/latest/tutorials/features/pd_disaggregation_mooncake_multi_node.html"

# HTTP PD keeps native vLLM workers; registration supplies NIXL metadata.
smg:
  display_name: "SMG"
  description: >
    SMG HTTP router with native vLLM prefill/decode workers and explicit NIXL
    registration. Supports TP/TEP pools without KV offload in this recipe.
  docs: "https://lightseek.org/smg/getting-started/pd-disaggregation#vllm-pd-over-http"
  version: "1.11.0"
  install: 'uv pip install "smg==1.11.0"'
  docker_image: "lightseekorg/smg:1.11.0"
  policy: round_robin
  grpc:
    docs: "https://lightseek.org/smg/getting-started/pd-disaggregation#vllm-pd-over-grpc"
    # Install into the existing model-specific vLLM environment/image.
    # vLLM's bundled LMCache and OpenTelemetry require protobuf below 7.
    packages: '"smg-grpc-servicer>=0.13.0" "smg-grpc-proto>=0.4.22" "protobuf<7"'

# Alternative PD orchestrator: NVIDIA Dynamo. Picked from the "PD Router" row
# under the Strategy row (URL ?pd_router=dynamo). Pools, parallelism and node
# counts are identical to the native path — only the launcher and the front
# door change: each role runs `python3 -m dynamo.vllm --disaggregation-mode
# <role>` (workers register in etcd and talk over the TCP request plane, no
# per-worker HTTP port) and `dynamo.frontend` replaces vllm-router. Reference deployment:
# https://github.com/SemiAnalysisAI/InferenceX/pull/2807 (MiniMax-M3 GB200).
dynamo:
  display_name: "Dynamo"
  description: >
    NVIDIA Dynamo frontend + dynamo.vllm workers. Workers discover each other
    through etcd (TCP request plane, no NATS) instead of fixed HTTP
    endpoints, and the frontend adds KV-aware / least-loaded routing. Same prefill/decode pools as the native
    vLLM router.
  docs: "https://docs.nvidia.com/dynamo/latest/backends/vllm/README.html"
  # Dynamo workers use NIXL/UCX + the NVIDIA runtime wheels — NVIDIA only.
  brands: [NVIDIA]
  # Pinned to the latest Dynamo release (1.5.0). Rendered in the extra-install
  # block while Dynamo is picked; `optional: true` entries are dimmed and left out of Copy-all.
  version: "1.5.0"
  install:
    - note: "NVIDIA Dynamo runtime — on every prefill / decode node and the frontend host"
      command: >-
        uv pip install --extra-index-url https://pypi.nvidia.com
        "ai-dynamo-runtime==1.5.0" "ai-dynamo==1.5.0"
    - note: "Confirm the vLLM / Dynamo versions every node resolved"
      optional: true
      command: >-
        python3 -c 'import importlib.metadata as m; print({p: m.version(p) for p in ("vllm", "ai-dynamo", "ai-dynamo-runtime")})'
  launcher: "python3 -m dynamo.vllm"
  # Dynamo workers take no HTTP --port; the frontend is the only HTTP server.
  remove_args: ["--port"]
  env:
    ETCD_ENDPOINTS: "http://$DYN_CONTROL_IP:2379"
    DYN_NAMESPACE: "vllm-pd"
    # TCP request plane (Dynamo's default) — no NATS server needed.
    DYN_REQUEST_PLANE: "tcp"
  prefill:
    vllm_args:
      - "--disaggregation-mode"
      - "prefill"
      - "--kv-transfer-config"
      - '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail"}'
  decode:
    vllm_args:
      - "--disaggregation-mode"
      - "decode"
      - "--kv-transfer-config"
      - '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail"}'
  infra:
    label: "etcd"
    description: "Control plane — start once on $DYN_CONTROL_IP before any worker or the frontend."
    command: |
      docker run -d --name dynamo-etcd --network host quay.io/coreos/etcd:v3.5.21 \
        etcd --listen-client-urls http://0.0.0.0:2379 \
        --advertise-client-urls http://$DYN_CONTROL_IP:2379
  frontend:
    label: "Frontend"
    router_mode: "round-robin"
