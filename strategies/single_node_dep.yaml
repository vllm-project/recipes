name: single_node_dep
deploy_type: single_node
display_name: "Data + Expert Parallel"
short_label: "DEP"                  # compact name for tight spots (Preset pills)
orientation: throughput
description: >
  Single-node data and expert parallelism for MoE models. Expert layers
  are shared through EP; each DP rank runs the dense layers with its
  configured TP width. TP defaults to 1, and local DP uses the available
  devices divided by TP unless a smaller DP size is explicitly requested.

hardware_match:
  min_gpus: 2
  max_gpus: 8
  multi_node: false
  architecture: moe

vllm_args:
  - "--enable-expert-parallel"
  - "--port"
  - "8100"

# strategy_overrides.single_node_dep.tp and scoped preset/point TP set the
# TP width per DP rank. With PP1, TP * local DP must fit this node; global DP
# equals local DP. One vLLM command supervises all local ranks, unlike the
# external per-rank launch sequence used by grouped Ascend PD.
parallel_flag: "--data-parallel-size"

companion:
  label: "vLLM Router"
  description: >-
    Routes client requests across the DP ranks of the single engine
    process. --intra-node-data-parallel-size must match the engine's
    --data-parallel-size; consistent_hash keeps a conversation pinned to
    the rank that already holds its prefix.
  install: "uv pip install vllm-router"
  start: after
  command: |
    vllm-router \
      --host 0.0.0.0 \
      --port 8000 \
      --policy consistent_hash \
      --intra-node-data-parallel-size {dp_size} \
      --worker-urls http://localhost:{port} \
      --worker-startup-timeout-secs 1800
