name: multi_node_dep
deploy_type: multi_node
display_name: "Multi-Node Data + Expert Parallel"
short_label: "Multi-node DEP"                  # compact name for tight spots (Preset pills)
orientation: throughput
description: >
  Multi-node data and expert parallelism for MoE models, with hybrid load balancing.
  Local DP defaults to the number of devices per node. For mixed TP+DEP, configure
  TP and local DP explicitly. Global DP defaults to node count × local DP, and
  worker node N starts at rank N × local DP. Explicit global DP is preserved.

hardware_match:
  min_gpus: 2
  multi_node: true
  architecture: moe

vllm_args:
  - "--enable-expert-parallel"
  - "--data-parallel-hybrid-lb"

parallel_flag: "--data-parallel-size"

env:
  GLOO_SOCKET_IFNAME: "$IFACE_NAME"
  NCCL_SOCKET_IFNAME: "$IFACE_NAME"
