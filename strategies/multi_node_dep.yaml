name: multi_node_dep
deploy_type: multi_node
display_name: "Multi-Node Data + Expert Parallel"
short_label: "Multi-node DEP"                  # compact name for tight spots (Preset pills)
orientation: throughput
description: >
  Multi-node DEP. By default, each device hosts one attention replica (TP1),
  with expert parallelism across the DP ranks. Larger TP groups reduce the
  number of local replicas. Uses hybrid load balancing across DP workers.

hardware_match:
  min_gpus: 2
  multi_node: true
  architecture: moe

vllm_args:
  - "--enable-expert-parallel"
  - "--data-parallel-hybrid-lb"

parallel_flag: "--data-parallel-size"

env:
  GLOO_SOCKET_IFNAME: "$IFACE_NAME"
  NCCL_SOCKET_IFNAME: "$IFACE_NAME"
