# Reusable check for repositories that host recipes (vllm-project/vllm's
# recipes/, later vllm-omni and vllm-ascend). A caller's pull_request workflow
# runs it against this renderer's main, so a recipe change is validated exactly
# as the bump-sources lock bump will validate it after merge:
#
#   jobs:
#     validate:
#       uses: vllm-project/recipes/.github/workflows/validate-recipes.yml@main
#       with:
#         source: vllm      # the source's name in sources.yaml
#         path: recipes     # directory holding models/ (and overlays/)
#
# Read-only and secret-free, so it also runs for pull requests from forks. The
# validation logic lives in scripts/validate-source.mjs.
name: Validate recipes

on:
  workflow_call:
    inputs:
      source:
        description: "The calling repository's source name in sources.yaml"
        required: true
        type: string
      path:
        description: "Directory in the calling repository that holds models/ (and overlays/)"
        default: recipes
        type: string
      renderer-ref:
        description: "vllm-project/recipes ref to validate against"
        default: main
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the recipes under review
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: source
          sparse-checkout: ${{ inputs.path }}
          persist-credentials: false

      - name: Check out the renderer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: vllm-project/recipes
          ref: ${{ inputs.renderer-ref }}
          path: renderer
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: renderer/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: renderer/pnpm-lock.yaml

      - name: Install renderer dependencies
        working-directory: renderer
        run: pnpm install --frozen-lockfile

      - name: Validate
        working-directory: renderer
        env:
          SOURCE: ${{ inputs.source }}
          SOURCE_DIR: ${{ github.workspace }}/source/${{ inputs.path }}
        run: node scripts/validate-source.mjs --source "$SOURCE" --dir "$SOURCE_DIR"
