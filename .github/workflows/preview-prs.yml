# Branch previews of recipe PRs in source repos (the recipes/ of vllm-project/vllm
# and vllm-project/vllm-ascend). A source PR gets a branch
# `preview/<source>-pr-<N>` here that pins the source to the PR head; Vercel
# deploys it at https://vllm-recipes-git-preview-<source>-pr-<N>-inferact-inc.vercel.app,
# which the source repo links from the PR.
#
# Each source's recipes-preview.yml sends `preview-pr` (client_payload.pr, and
# client_payload.source unless it is vllm) when a recipe PR is opened, pushed,
# reopened or closed; this rebuilds or deletes that PR's branch once the PR has
# been quiet for two minutes. The hourly run covers every source and is a
# fallback for missed dispatches, since GitHub runs scheduled workflows hours
# late. Nothing from a PR is run; Vercel reads its recipes as data, the
# same way it reads them after a lock bump.
name: Preview source PRs

on:
  repository_dispatch:
    types: [preview-pr]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Source repo: vllm or vllm-ascend; empty = every source (vllm with pr)"
        required: false
      pr:
        description: "Only these source PR numbers (comma-separated); empty = all labeled PRs"
        required: false

# Per source and PR: a group keeps only one pending run, so a shared group would
# drop dispatches for other PRs that arrive together. A new dispatch for the
# same PR cancels the waiting one (debounce, see below).
concurrency:
  group: preview-prs-${{ github.event.client_payload.source || inputs.source || 'vllm' }}-${{ github.event.client_payload.pr || inputs.pr || 'all' }}
  cancel-in-progress: ${{ github.event_name == 'repository_dispatch' }}

permissions:
  contents: write

jobs:
  preview:
    if: github.repository == 'vllm-project/recipes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Debounce: a burst of pushes builds one preview, for the last push.
      - name: Wait for the PR to settle
        if: github.event_name == 'repository_dispatch'
        run: sleep 120

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Update preview branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE: ${{ github.event.client_payload.source || inputs.source }}
          PR: ${{ github.event.client_payload.pr || inputs.pr }}
        run: |
          if [ -n "$PR" ] && ! [[ "$PR" =~ ^[0-9]+(,[0-9]+)*$ ]]; then
            echo "Invalid PR number(s): $PR"
            exit 1
          fi
          # vllm's dispatches name no source.
          case "$SOURCE" in
            vllm | vllm-ascend) sources=$SOURCE ;;
            "") if [ -n "$PR" ]; then sources=vllm; else sources="vllm vllm-ascend"; fi ;;
            *) echo "Unknown source: $SOURCE"; exit 1 ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          status=0
          for source in $sources; do
            echo "$source:"
            node scripts/preview-prs.mjs --source "$source" ${PR:+--pr "$PR"} || status=1
          done
          exit $status
