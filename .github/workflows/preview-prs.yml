# Branch previews of recipe PRs in source repos (vllm-project/vllm's recipes/).
# A source PR gets a branch `preview/<source>-pr-<N>` here that pins the source
# to the PR head; Vercel deploys it at
# https://vllm-recipes-git-preview-<source>-pr-<N>-inferact-inc.vercel.app,
# which the source repo links from the PR.
#
# vllm's recipes-preview.yml sends `preview-pr` (client_payload.pr) when a
# recipe PR from an author its CI trusts is pushed, labeled ready or closed;
# this rebuilds or deletes that PR's branch right away. The hourly run only
# refreshes existing branches and deletes those of closed or unlabeled PRs,
# since GitHub runs scheduled workflows late. Nothing from a PR is run; Vercel
# reads its recipes as data, the same way it reads them after a lock bump.
name: Preview source PRs

on:
  repository_dispatch:
    types: [preview-pr]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "Only these source PR numbers (comma-separated); empty = all labeled PRs"
        required: false

# Per PR: a group keeps only one pending run, so a shared group would drop
# dispatches for other PRs that arrive together.
concurrency:
  group: preview-prs-${{ github.event.client_payload.pr || inputs.pr || 'all' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  preview:
    if: github.repository == 'vllm-project/recipes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Update preview branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.client_payload.pr || inputs.pr }}
        run: |
          if [ -n "$PR" ] && ! [[ "$PR" =~ ^[0-9]+(,[0-9]+)*$ ]]; then
            echo "Invalid PR number(s): $PR"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/preview-prs.mjs --source vllm ${PR:+--pr "$PR"}
