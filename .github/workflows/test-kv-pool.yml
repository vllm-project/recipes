name: KV pool tests

on:
  pull_request:
    paths:
      - ".github/workflows/test-kv-pool.yml"
      - "src/**"
      - "scripts/**"
      - "models/**"
      - "strategies/**"
      - "kv_store/**"
      - "taxonomy.yaml"
      - "platforms.yaml"
      - "sources.yaml"
      - "sources.lock.json"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  kv-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test pool deployments, profile sources, and preset selection
        run: >-
          node --test
          scripts/test-pool-deployment.mjs
          scripts/test-pool-profile-sources.mjs
          scripts/test-pool-selection.mjs
