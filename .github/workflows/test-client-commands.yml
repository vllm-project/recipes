name: Client command tests

on:
  pull_request:
    paths:
      - "src/components/recipes/CommandBuilder.jsx"
      - "src/lib/client-commands.js"
      - "scripts/test-client-commands.mjs"
      - ".github/workflows/test-client-commands.yml"
  push:
    branches: [main]
    paths:
      - "src/components/recipes/CommandBuilder.jsx"
      - "src/lib/client-commands.js"
      - "scripts/test-client-commands.mjs"
      - ".github/workflows/test-client-commands.yml"

permissions:
  contents: read

jobs:
  client-commands:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test scripts/test-client-commands.mjs
